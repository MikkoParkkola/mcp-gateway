name: MIK-8408 replay pairs (acceptance)

# Throwaway, never merged. MIK-8408 hoist acceptance: the final head (B,
# keep_replayed_digests: one parse per delivery) against the pre-hoist
# product (A: the two product files as of ddd26df38, copied from
# scripts/ci/mik8408_pre/ over the same tree). Alternating A,B pairs on one
# runner, load logged before each run. Acceptance, fixed before the run by
# the lead: at 384 KiB and N=16 at least an 80% reduction in the median paired
# difference; at N=1 no slower than +2% or 1 ms, whichever is larger.
on:
  push:
    branches: [throwaway/mik-8408-replay-pairs-2]

concurrency:
  group: mik-8408-replay-pairs-2
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  pairs:
    name: Replay A/B pairs (acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build B (final head, one parse per delivery)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bins" out
          cargo test --release --lib --all-features \
            --config profile.release.lto=false --config profile.release.codegen-units=16 \
            --config 'profile.release.panic="unwind"' --no-run --message-format=json \
            | python3 -c 'import json,sys; [print(m["executable"]) for m in map(json.loads, sys.stdin) if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["kind"]==["lib"] and m["profile"]["test"]]' \
            | tail -1 > "$RUNNER_TEMP/b.path"
          cp "$(cat "$RUNNER_TEMP/b.path")" "$RUNNER_TEMP/bins/B.bin"
      - name: Build A (pre-hoist product files from ddd26df38)
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/mik8408_pre/collusion_gate_replay.rs src/security/firewall/collusion_gate_replay.rs
          cp scripts/ci/mik8408_pre/relay_delivered.rs src/gateway/meta_mcp/invoke/relay_delivered.rs
          cargo test --release --lib --all-features \
            --config profile.release.lto=false --config profile.release.codegen-units=16 \
            --config 'profile.release.panic="unwind"' --no-run --message-format=json \
            | python3 -c 'import json,sys; [print(m["executable"]) for m in map(json.loads, sys.stdin) if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["kind"]==["lib"] and m["profile"]["test"]]' \
            | tail -1 > "$RUNNER_TEMP/a.path"
          cp "$(cat "$RUNNER_TEMP/a.path")" "$RUNNER_TEMP/bins/A.bin"
          cmp -s "$RUNNER_TEMP/bins/A.bin" "$RUNNER_TEMP/bins/B.bin" && { echo "A and B are identical"; exit 1; } || true
      - name: Run 7 alternating pairs
        shell: bash
        run: |
          nproc
          scripts/ci/mik8408_pairs.sh "$RUNNER_TEMP/bins" 7 | tee out/pairs.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mik-8408-replay-pairs-2
          path: out
          retention-days: 7
