# Throwaway: MIK-7635 corrupt-profile probe. Lives only on a throwaway
# branch; never merged. Fails when the contract command leaves any corrupt
# profile, and lists every profile by PID so a corrupt gateway profile can be
# attributed to the test binary that ran just before it.
name: Coverage probe

on:
  push:
    branches: ["throwaway/coverage-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: llvm-cov corrupt-profile check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: The contract command (tests only, no report yet)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --all-features --tests --ignore-run-fail > all-run.log 2>&1 || true
          grep -E '^\s+Running|^test result|FAILED|panicked' all-run.log || true
      - name: Profiles by PID, corrupt ones marked
        run: |
          tool="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
          bad=0
          for f in target/llvm-cov-target/*.profraw; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            pid=$(printf '%s' "$b" | sed -E 's/^.*-([0-9]+)-[0-9]+_[0-9]+\.profraw$/\1/')
            size=$(stat -c %s "$f")
            if "$tool" show "$f" > /dev/null 2>&1; then s=ok; else s=CORRUPT; bad=$((bad+1)); fi
            printf '%s %s %s %s\n' "$pid" "$s" "$size" "$b"
          done | sort -n > profiles.txt
          cat profiles.txt
          n=$(grep -c ' CORRUPT ' profiles.txt || true)
          echo "corrupt profiles: $n"
          test "$n" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-7635
          path: |
            all-run.log
            profiles.txt
