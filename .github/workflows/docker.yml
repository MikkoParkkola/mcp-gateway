name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, docs/ranking-1-release-line]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Busts the runtime stage's apt layer once per run. Both builds below read
  # this same value, so the push build still restores the layers the scan build
  # wrote and trivy clears the image that actually ships. Defined here rather
  # than inline so the two cannot drift apart.
  APT_CACHE_BUST: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Dependency-vulnerability gate for the image build. ci.yml runs `cargo audit`
  # on every PR/push; this re-scans the Cargo.lock against OSV so the published
  # image's Rust deps are gated. Pairs with the trivy step below, which gates the
  # base-image OS/library CVEs (osv-scanner reads lockfiles, not image layers).
  # Exceptions are time-boxed in .github/osv-scanner.toml.
  security-gate:
    name: Security gate (block image on known vulns)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Rust dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=.github/osv-scanner.toml
            --recursive
            ./

  # The same gate release.yml runs. A tag push starts this workflow and release.yml
  # independently, so a `needs:` in release.yml cannot reach the image build: without
  # this job an invalid ledger blocks the crates.io release and publishes the container
  # anyway. Duplicated deliberately — a workflow cannot depend on another workflow's job.
  release-criteria:
    name: Release criteria ledger (header matches rows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the counter (fail on parser regression)
        run: python3 scripts/release/test_count_release_criteria.py
      - name: Check the release-criteria ledger header against its rows
        run: python3 scripts/release/count-release-criteria.py --check
      - name: Test supplemental acceptance checks
        run: python3 scripts/release/test_scope_acceptance.py
      - name: Test the tag/manifest publish gate
        run: python3 scripts/release/test_check_tag_manifest.py
      - name: Validate supplemental scope (pending work is reported)
        run: python3 scripts/release/check_scope_acceptance.py --check
      - name: Require completed acceptance in publishing context
        run: python3 scripts/release/check_scope_acceptance.py --publish-check

  build:
    name: Build (${{ matrix.arch }})
    needs: [security-gate, release-criteria]
    # `matrix.os`, not a literal: the hosted-runner guard resolves that one
    # expression against the matrix entries below and checks each image on its
    # own (scripts/ci/check-hosted-runners.sh).
    runs-on: ${{ matrix.os }}
    # Native runners, never QEMU: this image compiles the whole Rust tree, and
    # emulating that on every push to main costs more than the arm64 leg is
    # worth. Each leg also starts its own image on its own architecture, which
    # is the only way an arm64 startup break is observable (NFR.PKG.1).
    strategy:
      # A half-finished matrix must not reach `manifest`: the branch tags are
      # created there from both digests, and one leg alone is not the list.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      # No id-token: this job stopped signing when it stopped pushing tags.
      # Keyless cosign lives in ci.yml's docker-manifest, with the tag it attests.
    # Kept for the branch/PR path's own bookkeeping; the release classification
    # a publisher acts on is now derived in ci.yml, next to the tag it creates.
    outputs:
      is_prerelease: ${{ steps.channel.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag against manifest and classify the channel
        id: channel
        # Tag pushes only; branch and PR builds publish no versioned artifact.
        # This workflow fires on the same tag as release.yml and ci.yml and can
        # read neither one's outputs, so it runs the shared gate itself rather
        # than trusting that another workflow blocked first.
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release/check_tag_manifest.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The semver rows below are inert on a tag: the push step is false
          # there, so ci.yml's docker-manifest is the only creator of
          # :VERSION, :latest and :MAJOR.MINOR, and it carries the prerelease
          # policy described here with them. They stay because this job still
          # computes labels and tag names for the branch build, and because a
          # tag push that reached the build step must name the same things the
          # release publisher does.
          #
          # latest=auto is the action's default, pinned here because the
          # prerelease channel depends on it: it withholds :latest on a
          # prerelease semver, so `docker pull` with no tag cannot land on a
          # candidate. It governs :latest and nothing else.
          #
          # {{major}}.{{minor}} is withheld by a separate mechanism: for a
          # prerelease the action discards the configured pattern and compiles
          # {{version}} instead (metadata-action src/meta.ts, the
          # semver.prerelease branch), so the row below yields :4.0.0-rc.1 and
          # never :4.0. No floating pointer therefore lands on a candidate:
          # the exact version and the immutable :SHA tag from the row below
          # are the only references that reach it, and both are opt-in.
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # Build the image once and load it into the local daemon so trivy can scan
      # the actual artifact's layers BEFORE anything is pushed. This is the
      # image half of the vulnerability gate — osv-scanner (above) gates the Rust
      # deps; trivy gates the base-image OS/library CVEs. The push step reuses the
      # gha build cache, so the second build is a cache hit, not a rebuild.
      - name: Build image for vulnerability scan (load locally, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          # IMAGE_NAME = github.repository carries the original-case owner
          # (MikkoParkkola); Docker tags must be lowercase, so use a lowercase
          # literal for the ephemeral local scan tag (the pushed image uses the
          # metadata-action's already-lowercased tags).
          tags: ${{ env.REGISTRY }}/mikkoparkkola/mcp-gateway:scan
          build-args: |
            APT_CACHE_BUST=${{ env.APT_CACHE_BUST }}
          # Scoped per arch and per workflow: an unscoped scope has both legs
          # writing one cache entry, so each run thrashes the other's layers,
          # and sharing ci.yml's `docker-` scope reproduces that thrash across
          # the two workflows on a tag that fires both.
          cache-from: type=gha,scope=docker-yml-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-yml-${{ matrix.arch }}

      - name: Trivy image scan (block push on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/mikkoparkkola/mcp-gateway:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      # Every other gate in this file inspects the image at rest: trivy reads
      # layers, cosign signs a digest, syft walks a filesystem. None of them
      # start a container, so an image that exits on startup passes all of them
      # and ships. Start it once, before anything is pushed. ci.yml's release
      # publisher calls the same script -- it fires on the same tag and cannot
      # be blocked from here, so it gates itself.
      - name: Smoke test the image (it must start and report healthy)
        run: scripts/ci/smoke-image.sh "${REGISTRY}/mikkoparkkola/mcp-gateway:scan"

      # Push by digest with no tag; `manifest` below creates the branch and sha
      # tags over both legs' digests. Nothing is resolvable by name until it
      # does, so a single-arch image can never answer a `docker pull`.
      #
      # The publish condition is unchanged from when this was one tagged push:
      # main yes, tags no (ci.yml publishes the release manifest list), PRs no.
      # It is repeated on the digest steps below and on `manifest`'s job-level
      # `if:`; a job-level `if:` cannot read a step or an env alias, so the four
      # sites carry the literal expression and must agree.
      #
      # provenance/sbom off: build-push-action v7 attaches a provenance
      # attestation by default on Actions, which makes the pushed artifact an
      # index rather than a single-platform manifest, and an index cannot be a
      # child of `imagetools create`.
      - name: Build and push by digest (no tag)
        id: build
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/mikkoparkkola/mcp-gateway,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_CACHE_BUST=${{ env.APT_CACHE_BUST }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Record the digest for the manifest job
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s' "${DIGEST}" > "digests/${{ matrix.arch }}"
          test -s "digests/${{ matrix.arch }}"

      - name: Upload the digest
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  # Branch protection requires a status check literally named `build`, which the
  # single-runner job used to emit as its own id. Splitting it per architecture
  # renames both legs, so nothing emits that name any more and every pull
  # request stays BLOCKED on a context that can never arrive. This aggregate
  # restores the name. Listing the two leg names in the protection rule instead
  # would break again the next time the matrix changes.
  #
  # `always()` so a skipped or cancelled matrix reports red here rather than
  # leaving the required check pending forever; `needs.build.result` is the
  # aggregate across legs, success only when every leg succeeded.
  build-gate:
    name: build
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert every architecture built
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [ "${RESULT}" != "success" ]; then
            echo "::error::build matrix result: ${RESULT}"
            exit 1
          fi

  # Publishes the multi-arch list and refuses to leave a single-platform image
  # answering to `main` or a sha. The assertion is the gate: `docker manifest
  # inspect` listing only linux/amd64 is what NFR.PKG.1 calls a defect, and it
  # cannot be reintroduced silently while this step runs.
  manifest:
    name: Manifest list (assert both platforms)
    needs: build
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recomputed rather than passed through: the tag names belong to the same
      # action and inputs the build job used, so the two cannot name different
      # things, and a matrix job's outputs are whichever leg finished last.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Download the leg digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Create the manifest list
        id: list
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          AMD64="$(cat digests/amd64)"
          ARM64="$(cat digests/arm64)"
          # Both legs are required. An absent file here means a leg was skipped
          # rather than failed, and a one-platform "list" published under a tag
          # a user pulls is the defect this job exists to prevent.
          test -n "${AMD64}" && test -n "${ARM64}"
          # metadata-action emits one tag per line; buildx takes one --tag each.
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            TAG_ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"
          test "${#TAG_ARGS[@]}" -gt 0
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            --metadata-file create.json \
            "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          # Read this run's index digest out of the create result rather than
          # resolving a tag a second time: a concurrent push to main can move
          # `main` between the two commands, and the assertion below would then
          # pass on a list this run did not build.
          #
          # `imagetools create` nests the digest under `containerimage.descriptor`;
          # only `buildx build` writes a top-level `containerimage.digest`. Reading
          # the build spelling first made the fallback below the permanent path.
          LIST="$(jq -r '."containerimage.descriptor".digest
                         // ."containerimage.digest"
                         // empty' create.json)"
          if [ -n "${LIST}" ]; then
            REF="${IMAGE}@${LIST}"
          else
            # A buildx that spells the create result differently would otherwise
            # fail this step on a correctly published list. Asserting by tag
            # reopens the concurrent-push window described above, so it is said
            # out loud rather than substituted silently.
            echo "::warning::no digest in the create result; asserting by tag"
            REF="${TAG_ARGS[1]}"
          fi
          printf 'ref=%s\n' "${REF}" >> "${GITHUB_OUTPUT}"

      - name: Assert the list carries both platforms
        env:
          REF: ${{ steps.list.outputs.ref }}
        run: |
          set -euo pipefail
          PLATFORMS="$(docker buildx imagetools inspect "${REF}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "published platforms: ${PLATFORMS}"
          for want in linux/amd64 linux/arm64; do
            case " ${PLATFORMS} " in
              *" ${want} "*) ;;
              *) echo "::error::${want} missing from the published manifest list"; exit 1 ;;
            esac
          done

      # This workflow no longer pushes a release tag: ci.yml's docker-build matrix and
      # docker-manifest own ghcr.io/mikkoparkkola/mcp-gateway:VERSION, which
      # removes the two-publisher race (one manifest list, one creator) and the
      # push-before-sign window (#529). There the index is built under a
      # provenance-only sha- tag, signed and verified by digest, and the release
      # tags are then put on that same verified digest -- so no release name is
      # ever resolvable to an unsigned image. The image CVE gate this job
      # pioneered now runs per leg there too (#536). What stays here is the
      # branch and PR path: build, Trivy, and the startup gate, so a break is
      # caught on the pull request that introduces it rather than at the tag.
      #
      # publish-mcp-registry moved to ci.yml with it. It rewrites server.json to
      # name :VERSION and the MCP Registry resolves that reference, so it has to
      # run after the publisher that creates the tag.
