# Throwaway: run tests/task_crash_boundaries.rs 20 times in one job (#2510).
# Lives only on throwaway/loop-* branches; never merged.
name: Crash-boundary loop

on:
  push:
    branches: ["throwaway/loop-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  loop:
    name: task_crash_boundaries x20
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build the test target once
        run: cargo test --test task_crash_boundaries --no-run
      - name: Run it 20 times
        shell: bash
        run: |
          set -u
          pass=0
          for i in $(seq 1 20); do
            log="run-$i.log"
            cargo test --test task_crash_boundaries > "$log" 2>&1
            code=$?
            # A pass needs exit 0 AND the harness summary with 4 passed, 0 failed.
            if [ "$code" -eq 0 ] && grep -q '^test result: ok\. 4 passed; 0 failed' "$log"; then
              pass=$((pass + 1))
              echo "run $i: PASS"
            else
              echo "run $i: FAIL (exit $code)"
              grep -E '^test |panicked at|^test result' "$log" || tail -40 "$log"
            fi
          done
          echo "passed $pass of 20"
          [ "$pass" -eq 20 ]
