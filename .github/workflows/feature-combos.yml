name: Feature combinations

# Heavy job, run once per merge instead of on every pull request: a push to the
# release line or main, and on a tag. A red run here blocks the next merge.
on:
  push:
    branches: [main, docs/ranking-1-release-line]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same branch supersedes an older run, so the latest merge's
# run is the evidence. A tag run gets a group of its own run id and is never
# cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && format('{0}-{1}', github.ref, github.run_id) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  feature-combos:
    name: Feature combinations (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported build combinations recorded in
        # docs/release/v4.0.0-supported-matrix.md. Clippy (pedantic) in ci.yml
        # covers `--all-features --all-targets`; this job pins the rest,
        # including the default feature set users actually get: every optional
        # feature must compile both alone and on top of the defaults.
        #
        # Every combination is linted with `--all-targets`, so a test that names
        # a feature-gated item without the gate fails here, not on the first
        # narrower build after release (MIK-8219).
        #
        # Four shards, not one job per combination: each job holds one of the
        # account's concurrent-job slots. Combinations that share most of their
        # cfg sit in the same shard, so the warm target dir is reused. Every
        # combination still runs; scripts/ci/test_feature_shards.py fails if
        # the union of the shards drifts from the documented matrix.
        include:
          - shard: defaults on
            combos: |
              --features default
              --features spec-preview
              --features task-sdk-recovery
              --features runtime-substrate
          - shard: no defaults 1/3
            combos: |
              --no-default-features
              --no-default-features --features a2a
              --no-default-features --features config-export
              --no-default-features --features cost-governance
              --no-default-features --features discovery
          - shard: no defaults 2/3
            combos: |
              --no-default-features --features firewall
              --no-default-features --features metrics
              --no-default-features --features semantic-search
              --no-default-features --features spec-preview
          - shard: no defaults 3/3
            combos: |
              --no-default-features --features task-sdk-recovery
              --no-default-features --features tool-profiles
              --no-default-features --features runtime-substrate
              --no-default-features --features webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      # One shared cache (saved by the first shard to finish), not one per
      # shard: four extra entries would crowd the 10 GB repository cache the
      # required jobs depend on. The key is explicit so the shards cannot
      # drift into separate entries.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: feature-combos
      # Every target, tests included: a test names a gated item only under
      # its gate. Every combination runs even after one fails; the step fails
      # at the end, naming them all.
      - name: Clippy each combination in the shard
        env:
          COMBOS: ${{ matrix.combos }}
        run: |
          set -uo pipefail
          failed=()
          while IFS= read -r combo; do
            [ -n "$combo" ] || continue
            echo "::group::cargo clippy --all-targets $combo"
            # Word splitting of $combo is intended: it holds cargo flags.
            # shellcheck disable=SC2086
            if ! cargo clippy --all-targets $combo -- -D warnings; then
              failed+=("$combo")
              echo "::error::clippy failed: $combo"
            fi
            echo "::endgroup::"
          done <<< "$COMBOS"
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::failed combinations:%s\n' "$(printf ' [%s]' "${failed[@]}")"
            exit 1
          fi
      # Behavioural, not just compiled: a build without `firewall` must refuse
      # a firewall key and name the feature (COLLUDE.1 2a-i). The unit test in
      # strict_keys.rs covers the table in the default build; this runs the
      # real binary. One shard only: it is a link, not a clippy pass.
      - name: A firewall key names the missing feature
        if: matrix.shard == 'no defaults 1/3'
        run: |
          set -uo pipefail
          cargo build --no-default-features --bin mcp-gateway
          fixture="$RUNNER_TEMP/collusion.yaml"
          printf 'security:\n  firewall:\n    collusion:\n      action: observe\n' > "$fixture"
          chmod 600 "$fixture"
          # A build that accepted the key would start serving: the timeout
          # ends it, and the message check below then fails. The step shell
          # runs with -e, so the expected failure is caught, not propagated.
          if out=$(timeout 60 target/debug/mcp-gateway -c "$fixture" 2>&1); then
            status=0
          else
            status=$?
          fi
          echo "$out"
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::the no-firewall build did not refuse security.firewall (exit $status)"
            exit 1
          fi
          if ! grep -qF 'built without feature "firewall"' <<< "$out" \
            || ! grep -qF 'security.firewall' <<< "$out"; then
            echo "::error::the refusal does not name the firewall feature and key"
            exit 1
          fi
