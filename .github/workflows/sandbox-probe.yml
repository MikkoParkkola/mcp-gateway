name: Sandbox row probe

# A throwaway red-proof branch that never merges: the rows named in
# docs/probe-rows.txt run on this tree as the Linux lib shards run them,
# with user namespaces allowed, the gateway binary built here and the
# sandbox required, so a row that cannot run fails instead of skipping.
# A push trigger on its own branch prefix: no other workflow's push filter
# matches these branches, so a probe costs one hosted runner.
on:
  push:
    branches: ["throwaway/p954*-red-*"]

permissions:
  contents: read

jobs:
  rows:
    name: Sandbox rows (probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/add-swap
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
      # Restore only: a probe's save would evict entries the merge-evidence jobs use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Allow unprivileged user namespaces (preview sandbox tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the gateway binary for the sandbox rows
        run: scripts/ci/with-memory-log.sh cargo build --all-features --bin mcp-gateway
      - name: Run the probe's rows
        env:
          PREVIEW_SANDBOX_REQUIRED: "1"
          PREVIEW_SANDBOX_GATEWAY_BIN: ${{ github.workspace }}/target/debug/mcp-gateway
        run: |
          set -uo pipefail
          mapfile -t rows < <(grep -v '^#' docs/probe-rows.txt | grep .)
          [ "${#rows[@]}" -gt 0 ] || { echo "::error::docs/probe-rows.txt names no row"; exit 1; }
          scripts/ci/with-memory-log.sh cargo test --all-features --lib --no-fail-fast -- --exact "${rows[@]}" 2>&1 | tee "$RUNNER_TEMP/rows.log"
          rc=${PIPESTATUS[0]}
          if ! grep -Eq "^running ${#rows[@]} tests?$" "$RUNNER_TEMP/rows.log"; then
            echo "::error::expected ${#rows[@]} rows to run"
            exit 1
          fi
          exit "$rc"
