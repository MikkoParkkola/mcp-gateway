name: Reload now mutants (one-off)

# One-off probe on a throwaway branch, never merged: applies each Reload-now
# mutant patch in ui-tests/mutants-9593/ to a clean tree, runs only the rows
# that must kill it, judges from Playwright's own result, and reverts (run.sh).
# It also takes the frame-26 screenshots for the review-carried comparison.
# Fires only on pushes to its own branch.
on:
  push:
    branches: ["throwaway/mut-9582-ui-tests"]

permissions:
  contents: read

jobs:
  mutants:
    name: Reload now mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: ui-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Packages from the lock file, no install scripts
        run: npm ci --ignore-scripts
      - name: Chromium and its system libraries
        run: |
          npx playwright install chromium
          timeout 600 npx playwright install-deps chromium || echo "::warning::system libraries not installed; using the runner image's"
      - name: Mutants, one at a time
        # Runs even when the screenshots failed; only a cancel stops it.
        if: ${{ !cancelled() }}
        env:
          CI: 'true'
        run: bash mutants-9593/run.sh
      - name: Keep the verdicts, logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mut-9593
          path: |
            ui-tests/mutant-out/
            ui-tests/frame-out/
          if-no-files-found: warn
          retention-days: 14
