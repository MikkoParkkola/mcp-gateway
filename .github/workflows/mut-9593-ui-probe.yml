name: Add-a-server mutants (one-off)

# One-off probe on a throwaway branch, never merged: applies each add-server
# mutant patch in ui-tests/mutants-9566/ to a clean tree, runs only the row
# that must kill it, judges it at its killing line, and reverts (run.sh).
# Harness reused from the server Settings probe. Fires only on its own branch.
on:
  push:
    branches: ["throwaway/mut-9566-ui"]

permissions:
  contents: read

jobs:
  mutants:
    name: Add-a-server mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: ui-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Packages from the lock file, no install scripts
        run: npm ci --ignore-scripts
      - name: Chromium and its system libraries
        run: |
          npx playwright install chromium
          timeout 600 npx playwright install-deps chromium || echo "::warning::system libraries not installed; using the runner image's"
      - name: Mutants, one at a time
        if: ${{ !cancelled() }}
        env:
          CI: 'true'
        run: bash mutants-9566/run.sh
      - name: Keep the verdicts, logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mut-9566
          path: |
            ui-tests/mutant-out/
          if-no-files-found: warn
          retention-days: 14
