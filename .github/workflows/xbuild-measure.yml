# Throwaway measurement (never merged): the macOS lib test binary cross-built for arm64 on the Intel runner, once
# with a cold cache (which it then saves) and once warm, with limits wide enough that both finish. Read the
# "Cross-build" step durations from the jobs API.
name: macOS xbuild measure (throwaway)
on:
  push:
    branches: ["throwaway/xbuild-measure-*"]
permissions:
  contents: read
jobs:
  cold:
    name: xbuild measure cold
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xbuild-measure
      - name: Cross-build (cold)
        timeout-minutes: 110
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          CARGO_BUILD_JOBS: 4
        run: python3 scripts/ci/shard_tests.py export-lib "$RUNNER_TEMP/lib-bin"
  warm:
    name: xbuild measure warm
    needs: cold
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xbuild-measure
      - name: Cross-build (warm)
        timeout-minutes: 110
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          CARGO_BUILD_JOBS: 4
        run: python3 scripts/ci/shard_tests.py export-lib "$RUNNER_TEMP/lib-bin"
