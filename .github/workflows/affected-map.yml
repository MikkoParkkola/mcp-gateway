# The per-test file map (scripts/ci/affected_map.py): which repository files each test unit executed, opened,
# listed or probed, built on Linux with coverage and a file-access trace. Built on pushes to the release line, at
# most once in 20 hours (the first job ends the run early while the newest map is younger), and published as a
# cache only this workflow saves, only on such a push (scripts/ci/cache_writers.py rule R11). Nothing reads it yet.
# No schedule: GitHub fires schedules only from the default branch's copy of a workflow.
name: Affected-tests map

on:
  push:
    branches: [docs/ranking-1-release-line]
  workflow_dispatch:

# Release-line pushes share one group, so one map runs and one waits; nothing is cancelled. Every other run (a
# dispatch) has a group of its own.
concurrency:
  group: >-
    affected-map-${{ (github.event_name == 'push' && github.ref == 'refs/heads/docs/ranking-1-release-line') && 'release-line'
    || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Instrumented frames are bigger; the 2 MiB default overflows.
  RUST_MIN_STACK: "8388608"
  MAP_RUST: "1.99.1"

jobs:
  guard:
    name: Map age and parts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.age.outputs.build }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest map by key prefix; the exact key never exists, so the prefix decides.
      - name: The newest published map
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: map/affected-map.json
          key: affected-map-none-${{ github.run_id }}
          restore-keys: affected-map-
      # A dispatch always builds (and never publishes); a push builds when no map is younger than 20 hours.
      - name: Build the map now?
        id: age
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != push ]; then
            echo "build=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/ci/affected_map.py guard map/affected-map.json "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_OUTPUT"
      - name: The parts
        id: plan
        run: echo "parts=$(python3 scripts/ci/affected_map.py parts)" | tee -a "$GITHUB_OUTPUT"

  part:
    name: Map part ${{ matrix.part }}
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.guard.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/add-swap
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.MAP_RUST }}
          components: llvm-tools-preview
      - name: strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - name: The part's units, each traced with coverage on
        env:
          PART: ${{ matrix.part }}
        run: python3 scripts/ci/shard_tests.py with-home -- python3 scripts/ci/affected_map.py part "$PART" "$RUNNER_TEMP/part"
      # A lib part also keeps its binary, so the merge can split a heavy group deeper on this run's own times.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-map-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/part/part.json
            ${{ runner.temp }}/part/bin
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Map
    needs: [guard, part]
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/add-swap
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.MAP_RUST }}
          components: llvm-tools-preview
      - name: strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - name: Fetch the parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: affected-map-*
          path: ${{ runner.temp }}/parts
      # The artifact round trip drops the exec bit.
      - name: The part binaries are executable
        run: find "$RUNNER_TEMP/parts" -path '*/bin/p*/lib-tests-p*' -type f -exec chmod +x {} +
      - name: The map
        env:
          SHA: ${{ github.sha }}
        run: python3 scripts/ci/shard_tests.py with-home -- python3 scripts/ci/affected_map.py merge "$SHA" "$RUNNER_TEMP"/parts/affected-map-* map
      - name: Publish the map
        if: github.ref == 'refs/heads/docs/ranking-1-release-line' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: map/affected-map.json
          key: affected-map-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affected-map
          path: map/affected-map.json
          retention-days: 7
          if-no-files-found: error
