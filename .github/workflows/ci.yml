name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches:
      [
        main,
        docs/ranking-1-release-line,
        chore/v4-reconcile-main,
        "codex/v4-*",
        fix/mrtr2-continuation-handle,
      ]
  # Rehearsal path for the container publish (NFR.PKG.1). docker-build and
  # docker-manifest fire on a `v*` tag only, so their first execution would
  # otherwise be the real release publish, and no probe tag can stand in:
  # the tag/manifest gate refuses any tag the manifest version does not
  # match. A dispatch with this input true runs both jobs up to the
  # both-platforms assertion and stops before every release name, signature
  # and registry listing. Default false: a dispatch that leaves it alone
  # runs the same jobs as a branch push, which is none of them.
  workflow_dispatch:
    inputs:
      rehearse_manifest:
        description: Build both arches and assemble the provenance-tagged index, promoting no release tag
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # The external journey is executed by the mandatory SDK job below.
      # Not a flake skip (MIK-7534): it needs Python and Redis, which only
      # that job provisions, and the gate below `needs` that job.
      - run: cargo test --all-features --no-fail-fast -- --skip a_real_sdk_job_outlives_the_gateway_and_its_owner_reads_the_result
