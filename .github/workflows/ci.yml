name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches:
      [
        main,
        docs/ranking-1-release-line,
        chore/v4-reconcile-main,
        "codex/v4-*",
        fix/mrtr2-continuation-handle,
      ]
  # Rehearsal path for the container publish (NFR.PKG.1). docker-build and
  # docker-manifest fire on a `v*` tag only, so their first execution would
  # otherwise be the real release publish, and no probe tag can stand in:
  # the tag/manifest gate refuses any tag the manifest version does not
  # match. A dispatch with this input true runs both jobs up to the
  # both-platforms assertion and stops before every release name, signature
  # and registry listing. Default false: a dispatch that leaves it alone
  # runs the same jobs as a branch push, which is none of them.
  workflow_dispatch:
    inputs:
      rehearse_manifest:
        description: Build both arches and assemble the provenance-tagged index, promoting no release tag
        type: boolean
        default: false
      rehearse_packaged_suite:
        description: Run the full test suite from the packaged crate (packaged-suite.yml), as a merge would
        type: boolean
        default: false
      rehearse_binary_signing:
        description: Sign one release binary into a draft release, verify what it serves, then delete it
        type: boolean
        default: false
      rehearse_all_targets:
        description: With rehearse_binary_signing, also build every release target with cargo auditable and check its SBOM
        type: boolean
        default: true
      rehearse_chart_publish:
        description: Publish and sign the Helm chart into the separate charts-rehearsal package, from a pinned signed image
        type: boolean
        default: false

# A new push to a pull request cancels that PR's superseded run. Every other
# event (branch push, tag, dispatch) gets a group of its own run id, so it is
# never cancelled, and never queued behind or replaced by another run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Decides whether a pull request changes documentation only (every changed
  # path under docs/, or a Markdown/text file at the repository root; see
  # scripts/ci/changed-scope.sh). A docs-only PR skips the build, lint, feature,
  # Helm/kind and smoke jobs, and still runs every test that reads documentation
  # (the full `Tests` job), plus hygiene, secret scans, public claims, the
  # release ledger and file-size checks. Pushes and tags never skip anything.
  #
  # Fail-open: a skippable job runs unless this job SUCCEEDED and said
  # docs_only=true. A failed or cancelled decision therefore runs everything;
  # it can never turn into a skipped (and so passing) required check.
  scope:
    name: Decide whether the change is docs-only
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/ci/changed-scope.sh --self-test
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci/changed-scope.sh "$MERGE_SHA" "$PR_NUMBER" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          fi
  public-repo-hygiene:
    name: Public repo hygiene
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate public repo hygiene scripts
        run: bash -n scripts/dev/check-public-repo-hygiene.sh tests/public_repo_hygiene.sh scripts/dev/check-commit-message-hygiene.sh tests/commit_message_hygiene.sh
      - name: Validate public repo hygiene fixtures
        run: tests/public_repo_hygiene.sh
      - name: Validate commit message hygiene fixtures
        run: tests/commit_message_hygiene.sh
      - name: Validate the commit messages this branch adds
        if: github.event_name == 'pull_request'
        run: scripts/dev/check-commit-message-hygiene.sh "origin/${{ github.base_ref }}..HEAD"
      - name: Validate tracked public docs boundary
        run: scripts/dev/check-public-repo-hygiene.sh
      - name: Enforce the Noncommercial license header on every source file
        run: scripts/ci/check-license-headers.sh
      - name: Verify license files ship in every packaged artifact
        run: scripts/ci/verify-artifact-licenses.sh
      - name: Validate the license check against broken notices
        run: tests/artifact_licenses.sh
      - name: Validate the hosted-runner guard
        run: scripts/ci/check-hosted-runners.sh --self-test
      - name: Require GitHub-hosted runners (plus the one trusted label)
        run: scripts/ci/check-hosted-runners.sh
      - name: Validate the trusted runner's admission rules
        run: scripts/ci/trusted-runner/job-started.sh --self-test
      - name: Validate the mutant batch classifier
        run: python3 scripts/ci/mutants/run_mutants.py --self-test
      - name: Validate throwaway and mutant-row routing (hosted until the trusted runner is ready)
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
          python3 scripts/ci/test_throwaway_routing.py
      - name: Validate that release-line PRs changing the image build it
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
          python3 scripts/ci/test_docker_pr_scope.py
      - name: Validate docs-only gating (classifier and job routing)
        run: |
          bash scripts/ci/changed-scope.sh --self-test
          python3 scripts/ci/test_docs_only_gating.py
      - name: Validate the feature-combination shards against the documented matrix
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
          python3 scripts/ci/test_feature_shards.py
      - name: Validate the 800-LOC ratchet
        run: scripts/ci/check-loc-ceiling.sh --self-test
      - name: Hold the 800-LOC ceiling deviation at its current count
        run: scripts/ci/check-loc-ceiling.sh

  service-template-smoke:
    name: Service template smoke
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Validate service-template smoke script
        run: bash -n scripts/dev/service-template-smoke.sh
      - name: Validate single-node templates with generated config
        run: scripts/dev/service-template-smoke.sh

  usability-smoke:
    name: First-use usability smoke
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Validate first-use smoke scripts
        # One file per `bash -n`: it checks only its first argument.
        run: for f in scripts/dev/usability-smoke.sh scripts/dev/first-run-smoke.sh scripts/dev/smoke-fixture-capability.sh; do bash -n "$f"; done
      - name: Validate noninteractive setup and routed first call
        run: scripts/dev/usability-smoke.sh

  # NFR.UPGRADE.1: upgrade a real 3.5.1 deployment to this tree's build, flip
  # modern-off, roll back, and check config, credentials, permissions, mounts
  # and active callers survive. The script exits 1 on any FAIL check; the
  # results step also fails on a missing results file or a skipped check.
  upgrade-rehearsal:
    name: Upgrade rehearsal (3.5.1 -> this build)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The v3.5.1 release asset, pinned: SHA256SUMS.txt comes from the same
      # release, so the inline hash is the check that does not trust it.
      BIN_351_SHA256: 198b2d7a134286baeb4b42228436325fdf597c804a9d108fc83b1cb77fe7e157
      # Every check the script records, in order. Pinned as ids rather than a
      # count so a dropped check cannot be masked by a duplicate or a new one.
      # Update together with the script when a check is added or removed.
      EXPECTED_CHECKS: >-
        PHASE1.BASELINE_INITIALIZE PHASE1.ACTIVE_CALLER_BASELINE
        PHASE1.STAMP_WRITTEN PHASE2.STAMP_ADVANCED PHASE2.CONFIG_PRESERVED
        PHASE2.CREDENTIALS_PRESERVED PHASE2.PERMISSIONS_AND_MOUNTS_PRESERVED
        PHASE2.API_KEY_MIGRATED_TO_DIGEST PHASE2.MODERN_INITIALIZE_ON
        PHASE2.MODERN_DISCOVER_ADVERTISES PHASE2.ACTIVE_CALLER_POST_UPGRADE
        PHASE2.AUDIT_LOG_WRITTEN PHASE3.MODERN_OFF_INITIALIZE_REFUSED
        PHASE3.MODERN_OFF_DISCOVER_HIDES PHASE4.STAMP_UNCHANGED
        PHASE4.DOWNGRADE_WARNING_LOGGED PHASE4.GATEWAY_STARTS_NORMALLY
        PHASE4.ACTIVE_CALLER_POST_ROLLBACK
        PHASE4.CONFIG_AND_CREDENTIALS_STILL_INTACT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # rg, PyYAML, lsof and shasum are all called by the script; a missing rg
      # would read as a missing downgrade warning, not as a missing tool.
      - name: Install and check the script's tools
        run: |
          set -euo pipefail
          echo "RUN_DIR=$RUNNER_TEMP/nfr-upgrade-1" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep python3-yaml lsof
          rg --version
          command -v python3
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'
          command -v lsof shasum curl
      - name: Download the v3.5.1 release binary
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIR/bin351"
          cd "$RUN_DIR/bin351"
          base=https://github.com/MikkoParkkola/mcp-gateway/releases/download/v3.5.1
          curl -fsSL -o mcp-gateway-linux-x86_64 "$base/mcp-gateway-linux-x86_64"
          curl -fsSL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          sha256sum -c --ignore-missing SHA256SUMS.txt
          echo "$BIN_351_SHA256  mcp-gateway-linux-x86_64" | sha256sum -c -
          chmod +x mcp-gateway-linux-x86_64
      - name: Build this tree
        run: cargo build --locked
      - name: Run the rehearsal
        run: |
          set -euo pipefail
          export BIN_351="$RUN_DIR/bin351/mcp-gateway-linux-x86_64"
          export BIN_400="$GITHUB_WORKSPACE/target/debug/mcp-gateway"
          export RESULTS_JSON="$RUN_DIR/results.json"
          export RUN_DIR="$RUN_DIR/run"
          bash scripts/release/nfr_upgrade_1_rehearsal.sh
      - name: Check and report every result
        if: always()
        run: |
          set -euo pipefail
          python3 - "$RUN_DIR/results.json" "$EXPECTED_CHECKS" <<'PY'
          import json, os, sys
          path, expected = sys.argv[1], sys.argv[2].split()
          rows = json.load(open(path))
          ids = [r["id"] for r in rows]
          lines = ["| check | status |", "|---|---|"]
          lines += [f"| {r['id']} | {r['status']} |" for r in rows]
          passed = sum(r["status"] == "PASS" for r in rows)
          lines.append(f"\n{passed}/{len(rows)} PASS ({len(expected)} expected)")
          if ids != expected:
              lines.append(f"\nCheck ids differ from the pinned list: got {ids}")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## NFR.UPGRADE.1 rehearsal\n\n" + "\n".join(lines) + "\n")
          sys.exit(0 if ids == expected and passed == len(rows) else 1)
          PY
      - name: Upload rehearsal logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-rehearsal-logs
          path: ${{ runner.temp }}/nfr-upgrade-1
          if-no-files-found: ignore

  helm-chart-smoke:
    name: Helm chart lint + render
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: the goldens are Helm 4 renders, and `latest` falls back to
      # v3.18.4 whenever the release lookup fails, which drifts them.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Validate helm chart smoke script
        run: bash -n scripts/dev/helm-chart-smoke.sh
      - name: Lint, render, and schema-validate the chart
        run: scripts/dev/helm-chart-smoke.sh

  helm-oci-roundtrip:
    name: Helm OCI package/push/pull
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Package, push to OCI, pull, and render the same artifact
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          helm package deploy/helm/mcp-gateway -d "$out"
          helm package deploy/helm/mcp-gateway-crds -d "$out"
          for tgz in "$out"/*.tgz; do
            helm push "$tgz" oci://localhost:5000/charts --plain-http
          done
          # Pull the app chart back and render the pulled artifact.
          ver="$(grep -E '^version:' deploy/helm/mcp-gateway/Chart.yaml | awk '{print $2}')"
          mkdir -p "$out/pulled"
          helm pull oci://localhost:5000/charts/mcp-gateway --version "$ver" -d "$out/pulled" --plain-http
          test -f "$out/pulled/mcp-gateway-$ver.tgz"
          helm template t "$out/pulled/mcp-gateway-$ver.tgz" | grep -q '^kind: Deployment'
          echo "OCI round-trip ok: pushed + pulled + rendered mcp-gateway $ver"

  helm-supply-chain:
    name: Helm supply chain (cosign + SBOM)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Validate supply-chain smoke script
        run: bash -n scripts/dev/helm-supply-chain-smoke.sh
      - name: Sign + verify chart and image by digest, assert SBOM
        run: scripts/dev/helm-supply-chain-smoke.sh

  helm-airgap:
    name: Helm air-gap export/import
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
      airgap:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Validate air-gap smoke script
        run: bash -n scripts/dev/helm-airgap-smoke.sh
      - name: Export to bundle, import to isolated registry, verify + install offline
        run: scripts/dev/helm-airgap-smoke.sh

  k8s-kind-rollback:
    name: K8s kind apply+upgrade+rollback
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate kind rollback smoke script
        run: bash -n deploy/kubernetes/enterprise-alpha/scripts/kind-rollback-smoke.sh
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: mcp-gateway-rollback-smoke
      - name: Apply, upgrade, and roll back on the real cluster
        env:
          # kind-action already created the cluster and set the kube context;
          # the smoke reuses it (and must not delete it — the action owns teardown).
          MCP_GATEWAY_KIND_CLUSTER: mcp-gateway-rollback-smoke
          MCP_GATEWAY_KIND_KEEP: "1"
        run: deploy/kubernetes/enterprise-alpha/scripts/kind-rollback-smoke.sh
      - name: Validate helm kind lifecycle script
        run: bash -n scripts/dev/helm-kind-lifecycle.sh
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Helm install, upgrade, and rollback on the real cluster
        env:
          MCP_GATEWAY_KIND_CLUSTER: mcp-gateway-rollback-smoke
          MCP_GATEWAY_KIND_KEEP: "1"
        run: scripts/dev/helm-kind-lifecycle.sh

  check:
    name: Clippy (pedantic)
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # Here because this job is a required Linux check: the futures' depth
      # margin below rustc's recursion limit, which Windows and Kani exceed
      # first (MIK-7678).
      - name: Trait-recursion margin
        run: scripts/ci/check-recursion-margin.sh

  # Feature combinations run post-merge only: see feature-combos.yml.

  windows-check:
    name: Windows check
    # Waits for the Linux suite: a red head never takes one of the account's
    # few concurrent runner slots for a Windows run that cannot pass.
    needs: test
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Every test target still has to compile for Windows. The run below is
      # a subset, and this is what catches a unix-only API slipping into any
      # target it does not run.
      - run: cargo test --all-features --no-run
      # The unoptimized exe must start. Clap's derived parser needs ~900 KB of
      # stack in a debug build, over Windows' 1 MiB main-thread default, so
      # every test that spawns the binary died before parsing its arguments.
      - name: The debug exe starts
        shell: bash
        run: |
          set +e
          out=$(./target/debug/mcp-gateway.exe --version 2>&1)
          rc=$?
          echo "$out"
          echo "--version exited $rc"
          [[ $rc -eq 0 && "$out" == mcp-gateway\ * ]] || exit 1
          # A status the command returns (not a clap exit) reaches the shell:
          # an empty key makes `hash-key` return ExitCode 2.
          printf '' | ./target/debug/mcp-gateway.exe hash-key
          rc=$?
          echo "hash-key on an empty key exited $rc"
          [[ $rc -eq 2 ]]
      # The Windows-only modules (`win_acl`, the one module allowed `unsafe`
      # under ADR-016, and `private_fs`) compile nowhere else, so the Linux
      # clippy jobs never see them. Lint them where they compile.
      # `unnecessary_wraps` is allowed here only: it fires on the existing
      # non-unix no-op stubs, which keep the unix signature on purpose.
      - run: >-
          cargo clippy --all-targets --all-features --
          -D warnings -A clippy::unnecessary_wraps
      # Symlink creation for the no-follow row (W-T6): Developer Mode lets a
      # non-elevated token create symlinks, so the row runs rather than skips.
      - name: Allow symlink creation
        shell: pwsh
        run: >-
          New-ItemProperty -Force -PropertyType DWORD -Value 1 -Name AllowDevelopmentWithoutDevLicense
          -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock
      # Every test target: library, binary and the integration targets under
      # tests/. The store suites are included: both stores run on Windows with
      # owner-only DACLs (ADR-016). Windows-only limits are `cfg(unix)` gates.
      # mik_7479_full_burst is skipped as in `test` (MIK-7644): 1,026 calls miss
      # its deadline on this runner. The exactly-one-terminal-frame property
      # still runs here at 194 calls (ac_mrtr_7b_every_call_reaches_one_terminal_frame),
      # and the full burst runs in mrtr7b-full-burst.yml (MIK-7479).
      - run: cargo test --all-features --tests --no-fail-fast -- --show-output --skip mik_7479_full_burst
      # Owner-only rows that need real Windows state: a second, non-admin
      # account (the runner is an administrator, whose rights bypass DACLs), a
      # mapped network drive, and FAT32/exFAT volumes. Runs after the suite
      # even when it failed, so no evidence hides behind an earlier failure.
      - name: Privileged owner-only rows
        id: privileged
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
          $free = 68..90 | ForEach-Object { [char]$_ } | Where-Object { -not (Test-Path "${_}:\") }
          # Second user: Users only, never Administrators.
          $pass = 'Mg1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          $account = New-LocalUser -Name mgw-probe -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -AccountNeverExpires
          if ((Get-LocalGroupMember Administrators).Name -match 'mgw-probe') { throw 'mgw-probe is an administrator' }
          $sid = $account.SID.Value
          secedit /export /cfg "$env:RUNNER_TEMP\sec.inf" /areas USER_RIGHTS | Out-Null
          (Get-Content "$env:RUNNER_TEMP\sec.inf") -replace '^(SeInteractiveLogonRight = .*)$', "`$1,*$sid" | Set-Content "$env:RUNNER_TEMP\sec.inf"
          secedit /configure /db "$env:RUNNER_TEMP\sec.sdb" /cfg "$env:RUNNER_TEMP\sec.inf" /areas USER_RIGHTS | Out-Null
          Set-Service seclogon -StartupType Manual; Start-Service seclogon
          # Mapped network drive.
          $net = $free[0]
          net use "${net}:" \\localhost\C$
          if ($LASTEXITCODE -ne 0) { throw 'net use failed' }
          New-Item -ItemType Directory -Force "${net}:\mgw-net-root" | Out-Null
          # FAT32 and exFAT volumes.
          $vols = @(@{ fs = 'FAT32'; letter = $free[1] }, @{ fs = 'exFAT'; letter = $free[2] })
          foreach ($v in $vols) {
            $vhd = "$env:RUNNER_TEMP\mgw-$($v.fs).vhdx"
            @("create vdisk file=`"$vhd`" maximum=64 type=expandable", "select vdisk file=`"$vhd`"",
              'attach vdisk', 'create partition primary', "format fs=$($v.fs) quick",
              "assign letter=$($v.letter)") | Set-Content "$env:RUNNER_TEMP\dp.txt"
            diskpart /s "$env:RUNNER_TEMP\dp.txt"
            if ($LASTEXITCODE -ne 0) { throw "diskpart $($v.fs) failed" }
          }
          $env:MGW_PROBE_USER = 'mgw-probe'
          $env:MGW_PROBE_PASS = $pass
          $env:MGW_NET_ROOT = "${net}:\mgw-net-root"
          $env:MGW_FAT32_ROOT = "$($free[1]):\"
          $env:MGW_EXFAT_ROOT = "$($free[2]):\"
          cargo test --all-features --lib -- --ignored --show-output win_privileged::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-check:
    name: macOS check
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # macOS is a shipped target, and every test target has to compile for
      # it: a Linux-only API in a unix-gated test breaks the whole lib suite
      # on a Mac without any other job noticing.
      - run: cargo test --all-features --no-run

  test:
    name: Tests
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Each skip names the job that runs the test in full, and its ticket:
      #   a_real_sdk_job_outlives_...: job `task-sdk-recovery`, MIK-7534.
      #   mik_7479_full_burst: workflow mrtr7b-full-burst.yml, MIK-7479;
      #   release.yml `verify` needs it green on the released revision.
      # The external journey is executed by the mandatory SDK job below.
      # Not a flake skip (MIK-7534): it needs Python and Redis, which only
      # that job provisions, and the gate below `needs` that job.
      - run: cargo test --all-features --no-fail-fast -- --skip a_real_sdk_job_outlives_the_gateway_and_its_owner_reads_the_result --skip mik_7479_full_burst

  # The test run for red-first and mutation-proof pull requests: a same-repo
  # `throwaway/` branch into the release line. Every other job in this file
  # skips those runs (the inverse condition above each job), so a throwaway
  # PR costs one runner. Merge evidence stays on the hosted `Tests` job, which
  # every other pull request and push still runs.
  #
  # Two jobs, one name (`Tests (throwaway)`, never `Tests`: main requires
  # `Tests`, and a skipped job of that name would read as passing there). The
  # repository variable MCPGW_TRUSTED_RUNNER picks the host: unset, a hosted
  # runner; `ready`, the project's own self-hosted runner, which is set only
  # after that runner's registration checklist is complete. `runs-on` stays a
  # literal on both, so the hosted-runner guard still reads every label.
  test-throwaway-hosted:
    name: Tests (throwaway)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/') && vars.MCPGW_TRUSTED_RUNNER != 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release tooling's Python suites, which `release-script-tests` runs
      # but which that job skips here. Without this, a throwaway meant to show
      # a workflow-wiring or release-script test going red passes on cargo
      # alone. Every suite runs and all failures are reported; seconds, no cargo.
      - name: Install PyYAML 6.0.2 (the cosign floor parses workflows)
        run: python3 -c 'import sys, yaml; sys.exit(yaml.__version__ != "6.0.2")' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
      - name: Release tooling Python suites
        run: |
          set -uo pipefail
          fail=0
          for suite in scripts/release/test_*.py; do
            echo "::group::$suite"
            python3 "$suite" || { echo "::error::$suite failed"; fail=1; }
            echo "::endgroup::"
          done
          exit "$fail"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Restore only: saving from throwaway runs would evict the entries the
      # merge-evidence jobs rely on from the shared 10 GB repository cache.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: false
      # Each skip names the job that runs the test in full, and its ticket:
      #   a_real_sdk_job_outlives_...: job `task-sdk-recovery`, MIK-7534.
      #   mik_7479_full_burst: workflow mrtr7b-full-burst.yml, MIK-7479;
      #   release.yml `verify` needs it green on the released revision.
      - run: cargo test --all-features --no-fail-fast -- --skip a_real_sdk_job_outlives_the_gateway_and_its_owner_reads_the_result --skip mik_7479_full_burst

  # Same run on the self-hosted arm64 runner. Mutation evidence asks whether a
  # named test fails on a mutant and passes on the fix; that is logic, not
  # instruction set (nothing in the tree is conditional on the target
  # architecture). The condition is not the security boundary: a fork's pull
  # request runs its own copy of this file. The runner refuses any job that is
  # not a same-repo `throwaway/` pull request into the release line before a
  # step runs (scripts/ci/trusted-runner/), and fork workflows need approval.
  # No secrets and a read-only token, since the runner is persistent.
  test-trusted:
    name: Tests (throwaway)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/') && vars.MCPGW_TRUSTED_RUNNER == 'ready' }}
    runs-on: mcpgw-trusted-arm64
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release tooling's Python suites, which `release-script-tests` runs
      # but which that job skips here. Without this, a throwaway meant to show
      # a workflow-wiring or release-script test going red passes on cargo
      # alone. Every suite runs and all failures are reported; seconds, no cargo.
      - name: Install PyYAML 6.0.2 (the cosign floor parses workflows)
        run: python3 -c 'import sys, yaml; sys.exit(yaml.__version__ != "6.0.2")' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
      - name: Release tooling Python suites
        run: |
          set -uo pipefail
          fail=0
          for suite in scripts/release/test_*.py; do
            echo "::group::$suite"
            python3 "$suite" || { echo "::error::$suite failed"; fail=1; }
            echo "::endgroup::"
          done
          exit "$fail"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Restore only: saving from throwaway runs would evict the entries the
      # merge-evidence jobs rely on from the shared 10 GB repository cache.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: false
      # Each skip names the job that runs the test in full, and its ticket:
      #   a_real_sdk_job_outlives_...: job `task-sdk-recovery`, MIK-7534.
      #   mik_7479_full_burst: workflow mrtr7b-full-burst.yml, MIK-7479;
      #   release.yml `verify` needs it green on the released revision.
      - run: cargo test --all-features --no-fail-fast -- --skip a_real_sdk_job_outlives_the_gateway_and_its_owner_reads_the_result --skip mik_7479_full_burst

  # CAT.1 (MIK-7782): the real `gws` binary, pinned, accepts the argv every
  # shipped gws_* capability builds. `--dry-run` needs no credentials and sends
  # nothing; the test clears the environment and gives gws a private HOME.
  gws-dry-run:
    name: gws dry-run conformance
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install the pinned gws
        run: |
          # The package's postinstall fetches the native binary, so scripts must
          # run. This job holds no secrets and only `contents: read`.
          npm install --global @googleworkspace/cli@0.22.5
          test "$(gws --version | head -1)" = "gws 0.22.5"
      - name: Every gws capability dry-runs against the real binary
        run: cargo test --all-features --lib -- --ignored every_gws_capability_is_accepted_by_the_real_binary_in_dry_run

  # Runs one SDK journey test that reads no documentation file, so a docs-only
  # pull request skips it; a failed scope decision runs it (fail-open).
  task-sdk-recovery:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    uses: ./.github/workflows/task-sdk-recovery.yml

  # Release signing's own tests read nothing live, so they fail every ref:
  # the asset checker, and the signing script refusing a tampered asset, the
  # wrong identity and the wrong issuer (cosign and syft stubbed).
  release-signing-checks:
    name: Release signing checks
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the release asset checker
        run: python3 scripts/release/test_check_release_assets.py
      - name: Test that signing fails closed
        run: python3 scripts/release/test_sign_release_assets.py
      - name: Test that an upload onto a published release is refused
        run: python3 scripts/release/test_refuse_published_release.py
      - name: Test that a published chart version is never replaced
        run: python3 scripts/release/test_publish_pinned_chart.py

  # The release.yml signing path, rehearsed without a tag: one binary built
  # with cargo auditable, signed keylessly as this workflow, uploaded to a
  # draft release (a draft creates no git tag and is visible to maintainers
  # only), verified as served, checked to refuse a tampered copy, and deleted.
  binary-signing-rehearsal:
    name: Binary signing rehearsal (draft release)
    if: github.event_name == 'workflow_dispatch' && (inputs.rehearse_binary_signing == true || inputs.rehearse_binary_signing == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      IDENTITY: https://github.com/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
      DRAFT: rehearsal-binary-signing-${{ github.run_id }}
      NAME: mcp-gateway-linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.6
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Build, sign and write the SBOM
        run: |
          set -euo pipefail
          cargo auditable build --release
          mkdir -p release
          cp target/release/mcp-gateway "release/$NAME"
          version="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "mcp-gateway") | .version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          scripts/release/sign-release-assets.sh release "$version" "$NAME"
      - name: Upload to a draft release and verify what it serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$DRAFT" release/* --draft --target "$GITHUB_SHA" \
            --title "$DRAFT" --notes "Rehearsal of release signing; deleted by the same run."
          gh release download "$DRAFT" --dir published
          scripts/release/verify-release-assets.sh published "$VERSION" "$NAME"
      - name: A tampered copy is refused
        run: |
          set -euo pipefail
          cp -r published tampered
          printf 'x' >> "tampered/$NAME"
          if scripts/release/verify-release-assets.sh tampered "$VERSION" "$NAME"; then
            echo "::error::a tampered binary verified"
            exit 1
          fi
      - name: Delete the draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$DRAFT" --yes --cleanup-tag || true

  # Tag day must not be the first cargo auditable build on macOS or Windows:
  # every release target is built here, as release.yml builds it, and each
  # SBOM must list the crates in its binary. Signing is proven by the job above.
  binary-sbom-rehearsal:
    name: Binary SBOM rehearsal (${{ matrix.artifact }})
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.rehearse_binary_signing == true || inputs.rehearse_binary_signing == 'true')
      && (inputs.rehearse_all_targets == true || inputs.rehearse_all_targets == 'true')
    strategy:
      fail-fast: false
      # Must match release.yml `build`; the wiring test holds them equal.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: mcp-gateway-linux-x86_64
            suffix: ""
            packages: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: mcp-gateway-linux-aarch64
            suffix: ""
            packages: musl-tools
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mcp-gateway-darwin-arm64
            suffix: ""
            packages: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mcp-gateway-darwin-x86_64
            suffix: ""
            packages: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: mcp-gateway-windows-x86_64
            suffix: .exe
            packages: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.6
      - name: Build
        run: cargo auditable build --release --target ${{ matrix.target }}
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: The SBOM lists the binary's crates
        shell: bash
        run: |
          set -euo pipefail
          name="${{ matrix.artifact }}${{ matrix.suffix }}"
          mkdir -p sbom
          cp "target/${{ matrix.target }}/release/mcp-gateway${{ matrix.suffix }}" "sbom/$name"
          syft scan "file:sbom/$name" \
            --select-catalogers "+cargo-auditable-binary-cataloger" \
            -o "spdx-json=sbom/$name.spdx.json"
          version="$(cargo metadata --format-version 1 --no-deps --locked | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mcp-gateway"))')"
          python3 scripts/release/check_release_assets.py sbom --version "$version" --sbom-only "$name"
  # The published crate carries only what Cargo.toml `include` lists, so a test
  # that reads a repository file left out of it compiles here and fails for
  # anyone testing the package (#1812). Every ref builds the packaged tests;
  # running them happens after a merge, in packaged-suite.yml.
  package-tests:
    name: Tests build from the packaged crate
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build the tests from the packaged crate
        run: scripts/ci/packaged-tests.sh build

  # The post-merge packaged run, on demand: a workflow file that is not on the
  # default branch yet cannot be dispatched itself.
  packaged-suite-rehearsal:
    if: github.event_name == 'workflow_dispatch' && (inputs.rehearse_packaged_suite == true || inputs.rehearse_packaged_suite == 'true')
    uses: ./.github/workflows/packaged-suite.yml

  fmt:
    name: Format
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Dependency audit
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-audit
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-audit --locked
      - run: cargo audit

  kani:
    name: Kani
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # Kani's current toolchain is validated against Ubuntu 22.04. Keep this
    # job pinned to that image rather than following latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strip rust-version for Kani toolchain compatibility
        # Kani 0.67.0 (the latest model-checking/kani-github-action @ v1.1
        # SHA pin) ships nightly rustc 1.93. The project's
        # rust-version=1.95 (commit f2063376) is a deployment-target
        # requirement, not a verification requirement. Cargo's
        # rust-version gate fires before kani runs, so we strip the
        # field for this job only. Re-enable when Kani upstream ships a
        # release with a 1.95-compatible nightly bundle.
        run: sed -i '/^rust-version = /d' Cargo.toml
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: --output-format=terse

  public-claims:
    name: Public claims
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Validate README benchmark scenario script
        run: python3 benchmarks/token_savings.py --scenario readme --json
      # Plain-assert script, not a pytest module: invoked directly rather than
      # collected. Without this step the #614 stability gate is documentation —
      # no job runs it, so it can never fail a pull request.
      - name: Validate the workload stability gate
        run: python3 benchmarks/workload/test_eval_workload.py
      - name: Validate the graded cell-order schedule (balanced, enforced)
        run: python3 benchmarks/workload/test_schedule.py
      - name: Validate public claim consistency
        run: cargo test --test public_claims_validation

  # The release tooling's own unit tests read nothing live, so they fail every
  # ref. Left in the report-only job below, a broken publish-gate test merged
  # green and was first seen on a tag.
  release-script-tests:
    name: Release tooling unit tests
    runs-on: ubuntu-latest
    # Below runs-on: the wiring mutation harness anchors on name + runs-on.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML 6.0.2 (the cosign floor parses workflows)
        run: python3 -c 'import sys, yaml; sys.exit(yaml.__version__ != "6.0.2")' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
      - name: Test the counter (fail on parser regression)
        run: python3 scripts/release/test_count_release_criteria.py
      - name: Test supplemental acceptance checks
        run: python3 scripts/release/test_scope_acceptance.py
      - name: Test the Critical function coverage grader
        run: python3 scripts/release/test_critical_function_coverage.py
      - name: Test the tag/manifest publish gate
        run: python3 scripts/release/test_check_tag_manifest.py
      - name: Test the burndown summary drift check
        run: python3 scripts/release/test_check_burndown_summary.py
      - name: Burndown summary and publish gate match the ledger checks (MIK-7730, MIK-7932)
        run: python3 scripts/release/check_burndown_summary.py
      - name: Test the NFR.DEMO.1 recording gate
        run: python3 scripts/release/test_check_nfr_demo_1_recordings.py
      - name: Test the bot-review sweep (review-summary findings)
        run: python3 scripts/release/test_botreview_sweep.py
      - name: Test the keyless read-only admission check (MIK-7752)
        run: python3 scripts/release/test_check_keyless_read_only.py
      - name: The published C6 mutation sample still reproduces
        run: python3 scripts/release/test_c6_mutation_sample.py
      # Proves the workflow-wiring assertions still discriminate: each case
      # breaks one rule, or restates it in an equivalent spelling, and the
      # suite has to return the stated verdict. Runs against a copy of the
      # workflows, so nothing here edits this file.
      - name: Test that the workflow-wiring assertions catch their mutations
        run: python3 scripts/release/test_workflow_wiring_mutations.py

  release-criteria:
    name: Release criteria ledger (report-only off a tag, blocking on one)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    # The ledger is a live working document: a row edited mid-flight must not
    # block unrelated PRs, but a stale header count must not reach a tag. On a
    # tag this job blocks, and the container publish below depends on it —
    # release.yml's copy cannot, because a workflow cannot gate another
    # workflow's jobs. Same script everywhere: scripts/release/count-release-criteria.py.
    # Only live ledger and evidence checks belong here; unit tests go above.
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the release-criteria ledger header against its rows
        run: python3 scripts/release/count-release-criteria.py --check
      - name: Check the NFR.DEMO.1 recording manifest against its transcripts
        run: python3 scripts/release/check_nfr_demo_1_recordings.py
      - name: Validate supplemental scope (pending work is reported)
        run: python3 scripts/release/check_scope_acceptance.py --check
      - name: Require completed acceptance in publishing context
        run: python3 scripts/release/check_scope_acceptance.py --publish-check

  capability-pins:
    name: Capability pin counts and drift
    needs: scope
    # The count step reads docs/release/v4.0.0-supported-matrix.md, so it runs on
    # docs-only changes too; the binary steps skip them (fail-open, as above).
    if: ${{ !cancelled() && !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    # tests/capability_pin_policy.rs already asserts the privilege rule and the
    # drift rule, but only behind a full --all-features build. This is the drift
    # half in two seconds on the cheapest runner, so a capability file rewritten
    # without re-issuing its pin is caught before the Rust jobs finish. It also
    # re-measures the counts printed in docs/release/v4.0.0-supported-matrix.md,
    # which NFR.BUILD.1 C2 is graded against — a count nobody recomputes reads
    # as evidence while being a memory of what was once true.
    # The shell check runs first and stays the fast signal. The later steps
    # build the shipped binary and verify the same pins with
    # `mcp-gateway cap validate`, including a tampered copy that must be
    # refused, so the command operators run is exercised on real files.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check capability pins against the catalogue and the matrix
        run: bash scripts/ci/check-capability-pin-counts.sh
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true'
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true'
      - name: Build the shipped binary
        if: needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true'
        run: cargo build --locked --bin mcp-gateway
      - name: Verify pins with cap validate (real files accepted, tampered copy refused)
        if: needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true'
        run: bash scripts/ci/check-cap-validate-pins.sh target/debug/mcp-gateway

  secrets-scan:
    name: Secrets scan
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@288a8a8643a2c5a36b81d231c550dccfa0beeb64 # main
        with:
          extra_args: --only-verified

  secret-leak-lint:
    name: Secret-leak lint (CWE-532)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # Semantic check that trufflehog/osv-scanner don't cover: a struct that
    # derives Debug (or a log/print macro) over a field/variable whose name
    # is secret-shaped leaks *structure*, not a matched credential string —
    # trufflehog only flags verified live secret VALUES it can see in the
    # diff. This is the class of bug fixed in #323 (redact credentials from
    # Debug output). Pure stdlib Python, no extra deps, so it stays fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the leak-lint parser (fail on parser regression)
        run: python3 scripts/dev/test_cwe532_leak_lint.py
      - name: Run CWE-532 leak lint
        run: python3 scripts/dev/cwe532-leak-lint.py src crates

  file-size-ceiling:
    name: File-size ceiling (800 lines)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # The ceiling governs a file, not a change. The files already over it
    # ratchet off a recorded baseline: a listed file may shrink, never grow,
    # and no file may newly cross 800 lines. Splitting the existing offenders
    # is sequenced after the release to avoid mass merge conflicts.
    # A module declaration (`mod child;` and the inert attributes above it) is
    # not counted, so attaching an extracted file is not scored as growth (#609).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exemption must not become the way to grow a file with code. Run
      # first: a failing tree check would otherwise hide which rule broke.
      - name: Check the gate refuses what it claims to
        run: python3 scripts/dev/test_check_file_size.py
      - name: Check the 800-line ceiling
        run: python3 scripts/dev/check-file-size.py

  event-source-scope:
    name: Event source leaves the events core alone (MIK-7720 U10)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # Each new event source is one EventSource implementation: a change that
    # adds one may add files under src/events/ and module declarations in
    # src/events/mod.rs, nothing else there. The guard has no behaviour of its
    # own to see red, so its self-test runs first and must refuse a synthetic
    # source change that edits a core file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the guard refuses what it claims to
        run: python3 scripts/dev/test_check_event_source_scope.py
      - name: Check this change against its base
        if: github.event_name == 'pull_request'
        run: python3 scripts/dev/check-event-source-scope.py "origin/${{ github.base_ref }}"

  orphan-test-modules:
    name: Orphan test modules (MIK-7538)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # A `*_tests.rs` that no module declares is in no compilation unit: never
    # built, never run, and invisible to `cargo test`, which reports zero
    # failures and exits zero for a file it cannot see. One such file was cited
    # as proof of a cache-stranding behaviour in a release ledger, in two merged
    # design documents and in three implementation briefs before anyone tried to
    # run it. The sweep is tree-wide, not directory-scoped: a module may be
    # declared from a sibling by `#[path = "..."]`, and a directory-scoped
    # version of this check reported 72 false orphans. Declarations are
    # followed from the crate roots, so a file declared only by an uncompiled
    # file is itself reported, and every `.rs` under `src/` is swept (#1339).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check every source file is reachable from a crate root
        run: python3 scripts/dev/check-orphan-test-modules.py
      # The resolver has already been wrong twice -- once directory-scoped,
      # reporting 72 false orphans out of 113, and once name-matching, which
      # let a declared `a/foo_tests.rs` answer for an orphaned `b/foo_tests.rs`.
      # Five stems are duplicated in this tree, so that second hole was live.
      # These pin both, and a guard that cannot fail is the thing it guards.
      - name: Check the guard catches what it claims to
        run: python3 scripts/dev/test_check_orphan_test_modules.py
      - name: MCP events OAuth shim rows
        run: python3 scripts/dev/test_mcp_events_oauth_shim.py
      - name: MCP events fail-fast harness rows
        run: python3 scripts/dev/test_mcp_events_failfast.py

  control-drift-probes:
    name: Control-drift probes (NFR.SEC.7)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # CI cannot detect drift — there is no listening install here, and by
    # construction a build from this tree carries this tree's controls. What it
    # proves is that the probes still discriminate: the rows run against stub
    # servers that refuse everything, refuse nothing, and carry the control, so
    # a probe that has silently stopped exercising its control fails here rather
    # than going green against a stale install. Stdlib Python, no extra deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the drift probes (fail when a probe stops discriminating)
        run: python3 scripts/dev/test_check_control_drift.py
      # Same question at the document boundary (MIK-7570.OWASP.1): the published
      # OWASP self-assessment may cite only paths and tests that still exist.
      - name: Check the OWASP self-assessment cites the current tree
        run: python3 scripts/dev/test_check_owasp_citations.py
      - name: Test the EVENTS.8 evidence script (a wrong run must FAIL)
        run: python3 scripts/dev/test_events8_run.py

  registry-packages:
    name: Built-in server registry is pinned (MIK-7787)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) }}
    # `mcp-gateway add <name>` writes what src/registry/server_registry.rs
    # says. 30 of its 45 npm packages were 404 and nothing failed. Offline
    # half: every entry is a pinned npm or PyPI release or a hosted URL. The
    # live lookups run in registry-packages.yml (registry changes, pushes,
    # daily), so an upstream deprecation never turns an unrelated PR red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the guard refuses what it claims to
        run: python3 scripts/dev/test_check_registry_packages.py
      - name: Check every registry entry is pinned
        run: python3 scripts/dev/check-registry-packages.py --offline

  docker-build:
    name: Docker (${{ matrix.arch }})
    # `matrix.os`, not a name of this job's own choosing: the hosted-runner
    # guard resolves that one expression against the matrix entries below and
    # checks each image on its own (scripts/ci/check-hosted-runners.sh).
    runs-on: ${{ matrix.os }}
    # Both spellings of the input are compared. A dispatch input arrives typed
    # as a boolean in the `inputs` context and as the string "false" in the
    # event payload, and a bare truthiness test on the string form is true —
    # which would build and push on a dispatch that asked for nothing. Neither
    # comparison matches false or "false", so the default case runs nothing.
    #
    # The tag clause requires a push, because a dispatch can be aimed at a tag
    # ref: on `refs/tags/v4.0.0` a ref test alone is true, and the release
    # steps below would promote, sign and list a real release from a run that
    # asked to rehearse. A release tag is only ever legitimate from a push.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.rehearse_manifest == true || inputs.rehearse_manifest == 'true'))
    # Each leg builds natively and starts its own image on its own architecture,
    # which is the only way an arm64 startup break is observable -- an amd64
    # runner starting an amd64 image says nothing about arm64 (NFR.PKG.1).
    # release.yml:176 already builds aarch64 on this runner label.
    strategy:
      # A half-finished matrix must not reach docker-manifest: the tag is
      # created there from both digests, and one leg alone is not the list this
      # criterion asks for.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
    # secrets-scan + secret-leak-lint added so the container image release
    # path can't ship on a tag whose push already failed a security check —
    # previously this job's needs: covered clippy/test/fmt/audit but not the
    # security jobs, so a red secrets-scan or leak-lint would not have
    # blocked ghcr.io publish.
    needs: [check, test, task-sdk-recovery, fmt, audit, secrets-scan, secret-leak-lint, public-claims, public-repo-hygiene, service-template-smoke, usability-smoke, helm-chart-smoke, helm-oci-roundtrip, helm-supply-chain, helm-airgap, release-criteria, release-script-tests, package-tests, release-signing-checks]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scoped to tags because a rehearsal dispatch has no tag to check:
      # GITHUB_REF_NAME is the dispatch branch there, which the gate rejects as
      # unusable input. Nothing in this job reads its outputs — the build
      # pushes by digest under no name — so the tag path is unchanged and the
      # rehearsal reaches the build.
      - name: Extract tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: meta
        # This workflow cannot read release.yml's job outputs — it fires on the
        # same tag independently — so it runs the same gate itself. Publishing a
        # signed image for a tag whose manifest names a different version is
        # exactly what the gate refuses. `version` here drops the leading `v`,
        # so this publisher and docker.yml agree on the image tag; previously
        # this pushed `:v4.0.0` while docker.yml pushed `:4.0.0`, and only this
        # one is signed.
        run: python3 scripts/release/check_tag_manifest.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, push by digest with no tag, then pull that digest back and
      # test it. The alternative -- build-and-load, smoke, build-and-push --
      # makes "the bytes that reached healthy are the bytes published" depend on
      # a build-cache hit across two invocations, and this image runs
      # `apt-get upgrade`, whose output is not a function of the Dockerfile.
      # Here the published blob is the tested blob by construction, and nothing
      # is resolvable by name until docker-manifest creates the tag.
      #
      # provenance/sbom are off deliberately: build-push-action v7 attaches a
      # provenance attestation by default on Actions, which makes the pushed
      # artifact an index rather than a single-platform manifest, and an index
      # cannot be a child of `imagetools create`. The release SBOM is generated
      # by syft in docker-manifest, against the published digest.
      - name: Build and push by digest (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/mikkoparkkola/mcp-gateway,push-by-digest=true,name-canonical=true,push=true
          # Same reason as docker.yml: without a per-build value the runtime
          # stage's `apt-get upgrade` is restored from the shared gha cache, and
          # a release image ships whatever packages were current when that layer
          # was first built.
          build-args: |
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          # Scoped per arch: an unscoped scope has both legs writing one cache
          # entry, so each run thrashes the other's layers.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Pull the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      # The image CVE gate lived only in docker.yml, so the release publisher
      # pushed without one (#536). It runs here, per leg, against the digest
      # that will be tagged -- the arm64 image has its own base-image layers
      # and so its own CVEs.
      - name: Trivy image scan (block the tag on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mikkoparkkola/mcp-gateway@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke test the image (it must start and report healthy)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/ci/smoke-image.sh "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Build and push the full variant by digest (no tag)
        id: build_full
        run: |
          set -euo pipefail
          META="${RUNNER_TEMP}/full-build-meta.json"
          docker buildx build \
            --target runtime-full \
            --platform "${{ matrix.platform }}" \
            --provenance=false --sbom=false \
            --metadata-file "${META}" \
            --build-arg "APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}" \
            --cache-from "type=gha,scope=docker-${{ matrix.arch }}" \
            --cache-from "type=gha,scope=docker-full-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=docker-full-${{ matrix.arch }}" \
            --output "type=image,name=ghcr.io/mikkoparkkola/mcp-gateway,push-by-digest=true,name-canonical=true,push=true" \
            .
          DIGEST="$(jq -r '."containerimage.digest"' "${META}")"
          test -n "${DIGEST}" && test "${DIGEST}" != "null"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Trivy the full variant (same gate as the default image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mikkoparkkola/mcp-gateway@${{ steps.build_full.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke test the full variant (it must spawn npx and uvx)
        env:
          DIGEST: ${{ steps.build_full.outputs.digest }}
        run: scripts/ci/smoke-full-image.sh "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Record the digests for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_FULL: ${{ steps.build_full.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s' "${DIGEST}" > "digests/${{ matrix.arch }}"
          printf '%s' "${DIGEST_FULL}" > "digests/${{ matrix.arch }}-full"
          test -s "digests/${{ matrix.arch }}"
          test -s "digests/${{ matrix.arch }}-full"

      - name: Upload the digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests-${{ matrix.arch }}
          path: digests/
          # Read by docker-manifest. Kept for the repository's 14-day retention
          # cap so a failed manifest job can be retried without rebuilding the
          # legs (RELEASING.md rule 4).
          retention-days: 14
          if-no-files-found: error

  docker-manifest:
    name: Docker manifest list
    runs-on: ubuntu-latest
    # Same condition as docker-build, whose digests this job assembles, and
    # the tag clause is scoped to a push for the same reason: a dispatch aimed
    # at a tag ref must not admit the release steps. Those steps carry the
    # clause themselves, so a rehearsal ends at the both-platforms assertion,
    # apart from "Install cosign" and the read-only rehearsal verify below it.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
      && (inputs.rehearse_manifest == true || inputs.rehearse_manifest == 'true'))
    needs: docker-build
    # Read by publish-mcp-registry, which must not list a release candidate.
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      # The index digest this job signed and verified, for the chart publisher:
      # re-reading the movable :VERSION tag there could pin another image.
      list: ${{ steps.list.outputs.list }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scoped to tags: a rehearsal dispatch has no tag for the gate to check,
      # and every step that reads these outputs is scoped the same way, so no
      # release name is derived from an unchecked version.
      - name: Extract tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: meta
        run: python3 scripts/release/check_tag_manifest.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the leg digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digests-*
          merge-multiple: true
          path: digests

      # The index is built under a provenance-only name, never a release tag.
      # A release tag created here would be pullable and unsigned for the whole
      # signing span, and `cosign verify` by digest passes afterwards either
      # way — it never reads a tag (#529). The release tags are put on this
      # same digest below, once the signature over it verifies.
      #
      # The MCP Registry validator reads io.modelcontextprotocol.server.name
      # off what the tag resolves to. Dockerfile:42 sets it as a LABEL, which
      # lives in each child's image config and is not carried onto an index
      # by `imagetools create`, so it is annotated onto the index here as
      # well. A validator that resolves a platform child and one that reads
      # the index both find it.
      #
      # Annotated exactly once. Annotating rewrites the index, which changes
      # its digest; repeating it on the release copy below would publish bytes
      # no signature covers.
      - name: Create the manifest list under a provenance tag
        id: list
        env:
          # A rehearsal writes its own name. Both paths would otherwise stage
          # under :sha-<GITHUB_SHA>, and a release run at the same commit
          # could read back a concurrent rehearsal's index between the create
          # and the inspect below — signing bytes whose children it never
          # recorded. Empty on a tag push, so the release name is unchanged;
          # the run id and attempt make each rehearsal's name its own.
          #
          # The predicate is negated so the suffix sits in the true branch.
          # `A && '' || B` returns B whichever way A goes, because the empty
          # string is falsy — which appended the rehearsal suffix to release
          # tags. An expression yields what its operands coerce to, so a
          # falsy value never belongs in the left branch of `&& … || …`.
          # scripts/release/test_check_tag_manifest.py evaluates all four
          # cells and requires the empty one.
          REHEARSAL_SUFFIX: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && format('-rehearsal-{0}-{1}', github.run_id, github.run_attempt) || '' }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          AMD64="$(cat digests/amd64)"
          ARM64="$(cat digests/arm64)"
          # Both legs are required. An absent file here means a leg was skipped
          # rather than failed, and a one-platform "list" published under the
          # release tag is the defect this job exists to prevent.
          test -n "${AMD64}" && test -n "${ARM64}"
          docker buildx imagetools create --tag "${IMAGE}:sha-${GITHUB_SHA}${REHEARSAL_SUFFIX}" \
            --annotation "index:io.modelcontextprotocol.server.name=io.github.MikkoParkkola/mcp-gateway" \
            "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          LIST="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}${REHEARSAL_SUFFIX}" \
            --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect "${IMAGE}@${LIST}"
          FULL_AMD64="$(cat digests/amd64-full)"
          FULL_ARM64="$(cat digests/arm64-full)"
          for value in "${FULL_AMD64}" "${FULL_ARM64}"; do test -n "${value}"; done
          docker buildx imagetools create --tag "${IMAGE}:sha-${GITHUB_SHA}-full${REHEARSAL_SUFFIX}" \
            --annotation "index:io.modelcontextprotocol.server.name=io.github.MikkoParkkola/mcp-gateway" \
            "${IMAGE}@${FULL_AMD64}" "${IMAGE}@${FULL_ARM64}"
          LIST_FULL="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}-full${REHEARSAL_SUFFIX}" \
            --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect "${IMAGE}@${LIST_FULL}"
          {
            printf 'list=%s\n' "${LIST}"
            printf 'amd64=%s\n' "${AMD64}"
            printf 'arm64=%s\n' "${ARM64}"
            printf 'list_full=%s\n' "${LIST_FULL}"
            printf 'amd64_full=%s\n' "${FULL_AMD64}"
            printf 'arm64_full=%s\n' "${FULL_ARM64}"
          } >> "${GITHUB_OUTPUT}"

      - name: Assert the list carries both platforms
        env:
          LIST: ${{ steps.list.outputs.list }}
          LIST_FULL: ${{ steps.list.outputs.list_full }}
        run: |
          set -euo pipefail
          assert_both() {
            local digest="$1" label="$2"
            local platforms
            platforms="$(docker buildx imagetools inspect \
              "ghcr.io/mikkoparkkola/mcp-gateway@${digest}" \
              --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            echo "${label} platforms: ${platforms}"
            for want in linux/amd64 linux/arm64; do
              case " ${platforms} " in
                *" ${want} "*) ;;
                *) echo "::error::${want} missing from the ${label} manifest list"; exit 1 ;;
              esac
            done
          }
          assert_both "${LIST}" "default"
          test -n "${LIST_FULL}"
          assert_both "${LIST_FULL}" "full"

      # Everything below this line belongs to a release and is scoped to a tag
      # push. A rehearsal dispatch ends at the assertion above: the index it
      # built carries the provenance name only, and signing, attesting or
      # naming it :VERSION is what a release does with an index nobody has
      # asked for yet. Two exceptions, both read-only: "Install cosign" and
      # the rehearsal verify after it, which runs the release verify command
      # against a release that is already signed, so the verify path is
      # tested before a tag (docs/design/2026-09-26-rehearsal-readonly-verify.md).
      - name: Install cosign
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.rehearse_manifest == true || inputs.rehearse_manifest == 'true'))
        # cosign-release is pinned so flag behavior can't drift under a v3 default.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      # Read-only: verifies v4.0.0-beta.2, signed and SBOM-attested by run
      # 36193916273, with the release verify step's body verbatim. Only the
      # env differs: pinned literal digests and a literal tag identity, never
      # the build under rehearsal. Nothing is signed, attested or published.
      # The body, cosign calls and timeout must match the release step
      # (scripts/release/test_check_tag_manifest.py RehearsalVerify).
      - name: Rehearse the release verify against a pinned signed release
        if: github.event_name == 'workflow_dispatch' && (inputs.rehearse_manifest == true || inputs.rehearse_manifest == 'true')
        timeout-minutes: 10
        env:
          LIST: sha256:1471cafc9f2a88855fd8997da8316b8122335bef3d3886a3bbb64768aebc9638
          AMD64: sha256:e6f42fff9d678367a500d3d3d0177d77edbb6c6d96086c7f8dd7e74952a44cfc
          ARM64: sha256:50ec31205c65ed27a1d30c056960f2b31de34b72bb7efb98440fbf5d4465bdef
          IDENTITY: https://github.com/MikkoParkkola/mcp-gateway/.github/workflows/ci.yml@refs/tags/v4.0.0-beta.2
          LIST_FULL: sha256:ce949392883b14034db9ec60ffb2f808c5458f5ce4bb26402ffa42eb45a47a8e
          AMD64_FULL: sha256:9c4712b85974f150874d16ec1b7b7e72c858673093eed33732f91e9b2adde4c5
          ARM64_FULL: sha256:d267a3477aeec6f8702b2851e93d9e29ba8fd94cd13920dd158d8cb43e929da9
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          for d in "${LIST}" "${AMD64}" "${ARM64}" "${LIST_FULL}" "${AMD64_FULL}" "${ARM64_FULL}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${IMAGE}@${d}" > /dev/null
            cosign verify-attestation --type spdxjson \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${IMAGE}@${d}" > /dev/null
          done

      - name: Install syft (SBOM)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # The list and both children are signed. A client on arm64 resolves the
      # arm64 child, so signing only the list would leave what that client
      # actually runs unverifiable under a platform-specific reference.
      - name: Cosign keyless-sign the list and both children
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          LIST: ${{ steps.list.outputs.list }}
          AMD64: ${{ steps.list.outputs.amd64 }}
          ARM64: ${{ steps.list.outputs.arm64 }}
          LIST_FULL: ${{ steps.list.outputs.list_full }}
          AMD64_FULL: ${{ steps.list.outputs.amd64_full }}
          ARM64_FULL: ${{ steps.list.outputs.arm64_full }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          for d in "${LIST}" "${AMD64}" "${ARM64}" "${LIST_FULL}" "${AMD64_FULL}" "${ARM64_FULL}"; do
            cosign sign --yes "${IMAGE}@${d}"
          done

      - name: Generate + attest an SBOM (SPDX JSON) per published digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          LIST: ${{ steps.list.outputs.list }}
          AMD64: ${{ steps.list.outputs.amd64 }}
          ARM64: ${{ steps.list.outputs.arm64 }}
          LIST_FULL: ${{ steps.list.outputs.list_full }}
          AMD64_FULL: ${{ steps.list.outputs.amd64_full }}
          ARM64_FULL: ${{ steps.list.outputs.arm64_full }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          for d in "${LIST}" "${AMD64}" "${ARM64}" "${LIST_FULL}" "${AMD64_FULL}" "${ARM64_FULL}"; do
            syft "${IMAGE}@${d}" -o spdx-json > sbom.spdx.json
            test -s sbom.spdx.json
            cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${d}"
          done

      # stdout goes to /dev/null: verify-attestation prints the whole base64
      # SBOM attestation there (~52 MB over six digests, lines up to 14.5 MB),
      # and v4.0.0-beta.2's step never finished under that volume (run
      # 36193916273). The exit status is the verdict and still fails the step
      # under `set -e`; the verification summary is on stderr and stays in the
      # log. The redirect is the fix: a runner wedged on log volume did not
      # enforce step or job timeout-minutes in the repro (#1143). The timeout
      # bounds a live-runner stall, such as a Rekor or registry fetch.
      - name: Verify the release signature + SBOM attestation
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        env:
          LIST: ${{ steps.list.outputs.list }}
          AMD64: ${{ steps.list.outputs.amd64 }}
          ARM64: ${{ steps.list.outputs.arm64 }}
          # Exact signer identity: THIS workflow file at the pushed tag ref, so a
          # different workflow with OIDC cannot satisfy the check.
          IDENTITY: https://github.com/MikkoParkkola/mcp-gateway/.github/workflows/ci.yml@${{ github.ref }}
          LIST_FULL: ${{ steps.list.outputs.list_full }}
          AMD64_FULL: ${{ steps.list.outputs.amd64_full }}
          ARM64_FULL: ${{ steps.list.outputs.arm64_full }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          for d in "${LIST}" "${AMD64}" "${ARM64}" "${LIST_FULL}" "${AMD64_FULL}" "${ARM64_FULL}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${IMAGE}@${d}" > /dev/null
            cosign verify-attestation --type spdxjson \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${IMAGE}@${d}" > /dev/null
          done

      # Only now does a release name exist. Copying an index by digest is a
      # byte-identical put — the digest is unchanged, so the signature and the
      # SBOM attestation verified above cover exactly what these tags serve.
      #
      # An index as the source is not the case the build step's comment rules
      # out: composing several sources into a new index cannot take an index as
      # a child, but a single source with no annotations is copied rather than
      # composed. The step below is the runtime check on that distinction.
      - name: Publish the release tags (copy the verified index by digest)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          LIST: ${{ steps.list.outputs.list }}
          # The version tag is always created; :latest and the major.minor
          # pointer move only for a stable release, so `docker pull` with no
          # tag — or pinned to :4.0 — cannot land on a candidate. Kept as one
          # expression rather than a shell branch so the release guard can
          # read which way round it is, and the major.minor tag hangs off the
          # same guard so a candidate cannot move one pointer without the
          # other.
          LATEST_TAG: ${{ steps.meta.outputs.is_prerelease != 'true' && 'ghcr.io/mikkoparkkola/mcp-gateway:latest' || '' }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          TAGS=(--tag "${IMAGE}:${VERSION}")
          if [ -n "${LATEST_TAG}" ]; then
            TAGS+=(--tag "${LATEST_TAG}")
            # Derived, never spelled: a literal stops following the release
            # the first time the minor moves. `cut`, not `${VERSION%.*}`,
            # which yields 4.0.0-rc on a candidate if this guard ever leaks.
            MAJOR_MINOR="$(printf '%s' "${VERSION}" | cut -d. -f1,2)"
            TAGS+=(--tag "${IMAGE}:${MAJOR_MINOR}")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${IMAGE}@${LIST}"

          LIST_FULL="${{ steps.list.outputs.list_full }}"
          test -n "${LIST_FULL}"
          FULL_TAGS=()
          for t in "${TAGS[@]}"; do
            [ "${t}" = "--tag" ] && continue
            FULL_TAGS+=(--tag "${t}-full")
          done
          docker buildx imagetools create "${FULL_TAGS[@]}" "${IMAGE}@${LIST_FULL}"

      # The falsifier for the invariant above. A copy that rewrote the index —
      # an added annotation, a buildx that normalises — lands on a different
      # digest, and the release tag would then serve bytes no signature covers.
      - name: Assert the release tag resolves to the signed digest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          LIST: ${{ steps.list.outputs.list }}
          LIST_FULL: ${{ steps.list.outputs.list_full }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/mikkoparkkola/mcp-gateway
          for pair in "${VERSION}|${LIST}" "${VERSION}-full|${LIST_FULL}"; do
            TAG="${pair%%|*}"
            WANT="${pair#*|}"
            PUBLISHED="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
              --format '{{.Manifest.Digest}}')"
            if [ "${PUBLISHED}" != "${WANT}" ]; then
              echo "::error::${IMAGE}:${TAG} resolves to ${PUBLISHED}, not the signed ${WANT}"
              exit 1
            fi
          done

  # Moved here from docker.yml with the tag push it depends on: this job rewrites
  # server.json to name ghcr.io/mikkoparkkola/mcp-gateway:VERSION and the MCP
  # Registry resolves that exact reference (registry
  # internal/validators/registries/oci.go), so it can only run after the job
  # that creates the tag. Running it here also means a version reaches a public
  # discovery surface only once the suite that qualifies it has passed.
  # The Helm chart, pinned to the release image's digest and signed by this
  # workflow, so chart and image carry one signer: ci.yml at the tag (MIK-7952).
  # Runs after docker-manifest has signed the index, on the digest it verified,
  # and on a stable tag only: Chart.yaml carries a stable chart version, so a
  # prerelease would put a candidate image under it. The
  # rehearsal dispatch publishes to the separate `charts-rehearsal` package from
  # a pinned, already-signed image and never touches `charts`; it runs without
  # docker-manifest, so the condition reads that job's result only on a tag.
  # The first tag run's push creates `charts/mcp-gateway`, linked to this
  # repository with its Actions write access; never create it by hand.
  helm-chart-publish:
    name: Publish and sign the Helm chart
    needs: docker-manifest
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.docker-manifest.result == 'success'
      && needs.docker-manifest.outputs.is_prerelease == 'false')
      || (github.event_name == 'workflow_dispatch'
      && (inputs.rehearse_chart_publish == true || inputs.rehearse_chart_publish == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One publisher per package at a time, queued, never cancelled: the lookup
    # that refuses to replace a version and the push must not interleave.
    concurrency:
      group: helm-chart-publish-${{ github.event_name == 'workflow_dispatch' && 'rehearsal' || 'release' }}
      cancel-in-progress: false
      # Without it a third arrival cancels the one already pending.
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log Helm in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      - name: Publish, sign and verify the chart
        env:
          REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
          SIGNED_LIST: ${{ needs.docker-manifest.outputs.list }}
          # v4.0.0-beta.2's index, signed by run 36193916273: the rehearsal's image.
          REHEARSAL_IMAGE: ghcr.io/mikkoparkkola/mcp-gateway@sha256:1471cafc9f2a88855fd8997da8316b8122335bef3d3886a3bbb64768aebc9638
          SIGNER_ISSUER: https://token.actions.githubusercontent.com
          # The OIDC subject GitHub issues: <owner>/<repo>/.github/workflows/ci.yml@<ref>.
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = true ]; then
            image="$REHEARSAL_IMAGE"; repo=oci://ghcr.io/mikkoparkkola/charts-rehearsal
          else
            [[ $SIGNED_LIST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no signed index digest from docker-manifest"; exit 1; }
            image="ghcr.io/mikkoparkkola/mcp-gateway@${SIGNED_LIST}"; repo=oci://ghcr.io/mikkoparkkola/charts
          fi
          TAG_COMMIT="$GITHUB_SHA" SIGNER_IDENTITY="$IDENTITY" SIGNER_ISSUER="$SIGNER_ISSUER" \
            CHART_NOTES="$RUNNER_TEMP/chart-notes.md" \
            scripts/release/publish_pinned_chart.sh "$image" "$repo" | tee "$RUNNER_TEMP/publish.log"
          chart_ref=$(sed -n 's/^chart .* signed as \(.*\)$/\1/p' "$RUNNER_TEMP/publish.log")
          test -n "$chart_ref"
          # The script's pass line, the release body's publish check.
          # shellcheck disable=SC2016 # the backticks are Markdown code spans
          printf '\nPublish check: `%s`\n' "$(grep '^chart .* signed as ' "$RUNNER_TEMP/publish.log")" \
            >> "$RUNNER_TEMP/chart-notes.md"
          # Any other identity is refused, and refused for its identity: a network
          # or registry error must not pass for the rejection (WF.2).
          wrong="${IDENTITY/\/ci.yml@//release.yml@}"
          if cosign verify --certificate-identity "$wrong" --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$chart_ref" > /dev/null 2> "$RUNNER_TEMP/wrong-identity.err"; then
            echo "::error::the chart verified under $wrong"; exit 1
          fi
          grep -q 'none of the expected identities matched' "$RUNNER_TEMP/wrong-identity.err" \
            || { cat "$RUNNER_TEMP/wrong-identity.err"; echo "::error::the wrong-identity verify failed for another reason"; exit 1; }
          if [ "$REHEARSAL" = true ]; then
            printf '\nRehearsal: chart signed as %s; its image is v4.0.0-beta.2, signed as ci.yml@refs/tags/v4.0.0-beta.2.\n' \
              "$IDENTITY" >> "$RUNNER_TEMP/chart-notes.md"
          fi
      - name: Keep the release-notes block
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-notes
          path: ${{ runner.temp }}/chart-notes.md
          retention-days: 14

  publish-mcp-registry:
    name: Publish to the MCP Registry
    # Skipped on a prerelease. The MCP Registry is a discovery surface where
    # nobody opts in to a version, so listing a release candidate there exposes
    # it to every client that browses the registry.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.docker-manifest.outputs.is_prerelease != 'true'
    needs: docker-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This binary is handed an OIDC token with publish rights to the public
      # MCP Registry under this project's name, so it is pinned and verified.
      # `releases/latest` resolved at run time: the token went to whatever the
      # upstream repository had published most recently, which nobody here had
      # reviewed. A pin alone is not enough either -- a release asset can be
      # replaced in place -- so the checksum is what actually binds the bytes.
      # Bumping the version means replacing the digest in the same commit,
      # which is the review this step was missing.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          ASSET="mcp-publisher_${OS}_${ARCH}.tar.gz"
          # Both linux legs are pinned so a runner-label change fails loudly
          # here rather than silently reintroducing an unverified download.
          case "${OS}_${ARCH}" in
            linux_amd64) SHA256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc ;;
            linux_arm64) SHA256=8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4 ;;
            *) echo "::error::no pinned mcp-publisher checksum for ${OS}_${ARCH}"; exit 1 ;;
          esac
          # v1.8.1 -- the digests above are of that release's assets.
          curl -fsSL -o "${ASSET}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/${ASSET}"
          printf '%s  %s\n' "${SHA256}" "${ASSET}" | sha256sum --check --strict -
          tar xzf "${ASSET}" mcp-publisher
          chmod +x mcp-publisher

      - name: Set release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          jq --arg version "$VERSION" --arg image "$IMAGE" \
            '.version = $version
             | del(.packages[0].version)
             | .packages[0].identifier = $image
             | (.packages[] | select(.registryType == "cargo") | .version) = $version' \
            server.json > server.tmp
          mv server.tmp server.json

      - name: Confirm the published reference resolves before listing it
        # The registry resolves packages[0].identifier itself; a 404 there is a
        # broken public listing, so fail here instead.
        run: |
          set -euo pipefail
          IMAGE="$(jq -r '.packages[0].identifier' server.json)"
          docker buildx imagetools inspect "${IMAGE}" > /dev/null

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
