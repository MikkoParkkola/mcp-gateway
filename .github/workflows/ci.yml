name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches:
      [
        main,
        docs/ranking-1-release-line,
        chore/v4-reconcile-main,
        "codex/v4-*",
        fix/mrtr2-continuation-handle,
      ]
  # Rehearsal path for the container publish (NFR.PKG.1). docker-build and
  # docker-manifest fire on a `v*` tag only, so their first execution would
  # otherwise be the real release publish, and no probe tag can stand in:
  # the tag/manifest gate refuses any tag the manifest version does not
  # match. A dispatch with this input true runs both jobs up to the
  # both-platforms assertion and stops before every release name, signature
  # and registry listing. Default false: a dispatch that leaves it alone
  # runs the same jobs as a branch push, which is none of them.
  workflow_dispatch:
    inputs:
      rehearse_manifest:
        description: Build both arches and assemble the provenance-tagged index, promoting no release tag
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  windows-check:
    name: Windows check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Every test target still has to compile for Windows. The run below is
      # a subset, and this is what catches a unix-only API slipping into any
      # target it does not run.
      - run: cargo test --all-features --no-run
      # The unoptimized exe must start. Clap's derived parser needs ~900 KB of
      # stack in a debug build, over Windows' 1 MiB main-thread default, so
      # every test that spawns the binary died before parsing its arguments.
      - name: The debug exe starts
        shell: bash
        run: |
          set +e
          out=$(./target/debug/mcp-gateway.exe --version 2>&1)
          rc=$?
          echo "$out"
          echo "--version exited $rc"
          [[ $rc -eq 0 && "$out" == mcp-gateway\ * ]] || exit 1
          # A status the command returns (not a clap exit) reaches the shell:
          # an empty key makes `hash-key` return ExitCode 2.
          printf '' | ./target/debug/mcp-gateway.exe hash-key
          rc=$?
          echo "hash-key on an empty key exited $rc"
          [[ $rc -eq 2 ]]
      - run: cargo test --all-features --bins -- stack
  linux-check:
    name: Linux check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --all-features --bins -- stack
