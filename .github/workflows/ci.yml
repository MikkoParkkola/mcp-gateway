name: CI

# Throwaway mutation-proof branch: only the Tests job runs, limited to the named
# test (the full suite hangs under this mutant), with a hard timeout.
on:
  pull_request:
    branches: [docs/ranking-1-release-line]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --all-features --lib -- --exact gateway::router::f13_fetch_on_miss_tests::f13_t1_cold_per_user_meta_refuses_after_one_list gateway::router::f13_fetch_on_miss_tests::f13_t2_cold_per_user_direct_refuses_after_one_list
