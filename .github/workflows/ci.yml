name: CI

on:
  push:
    branches: [main, release/3.5.x]
    tags: ["v*"]
  pull_request:
    branches: [main, release/3.5.x]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  public-repo-hygiene:
    name: Public repo hygiene
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate public repo hygiene scripts
        run: bash -n scripts/dev/check-public-repo-hygiene.sh scripts/dev/public-hygiene-patterns.sh scripts/dev/check-pr-body-hygiene.sh tests/public_repo_hygiene.sh scripts/dev/check-commit-message-hygiene.sh tests/commit_message_hygiene.sh
      - name: Validate public repo hygiene fixtures
        run: tests/public_repo_hygiene.sh
      - name: Validate commit message hygiene fixtures
        run: tests/commit_message_hygiene.sh
      - name: Validate the commit messages this branch adds
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/dev/check-commit-message-hygiene.sh "origin/$BASE_REF..HEAD"
      # On a pull request the change itself is also checked: no added line or
      # new file name may carry a tracker id.
      - name: Validate tracked public docs boundary
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/dev/check-public-repo-hygiene.sh --base "origin/$BASE_REF"
          else
            scripts/dev/check-public-repo-hygiene.sh
          fi
      - name: Assert the image publishing guards
        run: python3 scripts/release/test_full_variant.py
      - name: Run the -full entrypoint against stub commands
        run: python3 scripts/release/test_entrypoint_full.py
      - name: Enforce per-file license boundary (MIT core vs PolyForm-NC default)
        run: scripts/ci/check-license-headers.sh
      - name: Verify license files ship in every packaged artifact
        run: scripts/ci/verify-artifact-licenses.sh

  service-template-smoke:
    name: Service template smoke
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Validate service-template smoke script
        run: bash -n scripts/dev/service-template-smoke.sh
      - name: Validate single-node templates with generated config
        run: scripts/dev/service-template-smoke.sh

  usability-smoke:
    name: First-use usability smoke
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Validate first-use smoke scripts
        run: bash -n scripts/dev/usability-smoke.sh scripts/dev/first-run-smoke.sh
      - name: Validate noninteractive setup and routed first call
        run: scripts/dev/usability-smoke.sh

  helm-chart-smoke:
    name: Helm chart lint + render
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate helm chart smoke script
        run: bash -n scripts/dev/helm-chart-smoke.sh
      - name: Lint, render, and schema-validate the chart
        run: scripts/dev/helm-chart-smoke.sh

  helm-oci-roundtrip:
    name: Helm OCI package/push/pull
    runs-on: avrea-ubuntu-latest-4-vcpu
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package, push to OCI, pull, and render the same artifact
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          helm package deploy/helm/mcp-gateway -d "$out"
          helm package deploy/helm/mcp-gateway-crds -d "$out"
          for tgz in "$out"/*.tgz; do
            helm push "$tgz" oci://localhost:5000/charts --plain-http
          done
          # Pull the app chart back and render the pulled artifact.
          ver="$(grep -E '^version:' deploy/helm/mcp-gateway/Chart.yaml | awk '{print $2}')"
          mkdir -p "$out/pulled"
          helm pull oci://localhost:5000/charts/mcp-gateway --version "$ver" -d "$out/pulled" --plain-http
          test -f "$out/pulled/mcp-gateway-$ver.tgz"
          helm template t "$out/pulled/mcp-gateway-$ver.tgz" | grep -q '^kind: Deployment'
          echo "OCI round-trip ok: pushed + pulled + rendered mcp-gateway $ver"

  helm-supply-chain:
    name: Helm supply chain (cosign + SBOM)
    runs-on: avrea-ubuntu-latest-4-vcpu
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Validate supply-chain smoke script
        run: bash -n scripts/dev/helm-supply-chain-smoke.sh
      - name: Sign + verify chart and image by digest, assert SBOM
        run: scripts/dev/helm-supply-chain-smoke.sh

  helm-airgap:
    name: Helm air-gap export/import
    runs-on: avrea-ubuntu-latest-4-vcpu
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
      airgap:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Validate air-gap smoke script
        run: bash -n scripts/dev/helm-airgap-smoke.sh
      - name: Export to bundle, import to isolated registry, verify + install offline
        run: scripts/dev/helm-airgap-smoke.sh

  k8s-kind-rollback:
    name: K8s kind apply+upgrade+rollback
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate kind rollback smoke script
        run: bash -n deploy/kubernetes/enterprise-alpha/scripts/kind-rollback-smoke.sh
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: mcp-gateway-rollback-smoke
      - name: Apply, upgrade, and roll back on the real cluster
        env:
          # kind-action already created the cluster and set the kube context;
          # the smoke reuses it (and must not delete it — the action owns teardown).
          MCP_GATEWAY_KIND_CLUSTER: mcp-gateway-rollback-smoke
          MCP_GATEWAY_KIND_KEEP: "1"
        run: deploy/kubernetes/enterprise-alpha/scripts/kind-rollback-smoke.sh
      - name: Validate helm kind lifecycle script
        run: bash -n scripts/dev/helm-kind-lifecycle.sh
      - name: Helm install, upgrade, and rollback on the real cluster
        env:
          MCP_GATEWAY_KIND_CLUSTER: mcp-gateway-rollback-smoke
          MCP_GATEWAY_KIND_KEEP: "1"
        run: scripts/dev/helm-kind-lifecycle.sh

  check:
    name: Clippy (pedantic)
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --all-features -- -D warnings

  windows-check:
    name: Windows check
    runs-on: avrea-windows-2025-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo check --all-features

  test:
    name: Tests
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --all-features

  fmt:
    name: Format
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Dependency audit
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-audit
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-audit --locked
      - run: cargo audit
      # The OSV half of the dependency gate, here because the docker job, the
      # only image publisher, needs this job: a known fixable vuln blocks the
      # publish. Exceptions are time-boxed in .github/osv-scanner.toml.
      - name: Scan Rust dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --config=.github/osv-scanner.toml
            --recursive
            ./

  kani:
    name: Kani
    # Kani's current toolchain is validated against Ubuntu 22.04. Keep the
    # Avrea runner pinned to that image rather than following latest.
    runs-on: avrea-ubuntu-22.04-4-vcpu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strip rust-version for Kani toolchain compatibility
        # Kani 0.67.0 (the latest model-checking/kani-github-action @ v1.1
        # SHA pin) ships nightly rustc 1.93. The project's
        # rust-version=1.95 (commit f2063376) is a deployment-target
        # requirement, not a verification requirement. Cargo's
        # rust-version gate fires before kani runs, so we strip the
        # field for this job only. Re-enable when Kani upstream ships a
        # release with a 1.95-compatible nightly bundle.
        run: sed -i '/^rust-version = /d' Cargo.toml
      - name: Run Kani proofs
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: --output-format=terse

  public-claims:
    name: Public claims
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Validate README benchmark scenario script
        run: python3 benchmarks/token_savings.py --scenario readme --json
      - name: Validate public claim consistency
        run: cargo test --test public_claims_validation

  secrets-scan:
    name: Secrets scan
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@0c952ace0f842f11c75775922d7400335cf60bc6 # main
        with:
          extra_args: --only-verified

  secret-leak-lint:
    name: Secret-leak lint (CWE-532)
    # Semantic check that trufflehog/osv-scanner don't cover: a struct that
    # derives Debug (or a log/print macro) over a field/variable whose name
    # is secret-shaped leaks *structure*, not a matched credential string —
    # trufflehog only flags verified live secret VALUES it can see in the
    # diff. This is the class of bug fixed in #323 (redact credentials from
    # Debug output). Pure stdlib Python, no extra deps, so it stays fast.
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the leak-lint parser (fail on parser regression)
        run: python3 scripts/dev/test_cwe532_leak_lint.py
      - name: Run CWE-532 leak lint
        run: python3 scripts/dev/cwe532-leak-lint.py src crates

  docker-check:
    name: Docker image check
    runs-on: avrea-ubuntu-latest-4-vcpu
    # Builds, scans and smokes the image on every push and pull request, with
    # read-only permissions, so a branch exercises the release image without
    # holding any publishing right (MIK-8831 REL).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image for the scan and smoke (load locally, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # The default image. `runtime-full` is the Dockerfile's last stage,
          # so a build that names none would build the variant instead.
          target: runtime
          load: true
          tags: mcp-gateway:ci

      - name: Trivy image scan (block on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-gateway:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke the image
        run: scripts/ci/smoke-image.sh mcp-gateway:ci

      - name: Build the full variant for the scan and smoke (load locally, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-full
          load: true
          tags: mcp-gateway:ci-full

      - name: Trivy the full variant (block on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mcp-gateway:ci-full
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke the full variant (it must spawn npx and uvx)
        run: scripts/ci/smoke-full-image.sh mcp-gateway:ci-full

  docker:
    name: Docker
    runs-on: avrea-ubuntu-latest-4-vcpu
    # The only image publisher (MIK-8831 REL), for a pushed release tag only:
    # the whole job, so neither a branch push nor a dispatch ever holds its
    # publishing permissions. docker.yml no longer publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    #
    # secrets-scan + secret-leak-lint added so the container image release
    # path can't ship on a tag whose push already failed a security check —
    # previously this job's needs: covered clippy/test/fmt/audit but not the
    # security jobs, so a red secrets-scan or leak-lint would not have
    # blocked ghcr.io publish. docker-check gates it on the scanned image.
    needs: [check, test, fmt, audit, secrets-scan, secret-leak-lint, public-claims, public-repo-hygiene, service-template-smoke, usability-smoke, helm-chart-smoke, helm-oci-roundtrip, helm-supply-chain, helm-airgap, docker-check]
    # One publisher at a time, never cancelled mid-release. A run that is still
    # pending when a newer tag queues behind it is superseded by GitHub; that
    # release shows as cancelled and is re-run.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract tag
        id: meta
        # v3.5.1 published both tag styles (3.5.1 and v3.5.1), so 3.5.2 does
        # too. major.minor goes only on a stable vX.Y.Z tag, and latest only on
        # the highest stable tag the repository has, so a maintenance release
        # of an older line never takes latest from a newer one.
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          image=ghcr.io/mikkoparkkola/mcp-gateway
          tags="${image}:${version}
          ${image}:v${version}
          ${image}:sha-${GITHUB_SHA::7}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags}
          ${image}:${version%.*}"
            # A failed query fails the release rather than skipping latest.
            remote="$(git ls-remote --tags --refs origin 'refs/tags/v*')"
            highest="$(printf '%s\n' "${remote}" \
              | sed 's|.*refs/tags/v||' \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -n 1)"
            if [ "${version}" = "${highest}" ]; then
              tags="${tags}
          ${image}:latest"
            fi
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}" | sed 's/^ *//'
            echo "EOF"
            # The -full variant takes every name the default image takes, with
            # -full appended: latest-full, 3.5-full, 3.5.2-full, v3.5.2-full.
            echo "tags_full<<EOF"
            echo "${tags}" | sed 's/^ *//; /^$/d; s/$/-full/'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # One build: the image scanned and smoked below is the image pushed and
      # signed, never a second build of the same source.
      - name: Build the release image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Trivy image scan (block on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mikkoparkkola/mcp-gateway:${{ steps.meta.outputs.version }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke the image
        run: scripts/ci/smoke-image.sh "ghcr.io/mikkoparkkola/mcp-gateway:${{ steps.meta.outputs.version }}"

      # The variant, built once like the default image: what is scanned and
      # smoked here is what is pushed and signed below.
      - name: Build the full variant (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime-full
          load: true
          tags: ${{ steps.meta.outputs.tags_full }}

      - name: Trivy the full variant (block on fixable HIGH/CRITICAL CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/mikkoparkkola/mcp-gateway:${{ steps.meta.outputs.version }}-full
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Smoke the full variant (it must spawn npx and uvx)
        run: scripts/ci/smoke-full-image.sh "ghcr.io/mikkoparkkola/mcp-gateway:${{ steps.meta.outputs.version }}-full"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        id: build
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        # latest is pushed last and only if this version is still the highest
        # stable tag now: a newer release tagged while this one ran keeps it.
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            if [ "${ref##*:}" = latest ]; then
              continue
            fi
            docker push "${ref}"
          done <<< "${TAGS}"
          if printf '%s\n' "${TAGS}" | grep -qx 'ghcr.io/mikkoparkkola/mcp-gateway:latest'; then
            remote="$(git ls-remote --tags --refs origin 'refs/tags/v*')"
            highest="$(printf '%s\n' "${remote}" \
              | sed 's|.*refs/tags/v||' \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -n 1)"
            if [ "${VERSION}" = "${highest}" ]; then
              docker push ghcr.io/mikkoparkkola/mcp-gateway:latest
              echo "latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "latest: ${highest} is newer than ${VERSION}; not moved" >&2
              echo "latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/mikkoparkkola/mcp-gateway:${VERSION}")"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Push the full variant
        id: build_full
        env:
          TAGS: ${{ steps.meta.outputs.tags_full }}
          VERSION: ${{ steps.meta.outputs.version }}
        # The same rule as the default image: latest-full goes last, and only
        # while this version is still the highest stable tag.
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            if [ "${ref##*:}" = latest-full ]; then
              continue
            fi
            docker push "${ref}"
          done <<< "${TAGS}"
          if printf '%s\n' "${TAGS}" | grep -qx 'ghcr.io/mikkoparkkola/mcp-gateway:latest-full'; then
            remote="$(git ls-remote --tags --refs origin 'refs/tags/v*')"
            highest="$(printf '%s\n' "${remote}" \
              | sed 's|.*refs/tags/v||' \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sort -V | tail -n 1)"
            if [ "${VERSION}" = "${highest}" ]; then
              docker push ghcr.io/mikkoparkkola/mcp-gateway:latest-full
              echo "latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "latest-full: ${highest} is newer than ${VERSION}; not moved" >&2
              echo "latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/mikkoparkkola/mcp-gateway:${VERSION}-full")"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        # SHA-pinned like every other action here; cosign-release is pinned so
        # flag behavior can't drift under a new default.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Cosign keyless-sign the released image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Generate + attest an SBOM (SPDX JSON) for the released image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}" -o spdx-json > sbom.spdx.json
          test -s sbom.spdx.json
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Verify the release signature + SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          # Exact signer identity: THIS workflow file at the pushed tag ref, so a
          # different workflow with OIDC cannot satisfy the check.
          IDENTITY: https://github.com/MikkoParkkola/mcp-gateway/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Verify every alias resolves to the signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          LATEST: ${{ steps.build.outputs.latest }}
        # Every name the push applied, from the same list it was given, so an
        # alias added there is checked here too; latest only if it was moved.
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            if [ "${ref##*:}" = latest ] && [ "${LATEST:-false}" != true ]; then
              continue
            fi
            got="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "alias ${ref} resolves to ${got}, not the signed ${DIGEST}" >&2
              exit 1
            fi
          done <<< "${TAGS}"

      - name: Cosign keyless-sign the full variant by digest
        env:
          DIGEST: ${{ steps.build_full.outputs.digest }}
        run: cosign sign --yes "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Generate + attest an SBOM (SPDX JSON) for the full variant
        env:
          DIGEST: ${{ steps.build_full.outputs.digest }}
        run: |
          set -euo pipefail
          syft "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}" -o spdx-json > sbom-full.spdx.json
          test -s sbom-full.spdx.json
          cosign attest --yes --predicate sbom-full.spdx.json --type spdxjson \
            "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Verify the full variant's signature + SBOM attestation
        env:
          DIGEST: ${{ steps.build_full.outputs.digest }}
          IDENTITY: https://github.com/MikkoParkkola/mcp-gateway/.github/workflows/ci.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/mikkoparkkola/mcp-gateway@${DIGEST}"

      - name: Verify every full alias resolves to its signed digest
        env:
          DIGEST: ${{ steps.build_full.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags_full }}
          LATEST: ${{ steps.build_full.outputs.latest }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "${ref}" ] || continue
            if [ "${ref##*:}" = latest-full ] && [ "${LATEST:-false}" != true ]; then
              continue
            fi
            got="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "alias ${ref} resolves to ${got}, not the signed ${DIGEST}" >&2
              exit 1
            fi
          done <<< "${TAGS}"

  publish-mcp-registry:
    # Moved from docker.yml: it runs only after the docker job published and
    # verified the image, on the same pushed tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: avrea-ubuntu-latest-4-vcpu
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Set release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          jq --arg version "$VERSION" --arg image "$IMAGE" \
            '.version = $version
             | del(.packages[0].version)
             | .packages[0].identifier = $image' \
            server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
