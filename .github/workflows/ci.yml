name: CI

# Throwaway branch for the macOS parts change's E2 oracle, never merged: this file replaces the whole CI here so a dispatch runs
# only the oracle job. It builds today's unsplit macOS lib test binary, lists it, and compares the list with the
# union of the five part lists the E1 dispatch run (44474833728, head f9bf3eb6f3) uploaded. src/, build.rs, the
# manifests and scripts/dev/test-parts-build.rs are identical between that head and this branch's base
# (76e71270fd), so both sides list the same source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2-oracle:
    name: E2 macOS whole lib list against the parts' union
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
      # Reads the E1 run's part-list artifacts.
      actions: read
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
      - name: The cfg the expect step evaluates for this target
        run: rustc --print cfg --target aarch64-apple-darwin
      - name: Build the whole lib test binary
        timeout-minutes: 120
        run: python3 scripts/ci/shard_tests.py export-lib "$RUNNER_TEMP/whole"
      - name: List it, unfiltered
        run: |
          "$RUNNER_TEMP/whole/lib-tests" --list > "$RUNNER_TEMP/whole/whole.txt"
          echo "image $ImageOS $ImageVersion, $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
      - name: The E1 run's part lists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-lib-lists-*
          path: ${{ runner.temp }}/lists
          merge-multiple: false
          run-id: 44474833728
          github-token: ${{ github.token }}
      - name: The five parts' union equals the whole binary's list, with no name in two parts
        run: |
          python3 - "$RUNNER_TEMP/lists" "$RUNNER_TEMP/whole/whole.txt" <<'PY'
          import pathlib, re, sys
          def names(text):
              return {line[: -len(": test")] for line in text.splitlines() if line.endswith(": test")}
          parts = {}
          for path in sorted(pathlib.Path(sys.argv[1]).glob("**/p*/list.txt")):
              if re.fullmatch(r"p\d+", path.parent.name):
                  parts[path.parent.name] = names(path.read_text())
          union = set().union(*parts.values())
          whole = names(pathlib.Path(sys.argv[2]).read_text())
          sizes = {k: len(v) for k, v in sorted(parts.items())}
          print(f"parts {sizes}, sum {sum(sizes.values())}, union {len(union)}, whole {len(whole)}")
          print("in the whole list, in no part:", sorted(whole - union)[:20])
          print("in a part, not in the whole list:", sorted(union - whole)[:20])
          ok = len(parts) == 5 and union == whole and sum(sizes.values()) == len(union)
          sys.exit(0 if ok else 1)
          PY
