name: UI tests

# Browser tests for the web UI shell: Playwright with axe-core, in Chromium,
# against ui-tests/server.mjs, which answers /ui like the gateway and serves
# /ui/api from fixture JSON. Every test aborts requests to any other host
# (ui-tests/tests/base.mjs), so the job reads fixtures only.
#
# Supply chain: exact versions in ui-tests/package-lock.json (with integrity
# hashes), installed by `npm ci --ignore-scripts` so no package runs an
# install script. Only Chromium is downloaded, by Playwright's own installer,
# and cached under the locked Playwright version.
on:
  pull_request:
    paths:
      - 'src/gateway/ui/**'
      - 'ui-tests/**'
      - 'scripts/dev/rehash_ui_assets.py'
      - 'scripts/dev/test_rehash_ui_assets.py'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main, docs/ranking-1-release-line]
    paths:
      - 'src/gateway/ui/**'
      - 'ui-tests/**'
      - 'scripts/dev/rehash_ui_assets.py'
      - 'scripts/dev/test_rehash_ui_assets.py'
      - '.github/workflows/ui-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: UI tests (Playwright)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) || contains(github.head_ref, 'ui-tests') }}
    runs-on: ubuntu-24.04
    # 15, not 5: a cold Chromium install exceeds 5 min, and the cache saves only on success.
    # 30 since the page budgets' spread run: 20 loads per page, phone loads at 4x CPU.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Asset names carry their bytes' hash, and a screen imports the shell by
      # that name: the rehash script must hash a file after what it imports.
      - name: Check the asset rehash script hashes in import order
        working-directory: .
        run: python3 -I scripts/dev/test_rehash_ui_assets.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the locked packages without install scripts
        run: npm ci --ignore-scripts
      - name: Read the locked Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      # Restore here on every run; the save after the install writes only on the release line and main.
      - name: Restore Chromium
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The browser alone: it comes from Playwright's own CDN, never from an apt mirror.
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Only after a miss, as the combined cache action did: a hit has nothing new to save.
      - name: Save Chromium
        if: (github.ref == 'refs/heads/docs/ranking-1-release-line' || github.ref == 'refs/heads/main') && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # The system libraries come from apt. Not `install --with-deps`: that runs `apt-get update` first and
      # exits 100 when a Ubuntu mirror is down (security.ubuntu.com was unreachable on 2026-11-11, which
      # failed this job at setup on the release line and on every merge train). Retry apt, and if it still
      # fails go on with a warning: the hosted image already carries most of Chromium's libraries, and the
      # test step below fails loudly if one is really missing.
      - name: Install Chromium's system libraries (best effort when a mirror is down)
        run: |
          # Playwright's own `apt-get update` takes this setting too, not only the one below.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          # `timeout`: dead DNS multiplied by apt's retries once held this step for the whole job limit.
          sudo timeout 120 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update \
            || echo "::warning::the package index update failed or timed out; trying the library install anyway"
          timeout 300 npx playwright install-deps chromium \
            || echo "::warning::the system libraries were not installed (apt mirror unreachable); relying on the hosted image's"
      - name: Run the browser tests
        env:
          CI: 'true'
        # The `visual` project needs the design frames, which are not in
        # this repository; it runs locally.
        run: npx playwright test --project=chromium
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-tests-report
          path: |
            ui-tests/playwright-report
            ui-tests/test-results
          retention-days: 7
      # LCP and CLS budgets (motion spec, measured with Playwright and DevTools
      # throttling), 20 loads per page: p50, p75, max. A budget blocks once its
      # spread on this runner clears it: LCP does (2x margin or more, max - p50
      # at most 44 ms on every row), so an LCP miss fails the job. CLS is still
      # reported only (BLOCKING in ui-tests/perf/vitals.perf.mjs) until the shell
      # holds its layout from first paint.
      # One worker: parallel phone loads would measure each other's CPU use.
      - name: Check the page budgets (LCP blocks, CLS is reported)
        if: ${{ !cancelled() }}
        env:
          CI: 'true'
          PERF_LOADS: '20'
        run: npx playwright test --project=perf --workers=1
      - name: Keep the page budgets' spread
        # always(), not !cancelled(): a job that hits its time limit is
        # cancelled, and the rows it measured are the evidence most needed.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-perf-spread
          # The per-row files too: a run cut short keeps every row it measured.
          path: |
            ui-tests/test-results/perf-summary.json
            ui-tests/test-results/perf/
          if-no-files-found: warn
          retention-days: 30
