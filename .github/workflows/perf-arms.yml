name: Perf arms

# Throwaway branch only (never merged). Experiment arm: the tip with a larger
# lazy-DFA cache on the context-integrity and response-inspection RegexSets.
on:
  push:
    branches: ["throwaway/perf-arms-*"]

permissions:
  contents: read

jobs:
  build:
    name: Build experiment arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --bin mcp-gateway
          mkdir -p out
          cp target/release/mcp-gateway out/mcp-gateway-X
          git rev-parse HEAD > out/ref-X.txt
          (cd out && sha256sum mcp-gateway-X > sha256-X.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-arm-X-${{ github.sha }}
          path: out/
          retention-days: 14
          if-no-files-found: error
