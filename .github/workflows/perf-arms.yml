name: Perf arms

# Throwaway branch only (never merged). Builds every benchmark arm with ONE
# recipe -- same runner image, same pinned toolchain, default features,
# --release --locked -- so a paired latency comparison measures the code and
# not the build. Binaries are uploaded with their sha256 for the bench host.
on:
  push:
    branches: ["throwaway/perf-arms-*"]

permissions:
  contents: read

jobs:
  build:
    name: Build arm ${{ matrix.cell }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: A, ref: 32f135a61fb50c20a044fb4c2347bc1cf8015d89 }
          - { cell: B, ref: e138680a542b41fa156a94a1ffc9decd9692be77 }
          - { cell: L, ref: 1393e01451c260428029a82519944e588c9adac1 }
          - { cell: T, ref: 92959720d30eb41d9a1429e24fd3fef6328d1f58 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Build
        shell: bash
        run: |
          rustc --version
          cargo build --release --locked --bin mcp-gateway
          mkdir -p out
          cp target/release/mcp-gateway "out/mcp-gateway-${{ matrix.cell }}"
          echo "${{ matrix.ref }}" > "out/ref-${{ matrix.cell }}.txt"
          rustc --version > "out/rustc-${{ matrix.cell }}.txt"
          (cd out && sha256sum "mcp-gateway-${{ matrix.cell }}" > "sha256-${{ matrix.cell }}.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-arm-${{ matrix.cell }}-${{ matrix.ref }}
          path: out/
          retention-days: 14
          if-no-files-found: error
