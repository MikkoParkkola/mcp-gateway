name: Perf arms

# Throwaway branch only (never merged). Builds the release binary of each
# L7 trim arm on aarch64 for price2 on the bench host.
on:
  push:
    branches: ["throwaway/perf-arms-*"]

permissions:
  contents: read

jobs:
  build:
    name: Build arm ${{ matrix.arm }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arm: P0, ref: b36d26230671981eae598183ffe959887a30d684 }
          - { arm: P1, ref: afd2a5513101c5f5abd68be0c1ee58e69b280112 }
          - { arm: S1, ref: a2630fc67a7a9ceb1eb540d3d676b7760a60bee9 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Build
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
        run: |
          cargo build --release --locked --bin mcp-gateway
          mkdir -p out
          cp target/release/mcp-gateway "out/mcp-gateway-$ARM"
          git rev-parse HEAD > "out/ref-$ARM.txt"
          (cd out && sha256sum "mcp-gateway-$ARM" > "sha256-$ARM.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-arm-${{ matrix.arm }}-${{ matrix.ref }}
          path: out/
          retention-days: 14
          if-no-files-found: error
