name: Perf arms

# Throwaway branch only (never merged). This commit runs a diagnostic: does
# each production RegexSet search faster with a larger lazy-DFA cache?
# (A RegexSet whose lazy DFA cannot be built runs on the PikeVM.)
on:
  push:
    branches: ["throwaway/perf-arms-*"]

permissions:
  contents: read

jobs:
  probe:
    name: Regex engine probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Probe
        shell: bash
        run: |
          cargo test --release --locked --lib l7_probe -- --nocapture --test-threads=1 2>&1 | grep -E "L7PROBE|test result|error" | tee probe.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat probe.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
