name: Perf arms

# Throwaway branch only (never merged). Windows coverage run for the
# Windows-only Critical rows, as docs/release/v4.0.0-critical-path-coverage.md
# describes it.
on:
  push:
    branches: ["throwaway/perf-arms-*"]

permissions:
  contents: read

jobs:
  windows-coverage:
    name: Windows coverage
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        shell: pwsh
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage
        shell: pwsh
        env:
          RUST_MIN_STACK: "8388608"
        run: |
          cargo llvm-cov --no-report --all-features --tests --ignore-run-fail
          $code = $LASTEXITCODE
          Write-Host "test run exit $code"
          cargo llvm-cov report --lcov --output-path windows.lcov
      - name: Grade
        shell: pwsh
        run: |
          python scripts/release/critical_function_coverage.py --lcov windows.lcov | Select-String -Pattern "windows" | ForEach-Object { $_.Line }
          python scripts/release/critical_function_coverage.py --lcov windows.lcov > grade.txt
          Get-Content grade.txt | Select-String -Pattern "_windows" | ForEach-Object { $_.Line }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-coverage
          path: |
            windows.lcov
            grade.txt
          retention-days: 14
