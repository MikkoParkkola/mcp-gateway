name: Perf arms

# Throwaway branch only (never merged). Builds the release binary of each
# L7 trim arm on aarch64 for price2 on the bench host.
on:
  push:
    branches: ["throwaway/perf-arms-*"]

permissions:
  contents: read

jobs:
  build:
    name: Build arm ${{ matrix.arm }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arm: M0, ref: 943d8d838c67123c6b1c54d99650426b1306d9c9 }
          - { arm: M1, ref: 6f0dd5fec3f413f57478012f0c8bd3ade9929be8 }
          - { arm: M2, ref: 7317d4c94ef5ec23602eccb49d2943b1706a0736 }
          - { arm: M3, ref: 734eb228a6e23ce0877b0451ca49eb1371a39d34 }
          - { arm: M4, ref: 6b463a06a5a0703be815b20475393e0f36e51330 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
      - name: Build
        shell: bash
        env:
          ARM: ${{ matrix.arm }}
        run: |
          cargo build --release --locked --bin mcp-gateway
          mkdir -p out
          cp target/release/mcp-gateway "out/mcp-gateway-$ARM"
          git rev-parse HEAD > "out/ref-$ARM.txt"
          (cd out && sha256sum "mcp-gateway-$ARM" > "sha256-$ARM.txt")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-arm-${{ matrix.arm }}-${{ matrix.ref }}
          path: out/
          retention-days: 14
          if-no-files-found: error
