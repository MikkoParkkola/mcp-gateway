# A trial of the Linux coverage grade split across runners. Not a required check: it runs
# only on a push to throwaway/covshard-trial-<n>, where <n> is the number of shards for
# "Every other test target" (3 or 4). The name stays outside coverage-probe.yml's
# throwaway/coverage-* trigger: the single job's run on the same commit is the baseline.
# Each shard runs its share under `cargo llvm-cov --no-report` and uploads its profiles and
# instrumented executables; the merge job reports from all of them and fails if a shard's
# bundle is missing or two shards built different binaries under one name.
name: Coverage shard trial

on:
  push:
    branches: ["throwaway/covshard-trial-*"]

concurrency:
  group: coverage-shard-trial-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Instrumented frames overflow the 2 MiB default test-thread stack.
  RUST_MIN_STACK: "8388608"

jobs:
  plan:
    name: Plan and partition check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      n: ${{ steps.plan.outputs.n }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - id: plan
        run: |
          set -euo pipefail
          n="${GITHUB_REF_NAME##*-}"
          python3 scripts/ci/coverage_shards.py --self-test
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 scripts/ci/coverage_shards.py check "$n" metadata.json
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 scripts/ci/coverage_shards.py plan "$n")" >> "$GITHUB_OUTPUT"

  sdk:
    name: Shard sdk (SDK journey alone)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Pinned task SDK and Redis
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/python" -m pip install --disable-pip-version-check \
            'fastmcp==4.0.3' 'fastmcp-tasks==4.0.3' 'pydocket==0.25.0'
          echo "MCP_GATEWAY_TASK_SDK_PYTHON=$RUNNER_TEMP/sdk/bin/python" >> "$GITHUB_ENV"
          c="$(docker run --detach --rm --publish 127.0.0.1::6379 \
            mirror.gcr.io/library/redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf \
            redis-server --save '' --appendonly no)"
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$c")"
          echo "MCP_GATEWAY_TASK_SDK_REDIS_URL=redis://127.0.0.1:$port/0" >> "$GITHUB_ENV"
      - name: SDK journey alone, single-threaded
        run: |
          set -o pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --all-features --test task_upstream_recovery_sdk -- --test-threads 1 2>&1 | tee run.log
      - name: Bundle
        run: bash scripts/ci/coverage_shard_bundle.sh sdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-shard-sdk
          retention-days: 7
          compression-level: 1
          path: bundle/

  shard:
    name: Shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run the shard
        run: |
          set -o pipefail
          cargo llvm-cov clean --workspace
          python3 scripts/ci/coverage_shards.py run "${{ needs.plan.outputs.n }}" "${{ matrix.shard }}" 2>&1 | tee run.log
      - name: Bundle
        run: bash scripts/ci/coverage_shard_bundle.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-shard-${{ matrix.shard }}
          retention-days: 7
          compression-level: 1
          path: bundle/

  merge:
    name: Merge and report
    needs: [plan, sdk, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-shard-*
          path: shards/
      - name: Unpack every shard
        run: |
          set -euo pipefail
          expected="sdk $(echo '${{ needs.plan.outputs.shards }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')"
          bash scripts/ci/coverage_shard_merge.sh $expected
      - name: Reports
        run: |
          set -o pipefail
          # -v prints each llvm-cov command line, with every -object it reads.
          cargo llvm-cov report -v --summary-only --json --output-path cov.json 2>&1 | tee report-json.log
          cargo llvm-cov report -v --lcov --output-path linux.lcov 2>&1 | tee report-lcov.log
          python3 scripts/ci/coverage_shards.py canary linux.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-shard-trial
          retention-days: 7
          path: |
            cov.json
            linux.lcov
            report-json.log
            report-lcov.log
            shards/*/run.log
            shards/*/manifest.txt
