name: Perf profile per call

# Throwaway branch only (never merged). Where the 4.0 per-call CPU over
# v3.5.1 sits, on the grading host type: B = v3.5.1, C = the release-line
# commit the final B14 head last merged, T = that head. Each arm gets a clean rep (CPU per
# call, no profiler attached) and a profiled rep (perf, dwarf unwind) under
# the same driver, fixture, config and rate as the CPU-per-call runs.
# Symbols are kept by env override only; codegen is the release profile's.
on:
  push:
    branches: ["throwaway/perf-prof-*"]

permissions:
  contents: read

env:
  REF_B: v3.5.1
  REF_C: 5ddc1226ff413d4ca54203b8c480224985e9be5b
  REF_T: 0d615f38b4ea03356506a3f83c1b08eb10171862
  FEATURES: a2a,webui,config-export,cost-governance,firewall,discovery,semantic-search,tool-profiles,metrics
  CARGO_PROFILE_RELEASE_STRIP: none
  CARGO_PROFILE_RELEASE_DEBUG: "1"
  WARMUP: "2000"
  CALLS: "40000"
  # Under the workload config's 500/s rate limit, so no call is refused.
  RATE: "400"
  PROFILE_SECONDS: "80"
  PORT: "39420"
  # MODE profile: clean reps plus one perf rep per arm. MODE count: clean reps
  # only, every arm built by alloc_count_patch.py (allocations per call; its
  # CPU figures are on the System allocator and not comparable). TARGET empty
  # builds the host default (glibc); a triple builds that target.
  MODE: profile
  TARGET: aarch64-unknown-linux-musl

jobs:
  profile:
    name: Profile per call
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Reserve the port and enable perf
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$PORT"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" linux-tools-common \
            || sudo apt-get install -y -qq linux-tools-generic linux-tools-common
          perf_bin="$(command -v perf || true)"
          if [[ -z "$perf_bin" ]] || ! "$perf_bin" --version; then
            perf_bin="$(compgen -G '/usr/lib/linux-tools/*/perf' | head -1)"
            "$perf_bin" --version
          fi
          echo "PERF=$perf_bin" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-unknown-linux-musl
      - name: Build arms
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$TARGET" ]] || sudo apt-get install -y -qq musl-tools
          for arm in "B:$REF_B" "C:$REF_C" "T:$REF_T"; do
            name="${arm%%:*}"; ref="${arm#*:}"; dir="$RUNNER_TEMP/arms/$name"
            git worktree add --detach "$dir" "$ref^{commit}" > /dev/null
            [[ "$MODE" != count ]] || python3 benchmarks/workload/alloc_count_patch.py "$dir"
            ( cd "$dir" && cargo build --release --locked --features "$FEATURES" ${TARGET:+--target "$TARGET"} )
            echo "$name $(git -C "$dir" rev-parse HEAD) mode=$MODE target=${TARGET:-host}" | tee -a "$RUNNER_TEMP/out/arms.txt"
            file "$dir/target/${TARGET:+$TARGET/}release/mcp-gateway" | tee -a "$RUNNER_TEMP/out/arms.txt"
          done
          { echo "nproc $(nproc)"; uname -m; uname -r; echo "loadavg $(cat /proc/loadavg)"; } > "$RUNNER_TEMP/out/host.txt"
      - name: Profile
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; config="$RUNNER_TEMP/gateway.workload.yaml"
          fixture="$PWD/benchmarks/workload/mcp_backend.py"
          # shellcheck disable=SC2016 # the placeholder is literal, as the harness renders it
          python3 -c 'import sys; t=open(sys.argv[1]).read(); assert "${WORKLOAD_FIXTURE}" in t; open(sys.argv[2],"w").write(t.replace("${WORKLOAD_FIXTURE}", sys.argv[3]))' \
            benchmarks/workload/gateway.workload.yaml "$config" "$fixture"
          # 4.0 refuses a config other users can read (UPGRADING-4.0 §35).
          chmod 600 "$config"
          for _ in $(seq 120); do awk '{exit !($1 < 1.0)}' /proc/loadavg && break; sleep 5; done
          echo "idle_load1 $(cut -d' ' -f1 /proc/loadavg)" >> "$out/host.txt"
          port_open() { (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; }
          start() { # start <arm> <tag>: gateway on $PORT, healthy, pid in $pid
            held="$(ss -Htan "( sport = :$PORT )")"
            [[ -z "$held" ]] || { echo "$held"; echo "VOID: port held before $2"; exit 3; }
            home="$RUNNER_TEMP/home-$2"; mkdir -p "$home"
            HOME="$home" RUST_LOG=error WORKLOAD_FIXTURE="$fixture" ALLOC_COUNT_FILE="$RUNNER_TEMP/alloc-$2.txt" \
              "$RUNNER_TEMP/arms/$1/target/${TARGET:+$TARGET/}release/mcp-gateway" --config "$config" --port "$PORT" \
              > "$out/$2.stdout" 2> "$out/$2.stderr" &
            pid=$!
            for _ in $(seq 150); do
              curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null 2>&1 && break
              kill -0 "$pid" 2>/dev/null || { echo "VOID: $2 exited during startup"; exit 3; }
              sleep 0.2
            done
            curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null || { echo "VOID: $2 never healthy"; exit 3; }
          }
          stop() { kill "$pid" || true; wait "$pid" 2>/dev/null || true; for _ in $(seq 100); do port_open || break; sleep 0.2; done; }
          # -B: no build-id pass after recording. On 4.0 binaries that pass
          # hung in addr2line until the job timed out (runs 37484979867,
          # 37500520719); symbols still resolve by each arm's own path.
          record() { # record <arm> <seconds>: profile $pid into $RUNNER_TEMP/<arm>.data
            timeout -s INT -k 10 600 "$PERF" record -B -F 1999 --call-graph dwarf,16384 -p "$pid" -o "$RUNNER_TEMP/$1.data" -- sleep "$2" \
              2> "$out/prof-$1.record.err" || { echo "VOID: perf record $1 did not finish"; exit 3; }
          }
          # Smoke: a short record and report per arm before any measured rep,
          # so a profiler fault voids in minutes, not at the job timeout. Count mode records nothing.
          for arm in $([[ "$MODE" == count ]] || echo B C T); do
            start "$arm" "smoke-$arm"
            python3 benchmarks/workload/cpu_per_call.py measure "$PORT" "$pid" 0 "$(( RATE * 6 ))" "$RATE" "$out/smoke-$arm.json" &
            driver=$!
            sleep 1
            record "smoke-$arm" 3
            wait "$driver"
            stop
            timeout -k 10 120 "$PERF" report -i "$RUNNER_TEMP/smoke-$arm.data" --no-inline --children --sort symbol -g none --stdio \
              > "$out/smoke-$arm.children.txt" 2> "$out/smoke-$arm.report.err" || { echo "VOID: smoke report $arm failed"; exit 3; }
            grep -q 'mcp_gateway' "$out/smoke-$arm.children.txt" || { echo "VOID: smoke report $arm has no gateway frame"; exit 3; }
            rm -f "$RUNNER_TEMP/smoke-$arm.data"
          done
          # Arm order rotates, so no arm always runs first or last.
          n=0
          for order in "B C T" "C T B" "T B C"; do
            n=$(( n + 1 ))
            for arm in $order; do
              start "$arm" "clean-$arm-$n"
              # Count mode: the driver reads the file this rep's gateway writes.
              counts=""; [[ "$MODE" != count ]] || counts="$RUNNER_TEMP/alloc-clean-$arm-$n.txt"
              ALLOC_COUNT_FILE="$counts" python3 benchmarks/workload/cpu_per_call.py measure "$PORT" "$pid" "$WARMUP" "$CALLS" "$RATE" "$out/clean-$arm-$n.json"
              stop
            done
          done
          [[ "$MODE" != count ]] || exit 0
          for arm in B C T; do
            start "$arm" "prof-$arm"
            python3 benchmarks/workload/cpu_per_call.py measure "$PORT" "$pid" "$WARMUP" "$CALLS" "$RATE" "$out/prof-$arm.json" &
            driver=$!
            # Past the warm-up (WARMUP / RATE seconds), inside the measured calls.
            sleep $(( WARMUP / RATE + 3 ))
            record "$arm" "$PROFILE_SECONDS"
            wait "$driver"
            stop
          done
          failed=0
          # Reports after every arm is recorded, so a slow report cannot cost a
          # recording. --no-inline: inline resolution per dwarf sample ran past
          # three hours in run 37461088507. Each report is time-boxed. Self time
          # has no cutoff, so its rows sum to every sample; children stops at
          # 0.01%. perf.data and the binary it resolves against are kept.
          keep="$RUNNER_TEMP/keep"; mkdir -p "$keep"
          for arm in B C T; do
            timeout -k 10 1200 "$PERF" report -i "$RUNNER_TEMP/$arm.data" --no-inline --children --sort symbol -g none --percent-limit 0.01 --stdio \
              > "$out/prof-$arm.children.txt" 2> "$out/prof-$arm.report.err" || { echo "children report exit $?" >> "$out/prof-$arm.report.err"; failed=1; }
            timeout -k 10 1200 "$PERF" report -i "$RUNNER_TEMP/$arm.data" --no-inline --no-children --sort symbol -g none --percent-limit 0 --stdio \
              > "$out/prof-$arm.self.txt" 2>> "$out/prof-$arm.report.err" || { echo "self report exit $?" >> "$out/prof-$arm.report.err"; failed=1; }
            timeout -k 10 1200 "$PERF" report -i "$RUNNER_TEMP/$arm.data" --no-inline --no-children --sort dso -g none --percent-limit 0 --stdio \
              > "$out/prof-$arm.dso.txt" 2>> "$out/prof-$arm.report.err" || { echo "dso report exit $?" >> "$out/prof-$arm.report.err"; failed=1; }
            mkdir -p "$keep/$arm"
            mv "$RUNNER_TEMP/$arm.data" "$keep/$arm/perf.data"
            cp "$RUNNER_TEMP/arms/$arm/target/${TARGET:+$TARGET/}release/mcp-gateway" "$keep/$arm/"
            echo "$RUNNER_TEMP/arms/$arm/target/${TARGET:+$TARGET/}release/mcp-gateway" > "$keep/$arm/recorded-path.txt"
          done
          # Every arm gets its reports first; then a failed one voids the run.
          [[ "$failed" == 0 ]] || { echo "VOID: a profile report failed"; exit 3; }
      - name: Socket table on failure
        if: failure()
        shell: bash
        run: ss -tanp > "$RUNNER_TEMP/out/ss-on-failure.txt" 2>&1 || true
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-prof-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
      - name: Upload perf.data and binaries
        if: always() && env.MODE == 'profile'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-data-${{ github.run_id }}
          path: ${{ runner.temp }}/keep/
          if-no-files-found: warn
          retention-days: 30
