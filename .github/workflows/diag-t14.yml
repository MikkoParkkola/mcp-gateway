name: Diag t14 Windows
# Throwaway diagnostic (MIK-8364): the same-run A/B of the telemetry saver
# fix on Windows release. Deleted with its branch.
on:
  pull_request:
    branches: [docs/ranking-1-release-line]
permissions:
  contents: read
jobs:
  diag:
    if: ${{ github.head_ref == 'throwaway/diag-t14-windows' }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --release --all-features --lib --no-run
      # Sessions with the telemetry sink on the runner's temp disk and with
      # no sink, interleaved in one process (30 pairs, 100 pings each).
      - name: MIK-8364 A/B
        shell: bash
        run: |
          set +e +o pipefail
          cargo test --release --all-features --lib gateway::server::signing_allocation_tests::stdio_list_changed::t14diag_ab_interleaved -- --exact --nocapture 2>&1 | grep -E 'T14DIAG AB|test result|panicked'
