name: Rustdoc links

# Builds the public API docs and fails on an intra-doc link that resolves to
# nothing (MIK-8008). Its own workflow, not a ci.yml job: ci.yml runs nothing
# but `Tests (throwaway)` on a `throwaway/` PR. This job skips one too, unless
# the head's name holds `rustdoc` (a planted broken link shown red, e.g.
# throwaway/b23-rustdoc); scripts/ci/test_throwaway_routing.py checks both.
# Every feature is built, so a
# public item behind an opt-in feature is checked too; private-only items are
# out of scope: no --document-private-items.
on:
  pull_request:
  push:
    branches: [main, docs/ranking-1-release-line]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    name: Rustdoc intra-doc links (MIK-8008)
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'docs/ranking-1-release-line' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'throwaway/')) || contains(github.head_ref, 'rustdoc') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build the docs with broken links denied
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps --locked --all-features
      # The library is internal to the binary (MIK-8044.SURF.5): every
      # crate-root item is #[doc(hidden)], so the crate page lists none.
      # The ids are rustdoc's section headers (h2.section-header, checked on
      # rustdoc 1.95 and 1.98); if rustdoc renames them, this step goes blind.
      - name: The crate root documents no item
        run: |
          page=target/doc/mcp_gateway/index.html
          test -s "$page"
          if grep -oE 'id="(modules|reexports|macros|structs|enums|unions|traits|functions|types|constants|statics)"' "$page"; then
            echo "::error::$page lists crate-root items; mark them #[doc(hidden)] (scripts/release/check_surface_inventory.py)"
            exit 1
          fi
