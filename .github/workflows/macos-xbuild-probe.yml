# Option E probe (throwaway; never merged): does the 4-vCPU, 14 GB Intel macOS runner cross-build the arm64 `--lib`
# test binary faster than macOS lib-b builds it natively, and does that binary list and pass the same tests on arm64?
# Falsifier: same --list, same ignored set, lib-b passes, transfer <= ~8 min, xbuild + transfer < native build.
#
# Probe 2 (lead go 2026-11-16): probe 1 (run 43780258657) passed --list, the ignored set, transfer (21 s) and speed
# (41.7 vs 86.0 min); its lib-b step never ran (the design's `run-prebuilt macos lib-b` is not a valid call). This run
# builds nothing: one arm64 job downloads probe 1's cross-built binary and runs both lib halves from it. lib-b runs
# through a probe-only PREBUILT entry on this branch (scripts/ci/shard_tests.py); lib-a is a PREBUILT shard already.
name: macOS xbuild probe

on:
  push:
    branches: ["throwaway/macos-xbuild-*"]

permissions:
  contents: read
  actions: read  # download probe 1's artifact from its run

jobs:
  run:
    name: Run the cross-built binary on arm64 (probe 2)
    runs-on: macos-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: echo "image $ImageOS $ImageVersion, $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB, $(uname -m)"
      - name: Download probe 1's cross-built binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xbuild-lib-tests
          path: ${{ runner.temp }}/lib-bin
          run-id: 43780258657
          github-token: ${{ github.token }}
      - name: List and ignored-set hashes
        env:
          BIN: ${{ runner.temp }}/lib-bin/lib-tests
        run: |
          chmod 755 "$BIN"
          file "$BIN"
          export CARGO_MANIFEST_DIR="$PWD"
          echo "list $("$BIN" --list --format terse | sort | tee "$RUNNER_TEMP/list.txt" | shasum -a 256) n=$(wc -l < "$RUNNER_TEMP/list.txt")"
          echo "ignored $("$BIN" --list --ignored --format terse | sort | tee "$RUNNER_TEMP/ign.txt" | shasum -a 256) n=$(wc -l < "$RUNNER_TEMP/ign.txt")"
      - name: lib-a from the cross-built binary
        timeout-minutes: 75
        run: python3 scripts/ci/shard_tests.py run-prebuilt macos lib-a "$RUNNER_TEMP/lib-bin/lib-tests"
      - name: lib-b from the cross-built binary
        if: success() || failure()
        timeout-minutes: 75
        run: python3 scripts/ci/shard_tests.py run-prebuilt macos lib-b "$RUNNER_TEMP/lib-bin/lib-tests"
