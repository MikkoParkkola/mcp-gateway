# MIK-8181 throwaway probe: the config real-watcher rows on macOS. Never merged.
name: MIK-8181 macOS probe
on:
  push:
    branches: ["throwaway/mik-8181-*"]
permissions:
  contents: read
jobs:
  probe:
    name: MIK-8181 real-watcher rows on macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: false
      - name: Real-watcher rows (macOS)
        run: |
          cargo test --all-features --lib --no-fail-fast -- config_reload:: gateway::server::warmstart::hot_reload_tests 2>&1 | tee probe.log
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          grep -E "^test .* (FAILED|ok|ignored)$|test result|panicked" probe.log | grep -vE " ok$" || true
