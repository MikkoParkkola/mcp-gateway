name: Unlocked install

# An install that ignores Cargo.lock (`cargo install mcp-gateway`) must still
# hash emails the way every other build does. The exact `=` pins in Cargo.toml
# hold the two normalizer crates; their own dependencies float. This installs
# the packaged crate with its dependencies resolved today and starts it with
# the key server, whose startup runs the email-hash self-check and refuses to
# start when a known answer moves.
#
# Not on pull requests: it is a full build, and drift arrives with upstream
# publishes, not with our changes. It runs on every release-line push and
# nightly, and release.yml calls it, so `verify` (and with it every publishing
# job) waits for it to pass at the tag itself.
on:
  push:
    branches: [docs/ranking-1-release-line]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

# Only the newest release-line push keeps its run, as in packaged-suite.yml;
# every other event (the nightly, a dispatch, a release's call) has a group of
# its own and is never cancelled. The literal prefix keeps a group built here
# from matching a caller's own.
concurrency:
  group: unlocked-install-${{ (github.event_name == 'push' && github.ref == 'refs/heads/docs/ranking-1-release-line') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/docs/ranking-1-release-line' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unlocked-install:
    name: Unlocked install keeps the email hash
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The checker first, against stub binaries: a checker that passes
      # everything would make this job green for nothing.
      - name: Check the checker refuses what it must
        run: python3 scripts/dev/test_check_unlocked_install.py
      - uses: ./.github/actions/add-swap
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
      # No build cache: the release calls this, and a restored cache is input
      # nobody reviewed at the tag.
      - name: Install the packaged crate unlocked and start it with the key server
        env:
          UNLOCKED_INSTALL_OUT: ${{ runner.temp }}/unlocked-install
        run: scripts/ci/packaged-tests.sh install-unlocked
      - name: Keep the build log, the shipped lock and the gateway log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unlocked-install
          path: |
            ${{ runner.temp }}/unlocked-install/shipped-Cargo.lock
            ${{ runner.temp }}/unlocked-install/resolved-Cargo.lock
            ${{ runner.temp }}/unlocked-install/install.txt
            ${{ runner.temp }}/unlocked-install/gateway.log
          if-no-files-found: warn
