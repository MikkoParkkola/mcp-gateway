name: First-paint host probe

# Throwaway evidence for moving the first-paint gate onto hosted runners, never
# merged. Five hosted copies, each on its own VM, each report the CPU model and
# the real page's first paint at the gate's mobile settings (4x CPU): 20 plain
# and 20 planted samples, taken one and one. Only a push to a
# throwaway/first-paint-probe-* branch starts it; no other workflow listens to
# that name. No third-party actions: plain git fetches the pushed commit and the
# runner's own Node runs the probe, its version printed with the result.
on:
  push:
    branches: ["throwaway/first-paint-probe-*"]

permissions:
  contents: read

jobs:
  probe:
    name: Host probe ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5]
    steps:
      - name: Fetch the pushed commit
        run: |
          git init -q probe
          git -C probe fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          git -C probe checkout -q FETCH_HEAD
          git -C probe log -1 --format='probe commit %H'
      - name: Node and the locked packages, install scripts off
        working-directory: probe/ui-tests
        run: |
          echo "probe node $(node --version), npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --ignore-scripts
      - name: Chromium and its system libraries
        working-directory: probe/ui-tests
        run: |
          npx playwright install chromium
          timeout 300 npx playwright install-deps chromium || echo "::warning::system libraries not installed; relying on the image"
      - name: Probe this host
        working-directory: probe/ui-tests
        run: node perf/probe-gate.mjs | tee -a "$GITHUB_STEP_SUMMARY"
