# Throwaway measurement, never merged: peak memory of the two library coverage parts.
name: Coverage probe

on:
  push:
    branches: ["throwaway/coverage-runmem"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_MIN_STACK: "8388608"
  COVERAGE_RUST: "1.99.1"
  COVERAGE_LLVM_COV: "0.9.1"
  COVERAGE_PARTS: "4"

jobs:
  linux-part:
    name: runmem part ${{ matrix.part }} swap=${{ matrix.swap }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [lib-a, lib-b, int-a, int-b]
        swap: ["8G", "none"]
        # The SDK journey's build peak (its tests need the pinned SDK and Redis, absent here).
        include:
          - part: sdk
            swap: "none"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.COVERAGE_RUST }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$COVERAGE_LLVM_COV"
      - name: Runner before the part
        run: |
          nproc; free -m; df -h / "$GITHUB_WORKSPACE"; swapon --show || true
      # The candidate fix: 8 GB more swap. It fails loudly: total swap must reach 10 GB,
      # so a swapon that silently does nothing cannot pass for a fix.
      - name: Add swap
        if: matrix.swap != 'none'
        run: |
          set -euo pipefail
          sudo fallocate -l "${{ matrix.swap }}" /swapfile-cov
          sudo chmod 600 /swapfile-cov
          sudo mkswap /swapfile-cov
          sudo swapon /swapfile-cov
          swapon --show
          free -m
          total_mb="$(free -m | awk '/Swap:/{print $2}')"
          [ "$total_mb" -ge 10240 ] || { echo "::error::total swap ${total_mb} MB is under 10 GB"; exit 1; }
      - name: Run the part, measured
        env:
          PART: ${{ matrix.part }}
        run: |
          set -o pipefail
          cargo llvm-cov clean --workspace
          # Streamed into this log every 5 s, so the numbers survive a lost runner:
          # used and available MB, free disk MB on /, and the largest process by RSS.
          ( while sleep 5; do
              echo "MEMSAMPLE $(date +%T) used_mb=$(free -m | awk '/Mem:/{print $3}') avail_mb=$(free -m | awk '/Mem:/{print $7}') swap_used_mb=$(free -m | awk '/Swap:/{print $3}') disk_free_mb=$(df -m / | awk 'NR==2{print $4}') top=$(ps -eo rss=,comm= --sort=-rss | head -1 | tr -s ' ' ':')"
            done ) &
          /usr/bin/time -v python3 scripts/ci/coverage_shards.py run "$COVERAGE_PARTS" "$PART" 2>&1 | tee run.log
      - name: Runner after the part
        if: always()
        run: |
          free -m; df -h /; sudo dmesg 2>/dev/null | grep -iE "oom|killed process" | tail -5 || true
