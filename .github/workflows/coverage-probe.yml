# Throwaway measurement, never merged: G2, the add-swap action fails loudly.
name: Coverage probe

on:
  push:
    branches: ["throwaway/coverage-runmem"]

permissions:
  contents: read

jobs:
  g2:
    name: G2 ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [real-swapon, noop-swapon, noop-swapon-threshold-0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swap starts under the 10 GB threshold
        run: |
          free -m
          total="$(free -m | awk '/^Swap:/{print $2}')"
          [ "$total" -lt 10240 ] || { echo "::error::runner already has ${total} MB swap"; exit 1; }
      - name: Replace swapon with a no-op that claims success
        if: matrix.case != 'real-swapon'
        run: |
          real="$(command -v swapon)"
          printf '#!/bin/sh\nexit 0\n' | sudo tee "$real" >/dev/null
          echo "replaced $real"
      - name: The action
        id: action
        continue-on-error: true
        uses: ./.github/actions/add-swap
        if: matrix.case != 'noop-swapon-threshold-0'
      - name: The action with threshold 0
        id: action_t0
        continue-on-error: true
        uses: ./.github/actions/add-swap-t0
        if: matrix.case == 'noop-swapon-threshold-0'
      - name: Expected outcome
        env:
          OUTCOME: ${{ steps.action.outcome == 'skipped' && steps.action_t0.outcome || steps.action.outcome }}
          CASE: ${{ matrix.case }}
        run: |
          echo "case=$CASE outcome=$OUTCOME"
          case "$CASE" in
            real-swapon) want=success ;;
            noop-swapon) want=failure ;;
            noop-swapon-threshold-0) want=success ;;
          esac
          [ "$OUTCOME" = "$want" ] || { echo "::error::case $CASE: want $want, got $OUTCOME"; exit 1; }
          echo "G2 $CASE: $OUTCOME as expected"
