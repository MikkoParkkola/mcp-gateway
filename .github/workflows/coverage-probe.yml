# The C5 / MIK-7324.COV.3 grade run (MIK-8217). It grades every push to the release line on
# Linux and Windows, and pull requests that touch a COV.3 path, an inventory or a grader on
# Linux only. scripts/release/coverage_grade.sh also pushes it onto a throwaway/coverage-*
# branch with any revision under grade. The contract is docs/release/v4.0.0-critical-path-coverage.md
# ("The command", "In CI", "What closing C5 requires"): no --ignore-run-fail, the pinned task SDK.
name: Coverage probe

on:
  push:
    branches: ["throwaway/coverage-*", docs/ranking-1-release-line]
  pull_request:
    branches: [docs/ranking-1-release-line]
    # The COV.3 prefixes of scripts/release/check_inventory_rows.py (PREFIXES), plus what
    # the grade reads. test_check_inventory_rows.py keeps the two lists in step.
    paths:
      - "src/gateway/server/**"
      - "src/oauth/**"
      - "src/transport/http/**"
      - "src/gateway/router/**"
      - "src/transport/stdio.rs"
      - "src/transport/stdio_start.rs"
      - "src/transport/stdio_env.rs"
      - "src/transport/command_split.rs"
      - "src/gateway/input_bridge.rs"
      - "src/gateway/input_bridge/**"
      - "src/gateway/task_service/**"
      - "src/gateway/meta_mcp/task_confirmation.rs"
      - "src/gateway/meta_mcp/task_confirmation/**"
      - "src/personal_accounts/**"
      - "src/config/account_bindings.rs"
      - "src/identity_propagation/**"
      - "src/gateway/outbound/**"
      - "docs/release/v4.0.0-critical-functions.tsv"
      - "docs/release/v4.0.0-unenforcing-functions.tsv"
      - "docs/release/inventory.d/**"
      - "scripts/release/inventory_ledger.py"
      - "scripts/release/critical_function_coverage.py"
      - "scripts/release/critical_path_coverage.py"
      - "scripts/ci/coverage_shards.py"
      - "scripts/ci/coverage_shard_*.sh"
      - "scripts/ci/testdata/llvm_cov_report_v.txt"
      - "src/coverage_canary.rs"
      - ".github/workflows/coverage-probe.yml"
  workflow_dispatch:

# A newer push to a pull request supersedes its older grade. Every other run has a group of
# its own: a group keeps one pending run and replaces it with the next, so a shared
# release-line group would drop grades when merges queue.
concurrency:
  group: coverage-probe-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Instrumented frames overflow the 2 MiB default test-thread stack.
  RUST_MIN_STACK: "8388608"
  # One compiler and one cargo-llvm-cov for every Linux job: the merge refuses a part whose
  # manifest records another rustc release or commit.
  COVERAGE_RUST: "1.100.0"
  COVERAGE_LLVM_COV: "0.9.1"
  # The Linux run's parts (scripts/ci/coverage_shards.py PLANS).
  COVERAGE_PARTS: "4"

jobs:
  # The Linux run is split across runners: the SDK journey alone, then the other test
  # targets in COVERAGE_PARTS parts that are exact complements of the single command
  # (`--all-features --tests`, the SDK test skipped). linux-grade merges their profiles and
  # executables into one report and keeps the name the grade and coverage_grade.sh read.
  linux-plan:
    name: llvm-cov Linux, plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.COVERAGE_RUST }}
      - id: plan
        run: |
          set -euo pipefail
          python3 scripts/ci/coverage_shards.py --self-test
          cargo metadata --no-deps --format-version 1 > metadata.json
          # Fails when a target `--tests` builds falls in no part or in two.
          python3 scripts/ci/coverage_shards.py check "$COVERAGE_PARTS" metadata.json
          echo "parts=$(python3 scripts/ci/coverage_shards.py plan "$COVERAGE_PARTS")" >> "$GITHUB_OUTPUT"

  linux-sdk:
    name: llvm-cov Linux, SDK journey
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.COVERAGE_RUST }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$COVERAGE_LLVM_COV"
      - name: Pinned task SDK and Redis
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/python" -m pip install --disable-pip-version-check \
            'fastmcp==4.0.3' 'fastmcp-tasks==4.0.3' 'pydocket==0.25.0'
          echo "MCP_GATEWAY_TASK_SDK_PYTHON=$RUNNER_TEMP/sdk/bin/python" >> "$GITHUB_ENV"
          c="$(docker run --detach --rm --publish 127.0.0.1::6379 \
            mirror.gcr.io/library/redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf \
            redis-server --save '' --appendonly no)"
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "6379/tcp") 0).HostPort}}' "$c")"
          echo "MCP_GATEWAY_TASK_SDK_REDIS_URL=redis://127.0.0.1:$port/0" >> "$GITHUB_ENV"
      - name: SDK journey alone, single-threaded
        run: |
          set -o pipefail
          cargo llvm-cov clean --workspace
          python3 scripts/ci/coverage_shards.py run "$COVERAGE_PARTS" sdk 2>&1 | tee run.log
      - name: Bundle
        run: bash scripts/ci/coverage_shard_bundle.sh sdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-shard-sdk
          retention-days: 7
          compression-level: 1
          path: bundle/

  linux-part:
    name: llvm-cov Linux, part ${{ matrix.part }}
    needs: linux-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.linux-plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The library parts only: the integration parts peak at 6.5 GB.
      - if: startsWith(matrix.part, 'lib-')
        uses: ./.github/actions/add-swap
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.COVERAGE_RUST }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$COVERAGE_LLVM_COV"
      - name: Run the part
        env:
          PART: ${{ matrix.part }}
        run: |
          set -o pipefail
          cargo llvm-cov clean --workspace
          python3 scripts/ci/coverage_shards.py run "$COVERAGE_PARTS" "$PART" 2>&1 | tee run.log
      - name: Bundle
        env:
          PART: ${{ matrix.part }}
        run: bash scripts/ci/coverage_shard_bundle.sh "$PART"
      # A failed part never reaches the merge: keep its log on its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cov-failed-${{ matrix.part }}
          retention-days: 7
          path: run.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cov-shard-${{ matrix.part }}
          retention-days: 7
          compression-level: 1
          path: bundle/

  linux-grade:
    name: llvm-cov Linux, grade
    needs: [linux-plan, linux-sdk, linux-part]
    # Runs whatever the parts did, and fails unless every one succeeded: a skipped or
    # cancelled part would otherwise leave this check unreported, not red.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Every part succeeded
        env:
          PLAN: ${{ needs.linux-plan.result }}
          SDK: ${{ needs.linux-sdk.result }}
          PARTS: ${{ needs.linux-part.result }}
        run: |
          echo "plan=$PLAN sdk=$SDK parts=$PARTS"
          [ "$PLAN" = success ] && [ "$SDK" = success ] && [ "$PARTS" = success ] \
            || { echo "::error::a Linux coverage part did not succeed"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.COVERAGE_RUST }}
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$COVERAGE_LLVM_COV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cov-shard-*
          path: shards/
      - name: Unpack every part
        env:
          PARTS_JSON: ${{ needs.linux-plan.outputs.parts }}
        run: |
          set -euo pipefail
          read -ra expected <<< "sdk $(echo "$PARTS_JSON" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')"
          # Fails on a missing bundle, another rustc, or an executable missing or changed.
          bash scripts/ci/coverage_shard_merge.sh "${expected[@]}"
          cp shards/cov-shard-sdk/run.log sdk-run.log
          for p in "${expected[@]}"; do [ "$p" = sdk ] || cat "shards/cov-shard-$p/run.log"; done > all-run.log
      - name: Reports
        run: |
          set -o pipefail
          # -v prints each llvm-cov command with every -object it reads.
          cargo llvm-cov report -v --summary-only --json --output-path cov.json 2>&1 | tee report-json.log
          cargo llvm-cov report -v --lcov --output-path linux.lcov 2>&1 | tee report-lcov.log
          # Each report read every executable a part built with coverage sections.
          for log in report-json.log report-lcov.log; do
            python3 scripts/ci/coverage_shards.py objects "$log" shards/cov-shard-*/manifest.txt
          done
          # A never-called function must show at zero: a merge that lost binaries would drop it.
          python3 scripts/ci/coverage_shards.py canary linux.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 90
          name: coverage-linux
          path: |
            cov.json
            linux.lcov
            all-run.log
            sdk-run.log
            report-json.log
            report-lcov.log
            shards/*/tests.tsv
            shards/*/manifest.txt

  windows-grade:
    name: llvm-cov Windows, grade
    runs-on: windows-2025
    # Pull requests grade Linux only (runner budget); every release-line push grades
    # Windows too, so a Windows-only shortfall is caught at most one merge later.
    if: github.event_name != 'pull_request'
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Allow symlink creation
        shell: pwsh
        run: >-
          New-ItemProperty -Force -PropertyType DWORD -Value 1 -Name AllowDevelopmentWithoutDevLicense
          -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock
      # A failed test on Windows drops that process's profile (MIK-7780), so this step
      # must end with no failure; there is no --ignore-run-fail.
      - name: Every test target
        shell: pwsh
        run: |
          cargo llvm-cov --all-features --tests --lcov --output-path windows.lcov 2>&1 | Tee-Object windows-run.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 90
          name: coverage-windows
          path: |
            windows.lcov
            windows-run.log

  grade:
    name: Critical coverage grade
    needs: [linux-grade, windows-grade]
    # Runs whatever the platform jobs did, so it is never skipped: a skipped job would
    # read as passing if this check were ever made required.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Both platform runs must have passed every test; on a pull request the Windows run
      # is skipped by design and the grade covers Linux alone.
      - name: Every platform run passed
        env:
          EVENT: ${{ github.event_name }}
          LINUX: ${{ needs.linux-grade.result }}
          WINDOWS: ${{ needs.windows-grade.result }}
        run: |
          echo "linux=$LINUX windows=$WINDOWS event=$EVENT"
          [ "$LINUX" = success ] || { echo "::error::the Linux coverage run did not succeed ($LINUX)"; exit 1; }
          [ "$WINDOWS" = success ] || { [ "$EVENT" = pull_request ] && [ "$WINDOWS" = skipped ]; } \
            || { echo "::error::the Windows coverage run did not succeed ($WINDOWS)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # By name, each into its own directory: downloading "all" puts a single artifact
      # (a pull request has only the Linux one) straight into the target directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-linux
          path: art/coverage-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'pull_request'
        with:
          name: coverage-windows
          path: art/coverage-windows
      - name: Grade the Critical rows and the paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- --scope linux-only --lcov art/coverage-linux/linux.lcov
          else
            set -- --lcov art/coverage-linux/linux.lcov --lcov art/coverage-windows/windows.lcov
          fi
          status=0 functions=0 paths=0
          # stderr too, so a grader that cannot run shows why in the summary.
          python3 scripts/release/critical_function_coverage.py "$@" > functions.txt 2>&1 || functions=$?
          python3 scripts/release/critical_path_coverage.py art/coverage-linux/cov.json > paths.txt 2>&1 || paths=$?
          [ "$functions" = 0 ] && [ "$paths" = 0 ] || status=1
          # A grader's 3 is a missing report: no grade, never a graded FAIL (MIK-8265).
          verdict=$([ $status = 0 ] && echo PASS || echo FAIL)
          if [ "$functions" = 3 ] || [ "$paths" = 3 ]; then verdict="NOT GRADED (a coverage report is missing)"; fi
          {
            echo "## Critical coverage grade ($EVENT): $verdict"
            echo '```'
            grep -v '^ok' functions.txt || true
            cat paths.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 90
          name: coverage-grade
          path: |
            functions.txt
            paths.txt
