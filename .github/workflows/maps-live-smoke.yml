#
# Opt-in live smoke for the key-free map tools, and the only place provider
# answers are recorded as fixtures. Never on push, PR open or synchronize: it
# runs when someone dispatches it or labels a PR live-smoke.
#
# Budget per run, both jobs: Open-Meteo geocoding 4, Open-Meteo forecast 3,
# Nominatim 4, Photon 2, Overpass 2, OSRM 2 (about 17 requests).
name: maps-live-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: maps-live-smoke
  cancel-in-progress: false

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: "mcp-gateway/4.0 (+https://github.com/MikkoParkkola/mcp-gateway)"
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Record raw provider answers (8 requests, paced)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out
          echo "head ${HEAD_SHA} run ${RUN_ID}" > out/MANIFEST
          failed=0
          # name | gap before it, seconds | URL. Each URL is the exact request
          # its fixture row asserts. A transport failure is recorded, not
          # fatal, so every answer that did arrive is still uploaded.
          while IFS='|' read -r name gap url; do
            sleep "$gap"
            when=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
            if ! meta=$(curl -sS -A "$UA" -o "out/${name}.json" -w '%{http_code} %{content_type}' "$url"); then
              meta="curl-failed -"
              failed=1
            fi
            printf '%s %s %s %s\n' "$name" "$when" "$meta" "$url" >> out/MANIFEST
          done <<'REQUESTS'
          geocode|0|https://geocoding-api.open-meteo.com/v1/search?name=Helsinki&count=5
          geocode_none|0.25|https://geocoding-api.open-meteo.com/v1/search?name=Qxzvqzzyx&count=5
          weather|0.25|https://api.open-meteo.com/v1/forecast?latitude=60.1699&longitude=24.9384&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,sunrise,sunset&timezone=auto
          nominatim_search|1.1|https://nominatim.openstreetmap.org/search?q=Helsinki+Cathedral&format=jsonv2&limit=5
          nominatim_reverse|1.1|https://nominatim.openstreetmap.org/reverse?lat=60.1699&lon=24.9384&format=jsonv2&zoom=18
          photon_search|1.1|https://photon.komoot.io/api/?q=Helsinki+Cathedral&limit=5
          overpass_nearby|1.1|https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3Bnwr%28around%3A500%2C60.1699%2C24.9384%29%5Bamenity%3Dcafe%5D%3Bout%20center%2020%3B
          osrm_route|1.1|https://router.project-osrm.org/route/v1/driving/24.9384,60.1699;22.2666,60.4518?overview=false
          REQUESTS
          cat out/MANIFEST
          exit "$failed"

      - name: Upload the raw answers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-live-${{ github.run_id }}
          path: out/
          retention-days: 14

  gateway:
    needs: record
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The library test binary is one ~15 GB rustc: swap first (scripts/ci/check_swap_jobs.py).
      - uses: ./.github/actions/add-swap
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only the release line saves: a PR's own cache helps no other PR and evicts the line's.
          save-if: ${{ github.ref == 'refs/heads/docs/ranking-1-release-line' }}
      - name: Build the lib tests (part 1, which holds the live rows)
        # One part of the lib test binary, as ci.yml's lib-build legs build it (about 11 min there; the same limit).
        timeout-minutes: 25
        run: scripts/ci/with-memory-log.sh scripts/ci/lib-parts.sh export 1 "$RUNNER_TEMP/lib-bin"
      - name: Live gateway rows, one exact test per run, paced per host
        shell: bash
        run: |
          # The runner starts bash with -e: off, so one failing row cannot end
          # the step before its output is shown and the remaining rows run.
          set +e -uo pipefail
          # test name | seconds to wait before it (the previous call's host
          # interval plus a margin, so the gateway's own pacer never refuses).
          passed=0
          total=0
          while IFS='|' read -r name gap; do
            total=$((total + 1))
            sleep "$gap"
            # stdin from /dev/null: the loop reads its rows from stdin, so a test
            # that read stdin would swallow the rows after it.
            "$RUNNER_TEMP/lib-bin/p1/lib-tests-p1" "capability::maps_live_tests::${name}" --ignored --exact < /dev/null > row.log 2>&1
            rc=$?
            tail -30 row.log
            # Both: the process exited 0 and its summary reports the one test passed.
            if [ "$rc" -eq 0 ] && grep -q '^test result: ok. 1 passed' row.log; then
              passed=$((passed + 1))
            else
              echo "FAILED: ${name}"
            fi
          done <<'ROWS'
          maps_live_geocode|2.1
          maps_live_weather|0.35
          maps_live_geocode_then_weather|0.35
          maps_live_nominatim_search|1.1
          maps_live_nominatim_reverse|1.1
          maps_live_photon|1.1
          maps_live_overpass|1.1
          maps_live_osrm|1.1
          ROWS
          # The threshold is the row list's own length, and the list may not be empty.
          echo "live rows passed: ${passed} of ${total}"
          test "$total" -gt 0 && test "$passed" -eq "$total"
      # As ci.yml's part builds end: a part writes nothing to swap; past 2 GiB a whole build came back.
      - name: Memory tripwire
        if: always()
        run: scripts/ci/memory-tripwire.sh 2048 "$RUNNER_TEMP/memory-trend.txt"
