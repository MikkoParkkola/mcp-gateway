#
# Opt-in live smoke for the key-free map tools, and the only place provider
# answers are recorded as fixtures. Never on push, PR open or synchronize: it
# runs when someone dispatches it or labels a PR live-smoke.
name: maps-live-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: maps-live-smoke
  cancel-in-progress: false

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: "mcp-gateway/4.0 (+https://github.com/MikkoParkkola/mcp-gateway)"
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Record the Overpass answer (1 request; the first run got 502 at capacity)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          echo "head ${HEAD_SHA} run ${RUN_ID}" > out/MANIFEST
          # name | gap before it, seconds | URL. Each URL is the exact request
          # its fixture row asserts.
          while IFS='|' read -r name gap url; do
            sleep "$gap"
            when=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
            meta=$(curl -sS -A "$UA" -o "out/${name}.json" -w '%{http_code} %{content_type}' "$url")
            printf '%s %s %s %s\n' "$name" "$when" "$meta" "$url" >> out/MANIFEST
          done <<'REQUESTS'
          overpass_nearby|0|https://overpass-api.de/api/interpreter?data=%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3Bnwr%28around%3A500%2C60.1699%2C24.9384%29%5Bamenity%3Dcafe%5D%3Bout%20center%2020%3B
          REQUESTS
          cat out/MANIFEST

      - name: Upload the raw answers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-live-${{ github.run_id }}
          path: out/
          retention-days: 14
