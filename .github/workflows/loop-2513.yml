# Throwaway: run task_crash_boundaries and signature_chain_hops 20 times in one job (#2513).
# Lives only on throwaway/loop-* branches; never merged.
name: Harness port loop

on:
  push:
    branches: ["throwaway/loop-*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  loop:
    name: port-0 harness x20
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Build the test targets once
        run: cargo test --test task_crash_boundaries --test signature_chain_hops --no-run
      - name: Run each 20 times
        shell: bash
        run: |
          set -u
          failed=0
          for target in task_crash_boundaries signature_chain_hops; do
            pass=0
            for i in $(seq 1 20); do
              log="$target-$i.log"
              cargo test --test "$target" > "$log" 2>&1
              code=$?
              # A pass needs exit 0 AND a harness summary: ok, >0 passed, 0 failed.
              if [ "$code" -eq 0 ] && grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed' "$log"; then
                pass=$((pass + 1))
                echo "$target run $i: PASS ($(grep -Eo '[0-9]+ passed' "$log" | tail -1))"
              else
                echo "$target run $i: FAIL (exit $code)"
                grep -E '^test |panicked at|^test result' "$log" || tail -40 "$log"
              fi
            done
            echo "$target passed $pass of 20"
            [ "$pass" -eq 20 ] || failed=1
          done
          exit "$failed"
