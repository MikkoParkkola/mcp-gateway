name: probe-8254
# Throwaway probe for MIK-8254 (never merged): the MIK-8242 shape, whole bin
# test binary 20 times on macOS, at the fix head. Baseline: 3/20 (run 37981500803).
on:
  push:
    branches: ["throwaway/probe-8254"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build the bin test binary
        run: cargo test --all-features --bin mcp-gateway --no-run
      - name: Whole bin test binary (20)
        shell: bash
        run: |
          set -uo pipefail
          fails=0
          for i in $(seq 1 20); do
            if ! cargo test -q --all-features --bin mcp-gateway > /tmp/bin.$i.log 2>&1; then
              fails=$((fails+1)); echo "run $i FAILED"; awk '/ FAILED$|panicked/' /tmp/bin.$i.log | head -5 || true
            fi
          done
          echo "whole binary: $fails/20 failed"
          test "$fails" -eq 0
