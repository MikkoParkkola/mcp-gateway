name: Registry packages

# MIK-7787: `mcp-gateway add <name>` writes what src/registry/server_registry.rs
# says, and 30 of its 45 npm packages had become 404 with nothing failing.
# This workflow looks every entry up live (npm, PyPI, or an HTTP probe of the
# hosted URL). On a pull request it runs only where the answer can change
# because of this repo (a pull request touching the registry or the check), so
# a third-party deprecation never turns an unrelated pull request red. It also
# runs after every merge to a listed branch, whatever the merge touched: drift
# upstream then shows up on the next merge, on a branch that gates nothing,
# instead of on gate day (MIK-8510). GitHub fires `schedule` only from the
# default branch's copy of this file, so the daily run below stays inert until
# the release line is merged into `main`; the push run is what catches drift
# before then. No workflow holds Linear credentials, so a failure is reported
# by this run failing, not by filing an issue.
# The offline half (pin and launcher rules, no network) runs on every pull
# request in ci.yml, job registry-packages.

on:
  pull_request:
    paths:
      - "src/registry/**"
      - "scripts/dev/check-registry-packages.py"
      - "scripts/dev/test_check_registry_packages.py"
      - "scripts/dev/test_check_registry_content.py"
      - "scripts/dev/registry-integrity.json"
      - "scripts/dev/testdata/**"
      - ".github/workflows/registry-packages.yml"
  push:
    branches: [main, docs/ranking-1-release-line]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Every registry entry resolves (live)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A lookup that cannot fail checks nothing: these entries are known dead
      # (404 package, deprecated version, missing release, 404 URL, an open
      # header endpoint, OAuth without registration) and must be refused, live,
      # before the real list is trusted.
      - name: Check the live lookup refuses known-dead entries
        run: |
          set +e
          out="$(python3 scripts/dev/check-registry-packages.py scripts/dev/testdata/registry-dead.rs --integrity scripts/dev/testdata/registry-dead.integrity.json)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          # Each must be refused for its own reason, not one outage.
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          grep -qx '0/6 registry entries resolve' <<<"$out"
          grep -q '^FAIL missing-npm: .*HTTP 404' <<<"$out"
          grep -q '^FAIL deprecated-npm: .*is deprecated' <<<"$out"
          grep -q '^FAIL missing-pypi: .*HTTP 404' <<<"$out"
          grep -q '^FAIL missing-url: .*HTTP 404' <<<"$out"
          grep -q '^FAIL open-header: .*without a credential' <<<"$out"
          grep -q '^FAIL oauth-without-dcr: .*no dynamic client registration' <<<"$out"
      # MIK-8513 CONTENT.1: a recorded digest that differs from the one served
      # must be the only failure, for that reason.
      - name: Check a wrong recorded digest is refused
        run: |
          set +e
          out="$(python3 scripts/dev/check-registry-packages.py scripts/dev/testdata/registry-integrity.rs --integrity scripts/dev/testdata/registry-integrity.integrity.json)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          grep -qx '1/2 registry entries resolve' <<<"$out"
          [ "$(grep -c '^FAIL' <<<"$out")" -eq 1 ] || { echo "expected exactly one FAIL"; exit 1; }
          grep -q '^FAIL wrong-digest-memory: .*integrity' <<<"$out"
      - name: Check every registry entry resolves
        run: python3 scripts/dev/check-registry-packages.py

  # MIK-8513 CONTENT.1 bytes and CONTENT.2: the package manager fetches every
  # pinned artifact and checks its real bytes, and every eligible stdio entry
  # must answer initialize. All package code runs in containers that get no
  # runner environment and no host path (see the checker's `--start` section).
  starts:
    name: Every pinned artifact verifies and every eligible entry starts (live)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check served bytes that differ from the record are refused
        run: |
          set +e
          out="$(python3 scripts/dev/check-registry-packages.py --start scripts/dev/testdata/registry-integrity.rs --integrity scripts/dev/testdata/registry-integrity.integrity.json)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          [ "$(grep -c '^FAIL wrong-digest-memory: served bytes' <<<"$out")" -eq 1 ] || { echo "expected one served-bytes FAIL"; exit 1; }
          ! grep -q '^FAIL right-digest-time' <<<"$out"
      - name: Check a package that is not an MCP server fails to start
        run: |
          set +e
          out="$(python3 scripts/dev/check-registry-packages.py --start scripts/dev/testdata/registry-wont-start.rs --integrity scripts/dev/testdata/registry-wont-start.integrity.json)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          grep -qx 'PASS starts-time' <<<"$out"
          grep -q '^FAIL not-mcp-semver: exited .* before answering initialize' <<<"$out"
          grep -qx '1/2 eligible entries start' <<<"$out"
      - name: Check every pinned artifact verifies and every eligible entry starts
        run: |
          set +e
          out="$(python3 scripts/dev/check-registry-packages.py --start)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || { echo "expected exit 0, got $rc"; exit 1; }
          # A parser miss that made every entry ineligible must not pass.
          for name in memory sequential-thinking fetch time; do
            grep -qx "PASS $name" <<<"$out" || { echo "missing PASS $name"; exit 1; }
          done
          grep -qx '4/4 eligible entries start' <<<"$out"
