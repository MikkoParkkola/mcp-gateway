name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v2.0.1)'
        required: true

# Least-privilege default for all jobs (CodeQL actions/missing-workflow-permissions).
# Jobs needing more (release, publish, npm-publish) override locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The one commit this release is built, tested and published from is
  # GITHUB_SHA: the commit the event names (an annotated tag peeled), which a
  # re-run keeps. Every checkout of this repository and both called workflows
  # use it by default (checkout's default for the triggering repository is the
  # event's commit), so none names a ref: a tag name, looked up again later,
  # could have moved. A dispatch must run at the tag it names
  # (`--ref <tag> -f tag=<tag>`); from any other ref it is refused here, and
  # every job waits for this, so the `tag` input can never name a commit other
  # than the one checked out.
  resolve:
    name: Refuse a dispatch away from the tag
    runs-on: ubuntu-latest
    steps:
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::dispatched from '$GITHUB_REF', not the tag '$TAG': run with --ref $TAG -f tag=$TAG"
            exit 1
          fi
          echo "release commit: $GITHUB_SHA"

  # Release backstop for the dependency-vulnerability gate. ci.yml runs
  # `cargo audit` on every PR/push (RustSec advisories); this re-scans the
  # Cargo.lock against OSV at tag time so a known fixable vuln cannot ship via
  # the release/publish path, which `cargo audit` does not currently gate. Every
  # publishing job below names `verify` in its own `needs:`, and `verify`
  # `needs:` this gate — so the GitHub release, crates.io publish, npm publish,
  # and Homebrew formula bump all block if a known fixable vuln is present.
  # Exceptions are time-boxed in .github/osv-scanner.toml.
  security-gate:
    name: Security gate (block release on known vulns)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Rust dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=.github/osv-scanner.toml
            --recursive
            ./

  # Second release backstop, alongside security-gate: the semantic CWE-532
  # leak lint (ci.yml's secret-leak-lint job re-implemented as a dependency
  # here rather than a cross-workflow needs:, since GitHub Actions has no
  # native "wait for a different workflow on the same ref" primitive short
  # of workflow_run, which would desync from this workflow's own tag
  # trigger). Same script, same baseline file — see scripts/dev/
  # cwe532-leak-lint.py and scripts/dev/cwe532-baseline.txt.
  #
  # NOTE (manual release-checklist item, not automated here): before tagging
  # a release, also check for open P0/P1 security tickets in the tracker —
  # this gate only catches what static analysis can see, not triaged/known
  # issues awaiting a fix.
  #
  # NOTE: this repo has no CodeQL workflow as of this gate's introduction
  # (verified: no `.github/workflows/*codeql*` and no
  # `github/codeql-action/analyze` step anywhere in .github/workflows/).
  # If CodeQL is added later, wire it into this same needs: chain.
  secret-leak-lint:
    name: Secret-leak lint (CWE-532)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the leak-lint parser (fail on parser regression)
        run: python3 scripts/dev/test_cwe532_leak_lint.py
      - name: Run CWE-532 leak lint
        run: python3 scripts/dev/cwe532-leak-lint.py src crates

  # Third release backstop, alongside security-gate and secret-leak-lint: the
  # release-criteria ledger's header counts must match its rows. The ledger
  # (docs/requirements/RELEASE-4.0.0-criteria-status.md) is what "is this
  # release ready" is read from, and its summary line has drifted from its own
  # table before — a transcribed count survives edits that a derived one would
  # not. ci.yml runs the same script report-only on every PR, because the
  # ledger is edited mid-flight; here it blocks, because a tag is the point
  # after which a wrong count is a published claim. `verify` needs: this gate,
  # and every publishing job names `verify` in its own needs:.
  release-criteria:
    name: Release criteria ledger (header matches rows)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The cited-commit gate below walks ancestry and reads commit bodies,
          # so it needs real history. A shallow checkout would report every
          # citation as unreachable.
          fetch-depth: 0
      - name: Test the counter (fail on parser regression)
        run: python3 scripts/release/test_count_release_criteria.py
      - name: Check the release-criteria ledger header against its rows
        run: python3 scripts/release/count-release-criteria.py --check
      - name: Check every cited commit is on the release line
        # A criterion graded on a commit that reached no release branch was
        # graded on evidence nobody can check. 35 citations were unreachable
        # once; 34 were benign re-squashes and the 35th hid a live defect --
        # the ratio is exactly what lets the real one through a spot check.
        # The script accounts for squash-merges itself, so a CARRIED citation
        # passes and only a genuinely unaccounted one fails.
        #
        # The comparison ref is HEAD, the tag being released, not main: a
        # maintenance tag cut from a release branch carries evidence main does
        # not, and checking main would reject it. HEAD also needs no remote,
        # so the gate makes no network call of its own.
        run: bash scripts/release/check-cited-commits.sh HEAD
      - name: Test supplemental acceptance checks
        run: python3 scripts/release/test_scope_acceptance.py
      - name: Install PyYAML 6.0.2 (the cosign floor parses workflows)
        run: python3 -c 'import sys, yaml; sys.exit(yaml.__version__ != "6.0.2")' 2>/dev/null || python3 -m pip install --user --quiet 'pyyaml==6.0.2'
      - name: Test the tag/manifest publish gate
        run: python3 scripts/release/test_check_tag_manifest.py
      - name: Validate supplemental scope (pending work is reported)
        run: python3 scripts/release/check_scope_acceptance.py --check
      - name: Require completed acceptance in publishing context
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release/check_scope_acceptance.py --publish-check

  task-sdk-recovery:
    needs: resolve
    uses: ./.github/workflows/task-sdk-recovery.yml

  # MIK-7479's full burst is skipped by every per-PR test job, so the release
  # is where it must have passed on this revision.
  mrtr7b-full-burst:
    needs: resolve
    uses: ./.github/workflows/mrtr7b-full-burst.yml

  # The tests run from the packaged crate, as anyone installing it would. A
  # file the tests read that `include` leaves out passes the checkout-based
  # tests in `verify` and fails only here, so `release` waits on this, and
  # every publishing job waits on `release`: a crates.io or npm version
  # cannot be replaced once published.
  packaged-suite:
    needs: resolve
    uses: ./.github/workflows/packaged-suite.yml

  verify:
    needs: [security-gate, secret-leak-lint, release-criteria, task-sdk-recovery, mrtr7b-full-burst]
    runs-on: ubuntu-latest
    # Every publishing job reads these to decide stable vs prerelease channel.
    # `needs` exposes only direct dependencies, so each consumer names `verify`
    # directly; reaching it transitively would read these as empty strings and
    # publish a release candidate as final.
    outputs:
      tag: ${{ steps.channel.outputs.tag }}
      version: ${{ steps.channel.outputs.version }}
      is_prerelease: ${{ steps.channel.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag against manifest and classify the channel
        id: channel
        # First, so a tag/manifest mismatch stops the run before anything is
        # built, let alone published. On workflow_dispatch GITHUB_REF_NAME is
        # the dispatch branch, so the input has to be passed explicitly.
        #
        # The input reaches the shell as an environment value, never as
        # interpolated script text: `${{ inputs.tag }}` expanded inside `run:`
        # is substituted before bash parses the line, so a dispatch tag
        # containing shell metacharacters would execute as code on the runner
        # that holds the publishing credentials.
        # https://docs.github.com/en/actions/concepts/security/script-injections
        #
        # On a tag push `inputs.tag` renders empty and the gate falls back to
        # $GITHUB_REF_NAME, which is the tag. That fallback is keyed on
        # emptiness rather than on the argument being absent, so passing `""`
        # here is the normal release path, not a degenerate one.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release/check_tag_manifest.py --tag "$INPUT_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      # No build cache: a restored cache is input nobody reviewed at the tag.

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-features -- -D warnings

      # The skip names the job that runs the test in full, and its ticket:
      #   a_real_sdk_job_outlives_...: job `task-sdk-recovery`, MIK-7534.
      - name: Test
        run: cargo test --all-features -- --skip a_real_sdk_job_outlives_the_gateway_and_its_owner_reads_the_result

      - name: Verify publish package
        # The runner image replaces the crates-io source with a mirror, and
        # cargo refuses to publish against a replaced source unless the target
        # registry is named explicitly. The replacement is not carried in
        # CARGO_HOME, so overriding that does not clear it.
        # https://doc.rust-lang.org/cargo/reference/source-replacement.html
        run: cargo publish --locked --dry-run --registry crates-io

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: mcp-gateway-linux-x86_64
            suffix: ""
            packages: musl-tools
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: mcp-gateway-linux-aarch64
            suffix: ""
            packages: musl-tools
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mcp-gateway-darwin-arm64
            suffix: ""
            packages: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mcp-gateway-darwin-x86_64
            suffix: ""
            packages: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: mcp-gateway-windows-x86_64
            suffix: .exe
            packages: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      # cargo auditable embeds the exact crate list of each binary in the
      # binary itself; the release job turns it into that binary's SBOM.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.6

      - name: Build
        run: cargo auditable build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/mcp-gateway${{ matrix.suffix }} ${{ matrix.artifact }}${{ matrix.suffix }}
          # The debug-only commit pause (#2298) must be compiled out of a release binary.
          if grep -qa MCP_GATEWAY_TEST_PAUSE_AT_PUBLISHED ${{ matrix.artifact }}${{ matrix.suffix }}; then echo "::error::release binary carries the debug commit pause"; exit 1; fi
          if grep -qa MCP_GATEWAY_TEST_HOLD_CAPABILITY_SCAN ${{ matrix.artifact }}${{ matrix.suffix }}; then echo "::error::release binary carries the debug scan hold"; exit 1; fi
          if grep -qa MCP_GATEWAY_TEST_ERA_PROBE_CAP_MS ${{ matrix.artifact }}${{ matrix.suffix }}; then echo "::error::release binary carries the debug era probe cap"; exit 1; fi
          if grep -qa MCP_GATEWAY_TEST_HOME_DIR ${{ matrix.artifact }}${{ matrix.suffix }}; then echo "::error::release binary carries the debug home override"; exit 1; fi
          if [ "${{ matrix.suffix }}" = "" ]; then
            chmod +x ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.suffix }}
          # These binaries are a handoff to the `release` job below, which
          # downloads them and attaches them to the GitHub release. Once they
          # expire, re-running a failed `release` job publishes a release with
          # no binaries and the only recovery is a rebuild. 14 is the
          # repository's artifact retention setting, which caps this value:
          # a larger number would be clamped to it without a word, so the
          # workflow says what actually takes effect (RELEASING.md rule 4).
          retention-days: 14

  release:
    needs: [build, verify, packaged-suite]
    runs-on: ubuntu-latest
    # One release job per tag at a time, and never cancelled mid-publish: two
    # runs racing on one draft could each verify a set the other replaced.
    concurrency:
      group: release-${{ needs.verify.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      # Keyless signing: the OIDC token names this workflow at this ref, and
      # that name is the identity every signature is verified against.
      id-token: write
    env:
      IDENTITY: https://github.com/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
      BINARIES: >-
        mcp-gateway-darwin-arm64 mcp-gateway-darwin-x86_64
        mcp-gateway-linux-aarch64 mcp-gateway-linux-x86_64
        mcp-gateway-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name 'mcp-gateway-*' -exec cp {} release/ \;
          # Bundle license/notice text with every published binary (counsel #7:
          # each artifact must carry its own license, not just the repo).
          cp LICENSE LICENSE-MIT LICENSE-NONCOMMERCIAL LICENSES.md NOTICE.md COMMERCIAL.md release/
          ls -la release/

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # SBOM per binary, SHA256SUMS.txt over binaries and SBOMs, a signature
      # bundle for each, all verified before any release exists.
      - name: Sign the binaries and write their SBOMs
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # BINARIES is a word list by design
          scripts/release/sign-release-assets.sh release "$VERSION" $BINARIES

      # Draft first: nothing is public until what the release actually serves
      # has been verified below. The release action keeps an existing
      # release's draft state, so an upload onto an already-published release
      # would go public unverified; refuse that instead.
      - name: Refuse to upload onto a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: scripts/release/refuse-published-release.sh "$GITHUB_REPOSITORY" "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: MCP Gateway ${{ needs.verify.outputs.tag }}
          body: |
            ## Installation

            ### Cargo (Recommended)
            ```bash
            cargo install mcp-gateway --version ${{ needs.verify.outputs.version }}
            ```

            ### Manual Download
            Download the appropriate binary for your platform from the assets below.

            **Supported platforms:**
            - `mcp-gateway-darwin-arm64` - macOS Apple Silicon (M1 and later)
            - `mcp-gateway-darwin-x86_64` - macOS Intel
            - `mcp-gateway-linux-x86_64` - Linux x86_64 (static musl)
            - `mcp-gateway-linux-aarch64` - Linux ARM64 (static musl)
            - `mcp-gateway-windows-x86_64.exe` - Windows x86_64 (MSVC)

            ## Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ## Verify signatures
            Every binary, its SBOM (`<binary>.spdx.json`) and `SHA256SUMS.txt` carry a
            keyless cosign bundle (`<file>.sigstore.json`). Use cosign 2.6.5 or later:
            ```bash
            cosign verify-blob \
              --bundle mcp-gateway-linux-x86_64.sigstore.json \
              --certificate-identity "${{ env.IDENTITY }}" \
              --certificate-oidc-issuer ${{ env.ISSUER }} \
              mcp-gateway-linux-x86_64
            ```

            ## Quick Start
            ```bash
            # Create config file
            cat > servers.yaml << 'EOF'
            server:
              port: 39400
            meta_mcp:
              enabled: true
            backends: {}
            EOF

            # Start gateway
            mcp-gateway --config servers.yaml
            ```

            See [README](https://github.com/MikkoParkkola/mcp-gateway#readme) for full documentation.
          files: |
            release/*
          draft: true
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}

      # What the draft serves, not what was uploaded: a dropped or renamed
      # asset fails here while the release is still invisible.
      - name: Verify the draft release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          # shellcheck disable=SC2086 # BINARIES is a word list by design
          scripts/release/verify-release-assets.sh published "$VERSION" $BINARIES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # What the public release serves, checked once more: publishing cannot be
      # undone here, but an asset changed between the draft check and now fails
      # the run loudly instead of passing unseen (GH1941.SIGN.1).
      - name: Verify the published release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published-final
          # shellcheck disable=SC2086 # BINARIES is a word list by design
          scripts/release/verify-release-assets.sh published-final "$VERSION" $BINARIES

  publish:
    needs: [release, verify]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Publish to crates.io
        # Same reason as the verify job: the runner replaces the crates-io
        # source, so the target registry must be named explicitly. Naming it
        # can route the token lookup to the per-registry variable, so supply
        # both spellings rather than risk an auth failure at publish time.
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-publish:
    needs: [release, verify]
    # Must stay GitHub-hosted. npm rejects a provenance bundle signed on a
    # self-hosted runner ("Unsupported GitHub Actions runner environment:
    # self-hosted"), so a third-party runner costs the build attestation.
    # This package is a thin wrapper that needs nothing from that fleet.
    # https://docs.npmjs.com/generating-provenance-statements
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC for npm trusted publishing + provenance attestation
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Node 22 bundles npm 10.x; OIDC trusted publishing requires npm >= 11.5.1,
      # and current npm@latest (12.x) requires Node >= 22.22.2, so pin Node 22.
      - name: Upgrade npm CLI for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Sync npm package version to git tag
        working-directory: npm
        env:
          TAG_REF: ${{ needs.verify.outputs.tag }}
        run: |
          TAG="${TAG_REF}"
          VERSION="${TAG#v}"
          echo "Setting npm version to ${VERSION}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Publish to npm (OIDC trusted publishing + provenance)
        working-directory: npm
        # Trusted publisher is configured on npmjs.com for
        # @mikkoparkkola/mcp-gateway against this workflow. npm CLI auto-detects
        # OIDC via id-token:write — no NODE_AUTH_TOKEN required.
        #
        # The runner image points npm at a mirror in its user-level .npmrc, and
        # setup-node's registry-url writes the project .npmrc at the repository
        # root, which npm does not read from this subdirectory. Name the real
        # registry on the command line so publish targets npmjs.org, which is
        # also the only registry the trusted publisher can authenticate to.
        #
        # A prerelease goes to the `next` dist-tag so `npm install
        # @mikkoparkkola/mcp-gateway` keeps resolving to the last stable, and
        # `@next` is the opt-in. --provenance stays on both paths: an rc adopter
        # gets the same attestation as a final release.
        env:
          DIST_TAG: ${{ needs.verify.outputs.is_prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish --access public --provenance --tag "${DIST_TAG}" --registry https://registry.npmjs.org

  homebrew-update:
    needs: [release, verify]
    # Skipped on a prerelease. The tap carries one stable formula, so bumping it
    # to an rc pushes the candidate to every `brew upgrade` — the ungraded
    # exposure this channel exists to prevent. Nothing depends on this job, so a
    # skip does not read as a failure.
    if: needs.verify.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download checksums for the verified tag
        id: meta
        # Tag and version come from `verify`, which already derived and
        # validated them against the manifest. Re-deriving them here would give
        # this job two sources of truth: the channel decision above reads
        # verify's classification while the artifacts read a local expansion, so
        # a divergence would fetch one release's checksums under another's
        # channel rule.
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/MikkoParkkola/mcp-gateway/releases/download/${TAG}/SHA256SUMS.txt" \
            -o SHA256SUMS.txt
          cat SHA256SUMS.txt

          extract_sha() {
            grep " $1$" SHA256SUMS.txt | awk '{print $1}'
          }
          {
            echo "sha_darwin_arm64=$(extract_sha mcp-gateway-darwin-arm64)"
            echo "sha_darwin_x86_64=$(extract_sha mcp-gateway-darwin-x86_64)"
            echo "sha_linux_aarch64=$(extract_sha mcp-gateway-linux-aarch64)"
            echo "sha_linux_x86_64=$(extract_sha mcp-gateway-linux-x86_64)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MikkoParkkola/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Rewrite formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.meta.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X86_64: ${{ steps.meta.outputs.sha_darwin_x86_64 }}
          SHA_LINUX_AARCH64: ${{ steps.meta.outputs.sha_linux_aarch64 }}
          SHA_LINUX_X86_64: ${{ steps.meta.outputs.sha_linux_x86_64 }}
        run: |
          for sha in "$SHA_DARWIN_ARM64" "$SHA_DARWIN_X86_64" "$SHA_LINUX_AARCH64" "$SHA_LINUX_X86_64"; do
            if [ -z "$sha" ]; then
              echo "Missing SHA256 for one of the release assets" >&2
              exit 1
            fi
          done

          cat > homebrew-tap/Formula/mcp-gateway.rb <<EOF
          class McpGateway < Formula
            desc "MCP gateway: unlimited MCP servers, tools and APIs at a fixed context cost"
            homepage "https://github.com/MikkoParkkola/mcp-gateway"
            # Required because the artifact basename ends in the architecture (arm64/x86_64),
            # which a clean Homebrew install can otherwise mis-detect as the version.
            version "${VERSION}"
            # See LICENSES.md / COMMERCIAL.md.
            license "PolyForm-Noncommercial-1.0.0"

            on_macos do
              on_arm do
                url "https://github.com/MikkoParkkola/mcp-gateway/releases/download/${TAG}/mcp-gateway-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/MikkoParkkola/mcp-gateway/releases/download/${TAG}/mcp-gateway-darwin-x86_64"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/MikkoParkkola/mcp-gateway/releases/download/${TAG}/mcp-gateway-linux-aarch64"
                sha256 "${SHA_LINUX_AARCH64}"
              end
              on_intel do
                url "https://github.com/MikkoParkkola/mcp-gateway/releases/download/${TAG}/mcp-gateway-linux-x86_64"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              if OS.mac?
                if Hardware::CPU.arm?
                  bin.install "mcp-gateway-darwin-arm64" => "mcp-gateway"
                else
                  bin.install "mcp-gateway-darwin-x86_64" => "mcp-gateway"
                end
              elsif OS.linux?
                if Hardware::CPU.arm?
                  bin.install "mcp-gateway-linux-aarch64" => "mcp-gateway"
                else
                  bin.install "mcp-gateway-linux-x86_64" => "mcp-gateway"
                end
              end
            end

            def caveats
              <<~CAVEATS
                Licensing: mcp-gateway is licensed under PolyForm Noncommercial 1.0.0.
                Commercial use requires a license. See https://github.com/MikkoParkkola/mcp-gateway/blob/main/COMMERCIAL.md
              CAVEATS
            end

            test do
              assert_match version.to_s, shell_output("#{bin/"mcp-gateway"} --version")
            end
          end
          EOF

          echo "--- Updated formula ---"
          cat homebrew-tap/Formula/mcp-gateway.rb

      - name: Commit and push formula bump
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/mcp-gateway.rb; then
            echo "Formula already up to date at v${VERSION}"
            exit 0
          fi
          git add Formula/mcp-gateway.rb
          git commit -m "mcp-gateway ${VERSION}"
          git push
