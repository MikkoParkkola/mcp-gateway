# Randomness, as above: rand's thread generator type. getrandom's SysRng cannot be listed: getrandom is not a
# direct dependency, so targets that never load it read the path as unreachable (fails -D warnings); a SysRng is
# drawn from only through the banned TryRng and SeedableRng methods.
disallowed-types = [
    { path = "rand::rngs::ThreadRng", reason = "a random draw: an id comes from crate::ids, a secret from crate::random_secret; anything else needs a reviewed allow naming its class" },
]
