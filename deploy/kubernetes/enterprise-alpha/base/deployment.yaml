apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: mcp-gateway-enterprise
    mcp-gateway.io/license-tier: enterprise
spec:
  # One, and base/configmap.yaml declares the same in server.replicas: the
  # modern protocol's task store, key-server tokens and accounts custody are per
  # process (UPGRADING-4.0 §37). Change both together or the gateway refuses.
  replicas: 1
  revisionHistoryLimit: 10
  # Recreate: the config serves the modern protocol, so a surge pod beside the
  # old one would be a second task store (UPGRADING-4.0 item 37). An upgrade has
  # a short outage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/part-of: mcp-gateway-enterprise
      # No prometheus.io/* annotations: /metrics answers only the scrape token
      # below, and a generic annotation-driven job would send that token to
      # every annotated pod in the cluster. Scrape with a dedicated job.
    spec:
      serviceAccountName: mcp-gateway
      # The gateway never calls the Kubernetes API: it has no API client, and
      # the `kubernetes` subcommands shell out to kubectl, which the image does
      # not carry. The reconciler Role is for wherever that CLI runs.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image declares `USER gateway`, a name the kubelet cannot verify
        # as non-root, so the pod is refused (CreateContainerConfigError)
        # unless the UID is numeric here. 1001 is the image's gateway user.
        runAsUser: 1001
        # The config projection is root-owned; the gateway reads it through
        # this group, and refuses it when a world bit is set (CONFIG.2).
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/mikkoparkkola/mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          # No `serve`: --host/--port are top-level flags and the subcommand
          # takes only --stdio, so `serve --host` exits 2 before reading config.
          args:
            - "--config"
            - "/etc/mcp-gateway/gateway.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "39400"
          ports:
            - name: http
              containerPort: 39400
              protocol: TCP
          env:
            # Every `~` writer (task store, gateway data dir, upgrade stamp, npm/uv
            # caches) lands on the writable `state` volume; the root FS is read-only.
            - name: HOME
              value: "/var/lib/mcp-gateway"
            - name: MCP_GATEWAY_LOG_FORMAT
              value: "json"
            - name: MCP_GATEWAY_LOG_LEVEL
              value: "info"
            # The ConfigMap references env:MCP_GATEWAY_TOKEN. Create this Secret
            # before applying:
            #   kubectl create secret generic mcp-gateway-auth \
            #     --from-literal=token="$(openssl rand -base64 32)"
            # A missing value fails validation at startup rather than serving
            # without a credential, which is the intended outcome.
            - name: MCP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-auth
                  key: token
            # The ConfigMap's server.metrics_token references this. Optional:
            # without the Secret the gateway still starts and /metrics answers
            # 401. Create it to scrape:
            #   kubectl create secret generic mcp-gateway-metrics \
            #     --from-literal=token="$(openssl rand -base64 32)"
            - name: MCP_GATEWAY_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-metrics
                  key: token
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway
              readOnly: true
            - name: state
              mountPath: /var/lib/mcp-gateway
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: mcp-gateway-config
            # 0440 in decimal: group read for fsGroup, no world bit.
            defaultMode: 288
        # Pod-lifetime state under HOME: it survives a container restart, and a
        # replaced pod (rollout, eviction, reschedule) starts empty, task records included.
        # Bounded like the Helm chart's stateVolume.sizeLimit: a full HOME evicts
        # the pod instead of filling the node's disk.
        - name: state
          emptyDir:
            sizeLimit: 1Gi
