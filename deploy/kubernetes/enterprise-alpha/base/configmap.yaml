apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-config
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: mcp-gateway-enterprise
    mcp-gateway.io/license-tier: enterprise
data:
  gateway.yaml: |
    server:
      host: 0.0.0.0
      port: 39400
      # The name clients dial. On a 0.0.0.0 bind the Host gate admits a NAME
      # only when it is declared here; everything else is refused as a rebinding
      # attempt. The numeric probes kubelet sends are admitted regardless, so an
      # undeclared name reads as a healthy gateway that answers no one.
      #
      # EDIT THIS when applying into another namespace, or when an ingress
      # fronts the pod: exactly one name is admitted, and it must be the one
      # callers use.
      public_url: "http://mcp-gateway.mcp-gateway.svc.cluster.local:39400"
      # /metrics answers only this token, never the auth bearer. A missing
      # variable does not stop startup; /metrics then answers 401.
      metrics_token: "env:MCP_GATEWAY_METRICS_TOKEN"
      # Equal to spec.replicas in base/deployment.yaml; kustomize cannot copy it.
      # Above 1 the gateway refuses to start with the modern protocol on, or with
      # key_server or accounts enabled (UPGRADING-4.0 §37).
      replicas: 1
    # Reachable by every pod in the cluster, so the tools need a credential or
    # the gateway refuses to open a port at all. MCP_GATEWAY_TOKEN comes from a
    # Secret in the pod spec, never from this ConfigMap. /health stays open, and
    # /livez and /readyz with it, for probes.
    #
    # A mesh that authenticates first is the documented alternative:
    # server.allow_unauthenticated_network_bind, logged at WARN on every start.
    auth:
      enabled: true
      bearer_token: "env:MCP_GATEWAY_TOKEN"
      public_paths: ["/health"]
    security:
      firewall:
        enabled: true
        scan_requests: true
        scan_responses: true
      # Auth on requires the audit log (UPGRADING-4.0). It lives on the
      # writable `audit` volume in deployment.yaml, an emptyDir that dies with
      # the pod: swap in a PersistentVolumeClaim to keep it.
      transparency_log:
        enabled: true
        path: /var/lib/mcp-gateway/audit/transparency.jsonl
    backends: {}
