services:
  mcp-gateway:
    image: ghcr.io/mikkoparkkola/mcp-gateway:latest
    container_name: mcp-gateway
    restart: unless-stopped
    command: ["--config", "/config.yaml", "--host", "0.0.0.0", "--port", "39400"]
    ports:
      - "127.0.0.1:39400:39400"
    volumes:
      - ${PWD}/gateway.yaml:/config.yaml:ro
      - ${PWD}/capabilities:/capabilities:ro
    environment:
      MCP_GATEWAY_LOG_LEVEL: info
      MCP_GATEWAY_LOG_FORMAT: json
      # The gateway refuses to serve when it is reachable by a network address
      # and its tools need no credential. Inside a container it must bind
      # 0.0.0.0 to receive anything at all, and the config `init` writes keeps
      # /mcp public so the MCP client keeps working — which is that state.
      #
      # Here the boundary is the port publish above: 127.0.0.1:39400 means only
      # this host reaches it, and the container's 0.0.0.0 is the container's
      # own interface, not the host's. The gateway cannot see that from inside,
      # so it is told.
      #
      # Change the publish to 0.0.0.0:39400 and this line becomes a lie. Then
      # either close the tool paths and give clients the credential, or put
      # something in front that authenticates.
      MCP_GATEWAY_SERVER__ALLOW_UNAUTHENTICATED_NETWORK_BIND: "true"

      # The name every caller dials. On the 0.0.0.0 bind above the Host gate
      # admits a NAME only when it is declared here; an undeclared one is
      # refused as a rebinding attempt while the port stays open, so the client
      # on the host and the healthcheck below would both get 403.
      #
      # Change this together with the publish above: exactly one name is
      # admitted, and it must be the one callers use.
      MCP_GATEWAY_SERVER__PUBLIC_URL: "http://localhost:39400"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:39400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
