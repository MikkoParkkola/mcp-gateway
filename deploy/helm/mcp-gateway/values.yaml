# Default values for mcp-gateway.
# The values file is the supported enterprise deployment contract (ADR-004).

# nameOverride / fullnameOverride feed the pod selector (app.kubernetes.io/name),
# which Kubernetes makes IMMUTABLE after install. Set them at install time and do
# not change them on upgrade (a changed selector is rejected). The release-scoped
# app.kubernetes.io/instance label prevents cross-install pod routing.
# nameOverride: ""
# fullnameOverride: ""

replicaCount: 2

image:
  registry: ghcr.io
  repository: mikkoparkkola/mcp-gateway
  # Prefer a digest for immutable, supply-chain-safe deploys (set by A5/6684).
  # When `digest` is set it takes precedence over `tag`.
  tag: "3.4.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 39400

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Where the gateway's bearer token comes from. The config below references it as
# env:MCP_GATEWAY_TOKEN; this names the Secret that supplies it.
#
# Required by default, because the config it feeds requires a credential. Leave
# existingSecret empty ONLY together with the mesh alternative described under
# `config.auth` — otherwise the pod fails validation at startup, which is the
# intended outcome for an install that has neither.
auth:
  existingSecret: ""
  secretKey: token

# Gateway config rendered into a ConfigMap and mounted read-only.
config:
  server:
    host: 0.0.0.0
    port: 39400
  # A gateway reachable at a network address with tools that need no credential
  # is refused before it opens a port, so this chart must say which it is. A
  # pod's service is reachable by every other pod in the cluster.
  #
  # Default: require a credential. Supply it as MCP_GATEWAY_TOKEN in the pod —
  # from a Secret, not from these values, which land in a ConfigMap in plain
  # text. Only /health stays open, so probes work without one.
  auth:
    enabled: true
    bearer_token: "env:MCP_GATEWAY_TOKEN"
    public_paths: ["/health"]
  # If a service mesh authenticates before anything reaches this pod, drop the
  # auth block above and set this instead. It is logged at WARN on every start,
  # deliberately: it is the one setting that turns the check off.
  #   server:
  #     allow_unauthenticated_network_bind: true
  security:
    firewall:
      enabled: true
      scan_requests: true
      scan_responses: true
  backends: []

serviceAccount:
  create: true
  name: ""
  # Data-plane gateway needs no API token; automount stays off unless required.
  automountToken: false

# RBAC is off by default: the data-plane gateway needs no cluster permissions
# without the (deferred) operator. A3/least-privilege refines this.
rbac:
  create: false

# NetworkPolicy is opt-in. When enabled it is WORKLOAD-SCOPED (selects only the
# gateway's own pods) and restrictive: ingress limited to the service port,
# egress limited to HTTPS + DNS. It is NOT a namespace-wide default-deny — that
# affects other workloads and is the cluster operator's responsibility.
networkPolicy:
  enabled: false

logging:
  format: json
  level: info

# HTTP /health probes. Default on. Disable only for images that don't serve the
# health endpoint (e.g. lifecycle/CI tests with a placeholder image).
probes:
  enabled: true
