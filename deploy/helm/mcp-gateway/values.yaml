# Default values for mcp-gateway.
# The values file is the supported enterprise deployment contract (ADR-004).

# nameOverride / fullnameOverride feed the pod selector (app.kubernetes.io/name),
# which Kubernetes makes IMMUTABLE after install. Set them at install time and do
# not change them on upgrade (a changed selector is rejected). The release-scoped
# app.kubernetes.io/instance label prevents cross-install pod routing.
# nameOverride: ""
# fullnameOverride: ""

# One replica. More than one fails the render while any state lives in a single
# process (UPGRADING-4.0 §37):
# - config.server.modern_protocol, on by default, serves the tasks extension, and
#   each pod has its own task store, so a task created on one pod is not found on
#   another;
# - config.key_server.enabled keeps issued tokens and revocations in one process;
# - config.accounts.enabled holds single_process custody.
# With modern_protocol false and neither feature on, more replicas render; a retry
# is then served by any of them. The chart writes config.server.replicas from this
# value, and the gateway refuses to start on the same rules. `kubectl scale` and an
# HPA change the pod count without the declaration: don't.
# While any of the three is on, the Deployment uses Recreate: a surge pod would be a
# second store beside the old one, so an upgrade has a short outage.
# See docs/DEPLOYMENT.md, "Replica Count and per-process state".
replicaCount: 1

image:
  registry: ghcr.io
  repository: mikkoparkkola/mcp-gateway
  # Prefer a digest for immutable, supply-chain-safe deploys (set by A5/6684).
  # When `digest` is set it takes precedence over `tag`.
  tag: "4.0.0-beta.1"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 39400

# The pod's identity. The image's gateway user and group are both 1001, and the
# chart refuses to render any other value, root (0) included: a different UID
# cannot write HOME, and a different GID or fsGroup cannot read what the
# image's group owns. fsGroup is also how the gateway reads its config: the
# configMap projection is root-owned, the kubelet makes it root:<fsGroup>, and
# configVolume.defaultMode 0440 lets the gateway read it through that group
# with no world bit set (UPGRADING-4.0 item 35). A mesh that injects its own
# group is not supported by this chart.
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

configVolume:
  # Decimal, because `--set` and some YAML readers do not take octal: 288 is
  # 0440. Any world bit, or group write, is refused at startup.
  defaultMode: 288

# The `state` emptyDir holds HOME (task store, npm/uv caches). Past this size
# the kubelet evicts the pod instead of letting it fill the node's disk.
stateVolume:
  sizeLimit: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# How this gateway proves who is calling it. A pod's service is reachable by
# every other pod in the cluster, and the gateway refuses to serve a
# network-reachable tool surface that needs no credential — so this has to be
# answered, and the chart renders exactly one of the two answers.
#
#   credential  (default) the tools require a bearer token, supplied from the
#               Secret named below. Only /health, /livez and /readyz stay open,
#               so probes work.
#   mesh        a service mesh authenticates before anything reaches this pod.
#               No token is rendered and server.allow_unauthenticated_network_bind
#               is set, which is logged at WARN on every start.
#
# The two are mutually exclusive by construction. Setting the mesh flag while a
# token reference was still rendered produced a pod that crash-looped on an
# unresolvable environment variable.
auth:
  mode: credential
  # credential mode only: the Secret holding the bearer token. Named by default
  # rather than left blank, so the chart renders and the missing-Secret failure
  # lands where Kubernetes reports it clearly — the pod stops with
  # CreateContainerConfigError naming this Secret, instead of the chart refusing
  # to render at all.
  #
  #   kubectl create secret generic mcp-gateway-auth \
  #     --from-literal=token="$(openssl rand -base64 32)"
  existingSecret: mcp-gateway-auth
  secretKey: token

# credential mode only. The bearer token crosses the pod's 0.0.0.0 bind in
# plain HTTP, and the gateway refuses that unless server.cleartext_http names
# who protects it (UPGRADING-4.0, C3). Rendered as that key:
#
#   cluster_internal         (default) callers reach the pod only over the
#                            cluster network, by its Service name. The chart
#                            then renders an ingress-only NetworkPolicy
#                            (below) even with networkPolicy.enabled false,
#                            and refuses to render a NodePort/LoadBalancer
#                            Service or a config.server.public_url other than
#                            this release's Service name. WARNs every start.
#   tls_terminated_upstream  an ingress or proxy terminates TLS in front of the
#                            pod. Set this when public_url is an ingress host.
#   refuse                   no plain HTTP: the pod starts only with mtls on.
server:
  cleartextHttp: cluster_internal

# Gateway config rendered into a ConfigMap and mounted read-only.
config:
  server:
    host: 0.0.0.0
    port: 39400
    # The name clients dial. Left unset, the template fills in this release's
    # in-cluster Service DNS name, which is what a pod-to-pod caller uses. On a
    # 0.0.0.0 bind the Host gate admits exactly one NAME, so set it to the
    # ingress hostname when something fronts the pod; numeric probes are
    # admitted either way, and an undeclared name reads as a healthy gateway
    # that answers no one.
    # public_url: "https://mcp-gateway.example.com"
  # `auth` is NOT set here on purpose: the template renders it from auth.mode
  # above, so the credential and the mesh flag cannot both appear. A value set
  # here would be overwritten.
  security:
    firewall:
      enabled: true
      scan_requests: true
      scan_responses: true
  # A map keyed by backend name, never a list: `backends: []` fails the config
  # load and the pod exits 1.
  backends: {}

serviceAccount:
  create: true
  name: ""
  # Data-plane gateway needs no API token; automount stays off unless required.
  automountToken: false

# RBAC is off by default: the data-plane gateway needs no cluster permissions
# without the (deferred) operator. A3/least-privilege refines this.
rbac:
  create: false

# NetworkPolicy is opt-in, except that credential mode with
# server.cleartextHttp: cluster_internal (the default) always renders an
# INGRESS-ONLY policy (ingress limited to the service port, egress untouched so
# backends on any port stay reachable): the cluster network is then the trust
# boundary for the bearer token. With enabled: true it is WORKLOAD-SCOPED
# (selects only the gateway's own pods) and restrictive: ingress limited to the
# service port, egress limited to HTTPS + DNS. It is NOT a namespace-wide default-deny — that
# affects other workloads and is the cluster operator's responsibility.
networkPolicy:
  enabled: false

logging:
  format: json
  level: info

# /metrics answers only the scrape token in server.metrics_token, never the auth
# bearer. Name the Secret holding it here; until then /metrics answers 401 and
# the chart advertises nothing, so a stock install is not scraped to up=0.
#
#   kubectl create secret generic mcp-gateway-metrics \
#     --from-literal=token="$(openssl rand -base64 32)"
#
# With a Secret, the pod carries prometheus.io/* annotations. Point only a
# DEDICATED scrape job at them: a generic annotation-driven kubernetes-pods job
# would send this token to every annotated pod in the cluster. Or enable the
# ServiceMonitor (prometheus-operator), which sends it via bearerTokenSecret.
metrics:
  existingSecret: ""
  secretKey: token
  serviceMonitor:
    enabled: false
    interval: 30s

# HTTP /livez and /readyz probes. Default on. Disable only for images that don't
# serve them (e.g. lifecycle/CI tests with a placeholder image).
probes:
  enabled: true
