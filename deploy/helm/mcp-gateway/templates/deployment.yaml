apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 10
  strategy:
    {{- /* A surge pod beside the old one is two processes, each with its own
           task store, tokens or custody (UPGRADING-4.0 §37). The API server
           rejects rollingUpdate under Recreate, so the block goes with it. */}}
    {{- if include "mcp-gateway.perProcessState" . }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.selectorLabels" . | nindent 8 }}
      {{- /* /metrics answers only server.metrics_token, so advertising it
             without that token would scrape every stock install to up=0. */}}
      {{- if .Values.metrics.existingSecret }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.service.port | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mcp-gateway.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # The image declares `USER gateway`, a name the kubelet cannot verify
        # as non-root, so the pod is refused (CreateContainerConfigError)
        # unless the UID is numeric here. 1001 is the image's gateway user.
        runAsUser: 1001
        # The config projection is root-owned; the gateway reads it through
        # this group, and refuses it when a world bit is set (CONFIG.2).
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "mcp-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No `serve`: --host/--port are top-level flags and the subcommand
          # takes only --stdio, so `serve --host` exits 2 before reading config.
          args:
            - "--config"
            - "/etc/mcp-gateway/gateway.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Every `~` writer (task store, gateway data dir, upgrade stamp, npm/uv
            # caches) lands on the writable `state` volume; the root FS is read-only.
            - name: HOME
              value: "/var/lib/mcp-gateway"
            - name: MCP_GATEWAY_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: MCP_GATEWAY_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- /* Same test as the ConfigMap's, inverted the same way: anything
                   that is not mesh renders a credential, so anything that is
                   not mesh must also get the Secret. Keying one on "is mesh"
                   and the other on "is credential" let a typo render a token
                   reference with nothing to resolve it. */}}
            {{- if ne .Values.auth.mode "mesh" }}
            {{- if not .Values.auth.existingSecret }}
            {{- fail "auth.existingSecret is required in credential mode: the rendered config references env:MCP_GATEWAY_TOKEN, and a pod without it fails validation at startup." }}
            {{- end }}
            # The config references env:MCP_GATEWAY_TOKEN. A missing value fails
            # validation at startup rather than serving without one, so an
            # install that forgets the Secret stops instead of opening.
            - name: MCP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.secretKey | quote }}
            {{- end }}
            {{- if .Values.metrics.existingSecret }}
            # The scrape token /metrics answers (server.metrics_token). A
            # missing value, or a missing Secret, does not stop startup;
            # /metrics then answers 401.
            - name: MCP_GATEWAY_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.existingSecret | quote }}
                  key: {{ .Values.metrics.secretKey | quote }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway
              readOnly: true
            - name: state
              mountPath: /var/lib/mcp-gateway
            {{- if ne .Values.auth.mode "mesh" }}
            # Credential mode turns auth on, and auth on requires the audit
            # log (UPGRADING-4.0): the ConfigMap points it here.
            - name: audit
              mountPath: /var/lib/mcp-gateway/audit
            {{- end }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "mcp-gateway.fullname" . }}-config
            defaultMode: {{ .Values.configVolume.defaultMode }}
        # Pod-lifetime state under HOME: it survives a container restart, and a
        # replaced pod (rollout, eviction, reschedule) starts empty, task records included.
        - name: state
          emptyDir: {}
        {{- if ne .Values.auth.mode "mesh" }}
        # An emptyDir log dies with the pod; set audit.existingClaim to keep it.
        # fsGroup above makes the claim writable by uid 1001.
        - name: audit
          {{- if .Values.audit.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.audit.existingClaim | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.audit.sizeLimit }}
          {{- end }}
        {{- end }}
