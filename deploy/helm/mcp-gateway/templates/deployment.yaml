apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ .Values.service.port | quote }}
    spec:
      serviceAccountName: {{ include "mcp-gateway.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "mcp-gateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "serve"
            - "--config"
            - "/etc/mcp-gateway/gateway.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: MCP_GATEWAY_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: MCP_GATEWAY_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- /* Same test as the ConfigMap's, inverted the same way: anything
                   that is not mesh renders a credential, so anything that is
                   not mesh must also get the Secret. Keying one on "is mesh"
                   and the other on "is credential" let a typo render a token
                   reference with nothing to resolve it. */}}
            {{- if ne .Values.auth.mode "mesh" }}
            {{- if not .Values.auth.existingSecret }}
            {{- fail "auth.existingSecret is required in credential mode: the rendered config references env:MCP_GATEWAY_TOKEN, and a pod without it fails validation at startup." }}
            {{- end }}
            # The config references env:MCP_GATEWAY_TOKEN. A missing value fails
            # validation at startup rather than serving without one, so an
            # install that forgets the Secret stops instead of opening.
            - name: MCP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.secretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway
              readOnly: true
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "mcp-gateway.fullname" . }}-config
