# Unit tests for deploy/prometheus/mcp-gateway-alerts.yml, run offline with
# `promtool test rules`. No scrape target, no Prometheus server, no network.
#
# Interval is 1m so that "single increment ages out of the 15m window" can be
# expressed in a small, readable number of eval steps.
rule_files:
  - mcp-gateway-alerts.yml

evaluation_interval: 1m

tests:
  # (a) Counter never increments -> no alert, ever.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 20m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts: []

  # (b) A single increment fires the alert, with the backend label attached.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "0x5 1 1x14"

    alert_rule_test:
      # increase() needs at least two samples spanning the step for the
      # extrapolated rate to register; one step after the bump is enough.
      - eval_time: 6m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: stdio-a
            exp_annotations:
              summary: "Backend stdio-a did not stop cleanly when idle"

  # (c) The alert resolves once the single increment ages out of the 15m
  # increase() window -- no `for`, so this is a pure function of the window.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "0x5 1 1x30"

    alert_rule_test:
      # Still inside the 15m window after the bump at t=5m: firing.
      - eval_time: 15m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: stdio-a
            exp_annotations:
              summary: "Backend stdio-a did not stop cleanly when idle"
      # Now the bump (t=5m) is more than 15m behind eval_time (t=21m):
      # resolved.
      - eval_time: 21m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts: []

  # (d) Per-backend: a failure on one backend must not page for another.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "0x5 1 1x14"
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-b"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 6m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: stdio-a
            exp_annotations:
              summary: "Backend stdio-a did not stop cleanly when idle"

  # ── SIGNING.5 nonce capacity ───────────────────────────────────────────────
  #
  # Two alerts, deliberately different in kind. McpSigningNonceCapacity watches
  # the aggregate occupancy gauge and needs `for: 5m` — a store briefly near its
  # bound is normal, a store parked there is not. McpSigningNonceCapacityRefusal
  # watches the bounded rejection counter and has no `for`: by the time a single
  # admission has been refused for capacity, protection has already been denied
  # to a real caller, so there is nothing to wait out.
  #
  # Neither alert may carry a `reason` or an identity label. The occupancy gauge
  # has none by construction; the refusal rule must aggregate its two capacity
  # reasons into one series, which case (h) below is what pins.

  # (e) Exactly at the threshold is quiet: the comparison is strictly greater,
  # so an 80000-entry store never pages on its own.
  - interval: 1m
    input_series:
      - series: "mcp_message_signing_nonce_entries"
        values: "80000x20"

    alert_rule_test:
      - eval_time: 20m
        alertname: McpSigningNonceCapacity
        exp_alerts: []

  # (f) Above the threshold, but not yet for 5m: still quiet. Occupancy crosses
  # at t=6m, so the alert is pending until t=11m and firing from t=11m.
  - interval: 1m
    input_series:
      - series: "mcp_message_signing_nonce_entries"
        values: "0x5 90000x20"

    alert_rule_test:
      - eval_time: 10m
        alertname: McpSigningNonceCapacity
        exp_alerts: []
      - eval_time: 11m
        alertname: McpSigningNonceCapacity
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
            exp_annotations:
              summary: "Signing nonce store is above its capacity watermark"

  # (g) Recovery: occupancy drops back, the alert resolves. Above from t=6m to
  # t=16m, back to zero from t=17m.
  - interval: 1m
    input_series:
      - series: "mcp_message_signing_nonce_entries"
        values: "0x5 90000x10 0x10"

    alert_rule_test:
      - eval_time: 12m
        alertname: McpSigningNonceCapacity
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
            exp_annotations:
              summary: "Signing nonce store is above its capacity watermark"
      - eval_time: 18m
        alertname: McpSigningNonceCapacity
        exp_alerts: []

  # (h) One capacity refusal of either reason pages at once, and BOTH reasons
  # firing together still produce exactly one alert carrying no reason label —
  # the operator is told the store is refusing, never which identity did it.
  - interval: 1m
    input_series:
      - series: 'mcp_message_signing_nonce_rejections_total{reason="principal_capacity"}'
        values: "0x5 1 1x20"
      - series: 'mcp_message_signing_nonce_rejections_total{reason="global_capacity"}'
        values: "0x5 1 1x20"

    alert_rule_test:
      # increase() needs two samples spanning the step before the extrapolated
      # rate registers; one step after the bump is enough.
      - eval_time: 6m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
            exp_annotations:
              summary: "Signing nonce admissions are being refused for capacity"

  # (i) Replay and invalid refusals are the store working as designed. They must
  # never page, however many of them there are.
  - interval: 1m
    input_series:
      - series: 'mcp_message_signing_nonce_rejections_total{reason="replay"}'
        values: "0+5x20"
      - series: 'mcp_message_signing_nonce_rejections_total{reason="invalid"}'
        values: "0+3x20"

    alert_rule_test:
      - eval_time: 6m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts: []
      - eval_time: 20m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts: []

  # (j) A single capacity refusal ages out of the 5m increase() window and the
  # alert resolves — no `for`, so this is a pure function of the window.
  - interval: 1m
    input_series:
      - series: 'mcp_message_signing_nonce_rejections_total{reason="global_capacity"}'
        values: "0x5 1 1x20"

    alert_rule_test:
      - eval_time: 6m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
            exp_annotations:
              summary: "Signing nonce admissions are being refused for capacity"
      # The bump at t=5m->6m is now more than 5m behind: resolved.
      - eval_time: 13m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts: []

  # (k) The per-principal reason ALONE pages, and recovers the same way. (h)
  # moves both capacity reasons together and (j) moves only the global one, so
  # a rule that matched `global_capacity` and nothing else passed both: one
  # caller exhausting its own bucket while the store as a whole is fine would
  # have gone unreported. This is the case that refuses that rule.
  - interval: 1m
    input_series:
      - series: 'mcp_message_signing_nonce_rejections_total{reason="principal_capacity"}'
        values: "0x5 1 1x20"

    alert_rule_test:
      - eval_time: 6m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
            exp_annotations:
              summary: "Signing nonce admissions are being refused for capacity"
      # Same 5m window as (j): the bump ages out and the alert resolves.
      - eval_time: 13m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts: []

  # ── First occurrence (MIK-7547 review) ─────────────────────────────────────
  #
  # The gateway creates each counter at its first increment, already at 1: the
  # series is absent before it, never 0. The cases above start from 0, which
  # hid that `increase()` alone reads 0 for such a series and never fires. Each
  # case below starts the series absent (`_`), as a real scrape sees it.

  # (l) The first idle-stop failure fires, then ages out of the 15m window.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "_x5 1x20"

    alert_rule_test:
      - eval_time: 5m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: stdio-a
            exp_annotations:
              summary: "Backend stdio-a did not stop cleanly when idle"
      - eval_time: 22m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts: []

  # (m) A counter that exists at 0 is quiet while it is new in the window: the
  # `> 0` on the new-series branch is what keeps it so.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 5m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts: []

  # (n) The first capacity refusal of a reason fires, with no reason label.
  - interval: 1m
    input_series:
      - series: 'mcp_message_signing_nonce_rejections_total{reason="principal_capacity"}'
        values: "_x5 1x20"

    alert_rule_test:
      - eval_time: 5m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts:
          - exp_labels:
              severity: warning
              category: security
            exp_annotations:
              summary: "Signing nonce admissions are being refused for capacity"
      - eval_time: 13m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts: []

  # ── Caller pool slots (MIK-7547) ───────────────────────────────────────────

  # (o) The first slot refusal fires, carrying backend and limit.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_identity_slots_refused_total{backend="ledger",limit="principal"}'
        values: "_x5 1x20"

    alert_rule_test:
      - eval_time: 5m
        alertname: McpBackendCallerSlotsRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: ledger
              limit: principal
            exp_annotations:
              summary: "Backend ledger refused callers at its principal slot limit"
      - eval_time: 22m
        alertname: McpBackendCallerSlotsRefused
        exp_alerts: []

  # (p) A later refusal on an existing series fires through increase().
  - interval: 1m
    input_series:
      - series: 'mcp_backend_identity_slots_refused_total{backend="ledger",limit="backend"}'
        values: "1x20 2x10"

    alert_rule_test:
      - eval_time: 25m
        alertname: McpBackendCallerSlotsRefused
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: ledger
              limit: backend
            exp_annotations:
              summary: "Backend ledger refused callers at its backend slot limit"

  # (q) 53 slots held for 10 minutes fires; 52 never does.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_pool_slots{backend="ledger"}'
        values: "53x20"
      - series: 'mcp_backend_pool_slots{backend="quiet"}'
        values: "52x20"

    alert_rule_test:
      - eval_time: 9m
        alertname: McpBackendCallerSlotsNearCap
        exp_alerts: []
      - eval_time: 10m
        alertname: McpBackendCallerSlotsNearCap
        exp_alerts:
          - exp_labels:
              severity: warning
              backend: ledger
            exp_annotations:
              summary: "Backend ledger holds 53 of its 65 pool slots"

  # ── A missed scrape at the window edge (MIK-7988) ──────────────────────────
  #
  # A failed scrape leaves a staleness marker. When it lands exactly one window
  # back, an instant `X offset w` returns nothing there, so `X unless X offset w`
  # reads an old, unchanged series as new and the alert fires again with no new
  # event. Each case puts the marker at t=16m and evaluates one window later.

  # (r) Idle-stop: one failure at t=5m, stale at t=16m, quiet at t=31m.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_idle_stop_close_failures{backend="stdio-a"}'
        values: "_x5 1x10 stale 1x20"

    alert_rule_test:
      - eval_time: 31m
        alertname: McpBackendIdleStopCloseFailures
        exp_alerts: []

  # (s) Nonce capacity: the 5m window, so quiet at t=21m.
  - interval: 1m
    input_series:
      - series: 'mcp_message_signing_nonce_rejections_total{reason="global_capacity"}'
        values: "_x5 1x10 stale 1x20"

    alert_rule_test:
      - eval_time: 21m
        alertname: McpSigningNonceCapacityRefusal
        exp_alerts: []

  # (t) Slot refusals: quiet at t=31m.
  - interval: 1m
    input_series:
      - series: 'mcp_backend_identity_slots_refused_total{backend="ledger",limit="principal"}'
        values: "_x5 1x10 stale 1x20"

    alert_rule_test:
      - eval_time: 31m
        alertname: McpBackendCallerSlotsRefused
        exp_alerts: []
