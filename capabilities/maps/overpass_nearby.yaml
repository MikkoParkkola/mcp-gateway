sha256: 435c4eefd44bb206bb89e782d6fddbd869b5a83d3e6ab954db5d2da93cf74bdf
fulcrum: "1.0"
name: overpass_nearby
description: >-
  Points of interest of one kind (cafes, pharmacies, ATMs ...) within a radius
  of a point, from OpenStreetMap through the public Overpass API (no API key).
  Paced at one request per 2 seconds per gateway process; the public instance
  asks for about 10,000 requests and under 1 GB a day, and answers "at
  capacity" when its query slots are full.
attribution: "© OpenStreetMap contributors"

schema:
  input:
    type: object
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
      longitude:
        type: number
        minimum: -180
        maximum: 180
      category:
        type: string
        description: The kind of place (an OpenStreetMap amenity value)
        enum:
          - cafe
          - restaurant
          - bar
          - pub
          - fast_food
          - pharmacy
          - hospital
          - clinic
          - doctors
          - dentist
          - atm
          - bank
          - fuel
          - charging_station
          - parking
          - toilets
          - drinking_water
          - post_office
          - police
          - library
          - school
      radius:
        type: integer
        minimum: 1
        maximum: 5000
        description: Search radius in metres
      limit:
        type: integer
        minimum: 1
        maximum: 50
        description: Most places to return
    required: [latitude, longitude, category, radius, limit]
  output:
    type: object
    additionalProperties: true
    properties:
      elements:
        type: array
        description: Matching nodes, ways and relations, each with its tags and centre
      attribution:
        type: string

providers:
  primary:
    service: rest
    rate_limit:
      interval_ms: 2000
    config:
      endpoint: https://overpass-api.de/api/interpreter
      method: GET
      headers:
        User-Agent: "mcp-gateway/4.0 (+https://github.com/MikkoParkkola/mcp-gateway)"
      params:
        data: "[out:json][timeout:25];nwr(around:{radius},{latitude},{longitude})[amenity={category}];out center {limit};"

cache:
  strategy: exact
  ttl: 3600

auth:
  required: false

metadata:
  category: maps
  tags: [maps, places, nearby, points-of-interest, openstreetmap, overpass]
  cost_category: free
  execution_time: medium
  read_only: true
