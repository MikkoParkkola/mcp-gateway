sha256: b176adfa8be05c12daa47b3251ea0c672376757dab2507dddc9fdc71356dbf0f
fulcrum: "1.0"
name: linear_get_issue
description: "Get a single Linear issue by UUID or identifier (e.g., 'ENG-123') with full details and comments; an archived issue is returned too"

schema:
  input:
    type: object
    properties:
      identifier:
        type: string
        description: "Issue UUID, or identifier like 'ENG-123' or 'BOT-42'"
        examples:
          - "ENG-123"
          - "9cf1e2a4-6b3d-4f8e-a1c7-2d5b8e0f3a61"
    required: [identifier]
  output:
    type: object
    properties:
      issue:
        type: object
        description: Full issue details

# Canonical projection (MIK-5877). Maps the issue payload onto the gateway's
# canonical schema (actor/subject/env_time/url). Paths are relative to the
# response payload ({issue: {...}}). DORMANT unless the gateway runs
# with meta_mcp.projection_mode = on | experimental; at the default `off` this
# block changes no response. The untouched payload is always preserved under
# _raw. NOTE: enabling experimental projects this tool for ~50% of sessions —
# any consumer that reads issue.* directly (e.g. a claim-verify protocol) must
# pass _full:true or run outside the experiment window.
projection:
  subject:
    id: issue.identifier
    title: issue.title
  actor:
    id: issue.assignee.id
    display_name: issue.assignee.displayName
    email: issue.assignee.email
    handle: issue.assignee.name
  env_time:
    created: issue.createdAt
    updated: issue.updatedAt
  url:
    href: issue.url

auth:
  required: true
  type: api_key
  key: "env:LINEAR_API_KEY"
  header: Authorization

providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 10
    config:
      base_url: https://api.linear.app
      path: /graphql
      method: POST
      headers:
        Content-Type: "application/json"
      body:
        # A lookup by key, never a text search's first hit (MIK-8706):
        # issue(id:) takes the UUID or the identifier, and a key no issue
        # has fails with "Entity not found" instead of returning another.
        query: >
          query GetIssue($id: String!) {
            issue(id: $id) {
              id identifier title description priority priorityLabel estimate
              state { id name type color }
              team { id name key }
              assignee { id name displayName email }
              labels { nodes { id name color } }
              project { id name }
              parent { id identifier title }
              children { nodes { id identifier title state { name } } }
              comments {
                nodes {
                  id body createdAt
                  user { id name displayName }
                  resolvedAt
                }
              }
              relations {
                nodes {
                  type
                  relatedIssue { id identifier title }
                }
              }
              createdAt updatedAt completedAt dueDate
              url
            }
          }
        variables:
          id: "{identifier}"
      response_path: data

cache:
  strategy: exact
  # ttl: 0 — a client claim protocol re-fetches the
  # issue immediately after posting a claim marker to verify it won.
  # A non-zero cache returns the stale pre-post state and breaks every
  # paired/pool dispatch with 'claim marker not visible after post'.
  ttl: 0

metadata:
  category: productivity
  tags: [linear, issue, detail, comments]
  cost_category: free
  execution_time: fast
  read_only: true
