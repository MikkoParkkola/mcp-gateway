sha256: 934e581aabd6edfdd1510ff572eeb07c3133ff4f48fff8c3093f6fd06ecb11d7
fulcrum: "1.0"
name: pact_contracts
description: >
  PACT contract-first multi-agent framework — validate, list, and manage component
  contracts for structured agent development. Supports budget tracking, retrospectives,
  and contract validation gates.
  [keywords: contract, testing, verification, agent, pact, validation]

schema:
  input:
    type: object
    properties:
      operation:
        type: string
        description: PACT operation to perform
        enum:
        - verify_contract
        - list_contracts
        - get_contract
        - check_budget
        - get_retrospective
        - validate_gate
        - resume_run
      component:
        type: string
        description: Component name (for get_contract operation)
      project_dir:
        type: string
        path_root: projects
        description: PACT project directory inside capabilities.files.projects
    required:
    - operation
    - project_dir
  output:
    type: object
    properties:
      status:
        type: string
        description: Operation status
      contracts:
        type: array
        description: List of contracts (for list_contracts)
      budget:
        type: object
        description: Budget summary (for check_budget)
      validation:
        type: object
        description: Validation result (for validate_gate)

providers:
  primary:
    service: mcp
    cost_per_call: 0
    timeout: 30
    config:
      command: pact-mcp
      transport: stdio
      tool_selector:
        param: operation
        tools:
          verify_contract:
            tool: pact_validate
            arguments:
              project_dir: '{project_dir}'
          validate_gate:
            tool: pact_validate
            arguments:
              project_dir: '{project_dir}'
          list_contracts:
            tool: pact_contracts
            arguments:
              project_dir: '{project_dir}'
          get_contract:
            tool: pact_contract
            requires:
            - component
            arguments:
              component_id: '{component}'
              project_dir: '{project_dir}'
          check_budget:
            tool: pact_budget
            arguments:
              project_dir: '{project_dir}'
          get_retrospective:
            tool: pact_retrospective
            arguments:
              project_dir: '{project_dir}'
          resume_run:
            tool: pact_resume
            arguments:
              project_dir: '{project_dir}'

auth:
  required: false
  description: "Install: pip install pact-agents[mcp]. No API key required."

cache:
  strategy: none

metadata:
  category: verification
  tags:
    - contract
    - testing
    - verification
    - agent
    - pact
    - validation
    - quality
  cost_category: free
  execution_time: medium
  read_only: false
  docs: https://github.com/jmcentire/pact
