sha256: b1f0435cb799569b9441ffa81d3d47ecac90ea31e99508ee9980c57d142ead9a
fulcrum: '1.0'
name: cloudflare_create_waf_rule
description: Add a rule to a zone ruleset (get its ID from cloudflare_get_waf_rules).
schema:
  input:
    type: object
    properties:
      zone_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: Cloudflare zone ID
      ruleset_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: Ruleset ID
      expression:
        type: string
        description: Rule expression (Cloudflare Rules language)
      action:
        type: string
        description: Action (block, challenge, managed_challenge, js_challenge, log, skip)
      description:
        type: string
        description: Rule description
      enabled:
        type: boolean
        description: Whether the rule is enabled
    required:
    - zone_id
    - ruleset_id
    - expression
    - action
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /zones/{zone_id}/rulesets/{ruleset_id}/rules
      method: POST
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
      body:
        expression: '{expression}'
        action: '{action}'
        description: '{description}'
        enabled: '{enabled}'
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.cloudflare.com/api/
