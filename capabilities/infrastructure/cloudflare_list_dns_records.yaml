sha256: af114b6cb073b0946fc99ed0ab67cfe52c7ea3bea82b1ce32296b2f0cb68b25a
fulcrum: '1.0'
name: cloudflare_list_dns_records
description: List DNS records in a Cloudflare zone.
schema:
  input:
    type: object
    properties:
      zone_id:
        type: string
        description: Cloudflare zone ID
      type:
        type: string
        description: Record type filter (A, AAAA, CNAME, TXT, MX, ...)
      name:
        type: string
        description: Record name filter
    required:
    - zone_id
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /zones/{zone_id}/dns_records
      method: GET
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
      params:
        type: '{type}'
        name: '{name}'
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.cloudflare.com/api/
