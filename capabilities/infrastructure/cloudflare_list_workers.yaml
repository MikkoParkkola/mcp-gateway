sha256: 6b8b341c5f7bbadc4cd2802ee96d245c5a0286409898151155046b22afd38f1b
fulcrum: '1.0'
name: cloudflare_list_workers
description: List Worker scripts in a Cloudflare account.
schema:
  input:
    type: object
    properties:
      account_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: Cloudflare account ID
    required:
    - account_id
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /accounts/{account_id}/workers/scripts
      method: GET
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.cloudflare.com/api/
