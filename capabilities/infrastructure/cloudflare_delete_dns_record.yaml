sha256: ef3dc1247b9836434b7547b760380bfc58a071224871d645dca9b7694838af15
fulcrum: '1.0'
name: cloudflare_delete_dns_record
description: Delete a DNS record from a Cloudflare zone.
schema:
  input:
    type: object
    properties:
      zone_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: Cloudflare zone ID
      dns_record_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: DNS record ID
    required:
    - zone_id
    - dns_record_id
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /zones/{zone_id}/dns_records/{dns_record_id}
      method: DELETE
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.cloudflare.com/api/
