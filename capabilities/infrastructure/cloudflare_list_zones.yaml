sha256: 4979227d69127f90afb454e9ea7e308bf6cf6a811ee4bae9b6780bffae2572c5
fulcrum: '1.0'
name: cloudflare_list_zones
description: List the zones (domains) the API token can see.
schema:
  input:
    type: object
    properties:
      name:
        type: string
        description: Filter by domain name
      page:
        type: integer
        description: Page number
      per_page:
        type: integer
        description: Results per page (max 50)
    required: []
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /zones
      method: GET
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
      params:
        name: '{name}'
        page: '{page}'
        per_page: '{per_page}'
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.cloudflare.com/api/
