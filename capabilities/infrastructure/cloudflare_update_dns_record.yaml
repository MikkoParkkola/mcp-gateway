sha256: ded5d70805d48816d9b0933324093cc7a9289f252d1e2df9bfd75cca8600f0ad
fulcrum: '1.0'
name: cloudflare_update_dns_record
description: Update fields of a DNS record (PATCH).
schema:
  input:
    type: object
    properties:
      zone_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: Cloudflare zone ID
      dns_record_id:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        description: DNS record ID
      type:
        type: string
        description: Record type
      name:
        type: string
        description: Record name
      content:
        type: string
        description: Record content
      ttl:
        type: integer
        description: TTL in seconds
      proxied:
        type: boolean
        description: Proxy through Cloudflare
      comment:
        type: string
        description: Comment
    required:
    - zone_id
    - dns_record_id
    anyOf:
    - required:
      - type
    - required:
      - name
    - required:
      - content
    - required:
      - ttl
    - required:
      - proxied
    - required:
      - comment
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /zones/{zone_id}/dns_records/{dns_record_id}
      method: PATCH
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
      body:
        type: '{type}'
        name: '{name}'
        content: '{content}'
        ttl: '{ttl}'
        proxied: '{proxied}'
        comment: '{comment}'
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.cloudflare.com/api/
