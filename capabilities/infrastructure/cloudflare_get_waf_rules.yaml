sha256: fee47ee03214796bd04053e2a615fff4d4f3ee1d29178240c59b8551e468a6c6
fulcrum: '1.0'
name: cloudflare_get_waf_rules
description: Read a zone's entry-point ruleset for a phase (WAF custom rules by default).
schema:
  input:
    type: object
    properties:
      zone_id:
        type: string
        description: Cloudflare zone ID
      ruleset_phase:
        type: string
        description: Ruleset phase
        default: http_request_firewall_custom
        enum:
        - http_request_firewall_custom
        - http_request_firewall_managed
        - http_ratelimit
    required:
    - zone_id
    - ruleset_phase
  output:
    type: object
    properties:
      success:
        type: boolean
      result: {}
providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 30
    config:
      base_url: https://api.cloudflare.com/client/v4
      path: /zones/{zone_id}/rulesets/phases/{ruleset_phase}/entrypoint
      method: GET
      headers:
        Authorization: Bearer {env.CLOUDFLARE_API_TOKEN}
        Content-Type: application/json
cache:
  strategy: none
  ttl: 0
auth:
  required: true
  type: bearer
  key: env:CLOUDFLARE_API_TOKEN
  header: Authorization
  prefix: Bearer
  description: Create an API token at https://dash.cloudflare.com/profile/api-tokens with the permissions
    this operation needs.
metadata:
  category: infrastructure
  tags:
  - cloudflare
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.cloudflare.com/api/
