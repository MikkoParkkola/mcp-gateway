sha256: f8efc7918c687a27cfc61c5a7ef84c79de4ea3842637a08af8ac6283a07fbb11
fulcrum: "1.0"
name: desktop_event_bus
description: >
  Desktop events from a Mac (app launch, activate and quit, window focus and creation,
  system notifications), delivered as MCP events that agents subscribe to with events/subscribe.
  Fed by a Hammerspoon script that signs each event; see docs/capabilities/desktop_event_bus.md.
  Electron DOM mutations over CDP and automation rules are not provided: no tool produces DOM
  events, and rules belong to the subscribing agent.
schema:
  input:
    type: object
    properties: {}
  output:
    type: object
providers: {}
webhooks:
  desktop_events:
    path: /desktop/events
    method: POST
    secret: "{env.DESKTOP_EVENT_SECRET}"
    signature_header: "X-Desktop-Signature"
    transform:
      event_type: "desktop.{app}.{kind}"
      data:
        app: "{app}"
        kind: "{kind}"
        title: "{title}"
        bundle_id: "{bundle_id}"
    event:
      description: "A desktop app or window event from a Mac"
      filters: [app, kind]
metadata:
  category: automation
  tags: [desktop, events, hammerspoon, macos, webhook]
  cost_category: free
  execution_time: instant
  read_only: true
