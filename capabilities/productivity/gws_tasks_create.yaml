sha256: 924ae35cebed7543b2f1a5d79ae814089c44667dc39490c3fd7bd65397c17444
fulcrum: "1.0"
name: gws_tasks_create
description: Create a new task in Google Tasks. Supports setting title, notes, due date, and parent task for subtasks.

schema:
  input:
    type: object
    properties:
      taskListId:
        type: string
        default: '@default'
        description: Task list ID
      title:
        type: string
        description: Task title
      notes:
        type: string
        description: Task notes/description
      due:
        type: string
        description: Due date (RFC3339, e.g., 2026-03-15T00:00:00Z)
      parent:
        type: string
        description: Parent task ID (to create as subtask)
    required:
    - title
  output:
    type: object
    properties:
      id:
        type: string
      title:
        type: string
      status:
        type: string
      selfLink:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - tasks
      - tasks
      - insert
      - json: --params=
        value:
          tasklist: '{taskListId}'
          parent: '{parent}'
      - json: --json=
        value:
          title: '{title}'
          notes: '{notes}'
          due: '{due}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/tasks

metadata:
  category: productivity
  tags:
    - google
    - tasks
    - todo
    - create
    - workspace
    - productivity
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/tasks/reference/rest/v1/tasks/insert
