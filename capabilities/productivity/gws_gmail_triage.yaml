sha256: f67ed77206155394d75ea1a39f706e9b522839cc7b1ccd8aafbc25d7fccbb211
fulcrum: "1.0"
name: gws_gmail_triage
description: Triage Gmail messages by modifying labels. Add or remove labels such as INBOX, UNREAD, STARRED, IMPORTANT, SPAM, TRASH.

schema:
  input:
    type: object
    properties:
      messageId:
        type: string
        description: Gmail message ID to modify
      addLabels:
        type: array
        items:
          type: string
        maxItems: 50
        description: Label IDs to add
      removeLabels:
        type: array
        items:
          type: string
        maxItems: 50
        description: Label IDs to remove
    required:
    - messageId
  output:
    type: object
    properties:
      id:
        type: string
      labelIds:
        type: array
        items:
          type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - gmail
      - users
      - messages
      - modify
      - json: --params=
        value:
          userId: me
          id: '{messageId}'
      - json: --json=
        value:
          addLabelIds: '{addLabels}'
          removeLabelIds: '{removeLabels}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.modify

metadata:
  category: productivity
  tags:
    - google
    - gmail
    - email
    - triage
    - labels
    - workspace
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/gmail/api/reference/rest/v1/users.messages/modify
