sha256: 8262729ea2616ef418dc935c1832a757965122d743077c38fb9514e8c803b2fe
fulcrum: "1.0"
name: gws_sheets_read
description: Read values from a Google Sheets spreadsheet range.

schema:
  input:
    type: object
    properties:
      spreadsheetId:
        type: string
        description: The spreadsheet ID (from the URL)
        examples:
          - "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms"
      range:
        type: string
        description: "A1 notation range (e.g., 'Sheet1!A1:C10')"
        examples:
          - "Sheet1!A1:Z100"
          - "A1:D50"
    required:
      - spreadsheetId
      - range
  output:
    type: object
    properties:
      values:
        type: array
        items:
          type: array
          items:
            type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - sheets
      - spreadsheets
      - values
      - get
      - json: --params=
        value:
          spreadsheetId: '{spreadsheetId}'
          range: '{range}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: ttl
  ttl: 30

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/spreadsheets.readonly

metadata:
  category: productivity
  tags:
    - google
    - sheets
    - spreadsheet
    - workspace
    - data
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.google.com/sheets/api/reference/rest/v4/spreadsheets.values/get
