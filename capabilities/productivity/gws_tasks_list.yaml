sha256: 725d92626ac0083a1d26d063c8c9f18f30a5e30b93ae96f287289b782394f4a0
fulcrum: "1.0"
name: gws_tasks_list
description: List tasks from a Google Tasks task list. Returns tasks with their status, due date, and notes.

schema:
  input:
    type: object
    properties:
      taskListId:
        type: string
        default: '@default'
        description: Task list ID
      maxResults:
        type: integer
        description: Maximum number of tasks to return
        default: 20
      showCompleted:
        type: boolean
        description: Whether to include completed tasks
        default: false
    required: []
  output:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            status:
              type: string
            due:
              type: string
            notes:
              type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - tasks
      - tasks
      - list
      - json: --params=
        value:
          tasklist: '{taskListId}'
          maxResults: '{maxResults}'
          showCompleted: '{showCompleted}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: ttl
  ttl: 30

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/tasks.readonly

metadata:
  category: productivity
  tags:
    - google
    - tasks
    - todo
    - workspace
    - productivity
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.google.com/tasks/reference/rest/v1/tasks/list
