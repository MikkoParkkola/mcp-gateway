sha256: 2cd6191e1c79b887b112b25f724f22a2ec389a43d84ed5de26d76efd45ab6551
fulcrum: "1.0"
name: gws_gmail_search
description: Search Gmail messages using Gmail search syntax. Returns message IDs and metadata.

schema:
  input:
    type: object
    properties:
      query:
        type: string
        description: "Gmail search query (same syntax as Gmail search bar)"
        examples:
          - "from:boss@company.com is:unread"
          - "subject:invoice after:2026/03/01"
          - "has:attachment filename:pdf"
      maxResults:
        type: integer
        description: Maximum number of messages to return
        default: 10
    required:
      - query
  output:
    type: object
    properties:
      messages:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            threadId:
              type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - gmail
      - users
      - messages
      - list
      - json: --params=
        value:
          userId: me
          q: '{query}'
          maxResults: '{maxResults}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: ttl
  ttl: 30

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.readonly

metadata:
  category: productivity
  tags:
    - google
    - gmail
    - email
    - workspace
    - search
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.google.com/gmail/api/reference/rest/v1/users.messages/list
