sha256: 335506bc42617df293150f178031eebf014c310e0d81bc651c7de4e4708306a5
fulcrum: "1.0"
name: gws_calendar_insert
description: Create a new Google Calendar event. Supports setting title, time range, attendees, location, and description.

schema:
  input:
    type: object
    properties:
      calendarId:
        type: string
        description: Calendar ID (use "primary" for the main calendar)
        default: primary
      summary:
        type: string
        description: Event title/summary
      startDateTime:
        type: string
        description: Event start time (RFC3339, e.g., 2026-03-12T09:00:00+02:00)
      endDateTime:
        type: string
        description: Event end time (RFC3339, e.g., 2026-03-12T10:00:00+02:00)
      description:
        type: string
        format: multiline
        description: Event description
      location:
        type: string
        description: Event location (address or room name)
      attendees:
        type: array
        items:
          type: string
          format: email
        maxItems: 50
        description: Attendee email addresses
    required:
    - summary
    - startDateTime
    - endDateTime
  output:
    type: object
    properties:
      id:
        type: string
      htmlLink:
        type: string
      status:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - calendar
      - +insert
      - arg: --calendar={calendarId}
        if: calendarId
      - --summary={summary}
      - --start={startDateTime}
      - --end={endDateTime}
      - arg: --description={description}
        if: description
      - arg: --location={location}
        if: location
      - each: attendees
        arg: --attendee={item}
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/calendar.events

metadata:
  category: productivity
  tags:
    - google
    - calendar
    - events
    - create
    - scheduling
    - workspace
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/calendar/api/v3/reference/events/insert
