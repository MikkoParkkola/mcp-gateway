sha256: 1cce0d19c5c09ff5933cc6f0f116a14a336a66042df495ed9e8fc8d68cd835be
fulcrum: "1.0"
name: gws_gmail_watch
description: Set up Gmail push notifications via Cloud Pub/Sub. Watches for changes to the mailbox and sends notifications to the specified topic.

schema:
  input:
    type: object
    properties:
      topicName:
        type: string
        description: Cloud Pub/Sub topic name (e.g., projects/myproject/topics/gmail-notifications)
        examples:
        - projects/my-project/topics/gmail-watch
      labelIds:
        type: array
        items:
          type: string
        maxItems: 50
        description: Label IDs to watch
    required:
    - topicName
  output:
    type: object
    properties:
      historyId:
        type: string
      expiration:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - gmail
      - users
      - watch
      - json: --params=
        value:
          userId: me
      - json: --json=
        value:
          topicName: '{topicName}'
          labelIds: '{labelIds}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.readonly

metadata:
  category: productivity
  tags:
    - google
    - gmail
    - email
    - watch
    - notifications
    - pubsub
    - workspace
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/gmail/api/reference/rest/v1/users/watch
