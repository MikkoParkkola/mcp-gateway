sha256: 801c20b1575cfaebf9d68ecc9638b9e71fc0de5ebd0fcd8c3bb2e832875f6087
fulcrum: "1.0"
name: gws_gmail_forward
description: Forward a Gmail message to another recipient. Forwards the specified message with optional additional body text.

schema:
  input:
    type: object
    properties:
      messageId:
        type: string
        description: Gmail message ID to forward
      to:
        type: string
        description: Recipient email address to forward to
        format: email
      body:
        type: string
        format: multiline
        description: Note above the forwarded message
    required:
    - messageId
    - to
  output:
    type: object
    properties:
      id:
        type: string
      threadId:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - gmail
      - +forward
      - --message-id={messageId}
      - --to={to}
      - arg: --body={body}
        if: body
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.modify

metadata:
  category: productivity
  tags:
    - google
    - gmail
    - email
    - forward
    - workspace
    - communication
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/gmail/api/reference/rest/v1/users.messages/send
