sha256: a62953ae3d5b1d53dfde65fd976e96bd2e4b5e5af11ed0d0d636421347984e3c
fulcrum: "1.0"
name: gws_docs_read
description: Read the content of a Google Docs document.

schema:
  input:
    type: object
    properties:
      documentId:
        type: string
        description: The document ID (from the URL)
        examples:
          - "1rtU1fRPS0bMqd9abMG_hc6K9OAI6soUy3Kh00toAgyk"
    required:
      - documentId
  output:
    type: object
    properties:
      title:
        type: string
      body:
        type: object

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - docs
      - documents
      - get
      - json: --params=
        value:
          documentId: '{documentId}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: ttl
  ttl: 60

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/documents.readonly

metadata:
  category: productivity
  tags:
    - google
    - docs
    - documents
    - workspace
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.google.com/docs/api/reference/rest/v1/documents/get
