sha256: 7781de5c07b2c81cc889c207827a0320ff6377a471cf279491b72b115a9f7506
fulcrum: "1.0"
name: gws_gmail_reply
description: Reply to a Gmail message within its existing thread. Sends a reply to the specified message.

schema:
  input:
    type: object
    properties:
      messageId:
        type: string
        description: Gmail message ID to reply to
      body:
        type: string
        format: multiline
        description: Reply body (plain text)
    required:
    - messageId
    - body
  output:
    type: object
    properties:
      id:
        type: string
      threadId:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - gmail
      - +reply
      - --message-id={messageId}
      - --body={body}
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.modify

metadata:
  category: productivity
  tags:
    - google
    - gmail
    - email
    - reply
    - workspace
    - communication
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/gmail/api/reference/rest/v1/users.messages/send
