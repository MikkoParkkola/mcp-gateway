sha256: b3e8f7bcfb3ed7ef498b9d08df0a9068bdf41c1c8770723061f4f97771e5cf40
fulcrum: "1.0"
name: gws_calendar_events
description: List upcoming Google Calendar events. Supports time range filtering and multiple calendars.

schema:
  input:
    type: object
    properties:
      calendarId:
        type: string
        default: primary
        description: Calendar ID ('primary' for the main calendar)
      maxResults:
        type: integer
        description: Maximum number of events to return
        default: 10
      timeMin:
        type: string
        description: Lower bound for event start time (RFC3339, e.g., 2026-03-11T00:00:00Z)
      timeMax:
        type: string
        description: Upper bound for event start time (RFC3339)
    required: []
  output:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            summary:
              type: string
            start:
              type: object
            end:
              type: object

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - calendar
      - events
      - list
      - json: --params=
        value:
          calendarId: '{calendarId}'
          maxResults: '{maxResults}'
          timeMin: '{timeMin}'
          timeMax: '{timeMax}'
          singleEvents: true
          orderBy: startTime
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: ttl
  ttl: 60

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/calendar.readonly

metadata:
  category: productivity
  tags:
    - google
    - calendar
    - events
    - workspace
    - scheduling
  cost_category: free
  execution_time: fast
  read_only: true
  docs: https://developers.google.com/calendar/api/v3/reference/events/list
