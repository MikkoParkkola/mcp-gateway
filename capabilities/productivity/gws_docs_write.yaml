sha256: 86eb7928316b6272a5fbe775ea946a5f172b41719349295e696a0502076f3b85
fulcrum: "1.0"
name: gws_docs_write
description: Create a new Google Docs document or write content to an existing one using batch update requests.

schema:
  input:
    type: object
    properties:
      documentId:
        type: string
        description: Existing document ID to update (omit to create new)
      text:
        type: string
        format: multiline
        description: Text to append to the document
    required:
    - documentId
    - text
  output:
    type: object
    properties:
      documentId:
        type: string
      title:
        type: string
      revisionId:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - docs
      - +write
      - --document={documentId}
      - --text={text}
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/documents

metadata:
  category: productivity
  tags:
    - google
    - docs
    - documents
    - write
    - create
    - workspace
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/docs/api/reference/rest/v1/documents/create
