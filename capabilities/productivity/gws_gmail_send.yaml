sha256: 23647c6a2f40066e362ca1c2fe7556a4c2ed04c8b0b12c4f9208ffc6dbe44fa2
fulcrum: "1.0"
name: gws_gmail_send
description: Send an email via Gmail. Composes and sends a new message with optional CC/BCC recipients.

schema:
  input:
    type: object
    properties:
      to:
        type: string
        description: Recipient email address
        format: email
      subject:
        type: string
        description: Email subject line
      body:
        type: string
        format: multiline
        description: Email body (plain text)
      cc:
        type: string
        description: CC recipients (comma-separated email addresses)
      bcc:
        type: string
        description: BCC recipients (comma-separated email addresses)
    required:
    - to
    - subject
    - body
  output:
    type: object
    properties:
      id:
        type: string
      threadId:
        type: string
      labelIds:
        type: array
        items:
          type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - gmail
      - +send
      - --to={to}
      - --subject={subject}
      - --body={body}
      - arg: --cc={cc}
        if: cc
      - arg: --bcc={bcc}
        if: bcc
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/gmail.send

metadata:
  category: productivity
  tags:
    - google
    - gmail
    - email
    - send
    - workspace
    - communication
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/gmail/api/reference/rest/v1/users.messages/send
