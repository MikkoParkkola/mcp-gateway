sha256: 3339e9db657886ff2f60a31f41a9afa650824718aee6233150f4f1521c9db7f8
fulcrum: "1.0"
name: gws_chat_send
description: Send a message in a Google Chat space. Posts a text message to the specified Chat space.

schema:
  input:
    type: object
    properties:
      spaceName:
        type: string
        description: Chat space resource name (e.g., spaces/AAAA1234)
        examples:
        - spaces/AAAA1234
      text:
        type: string
        format: multiline
        description: Message text (plain text)
      threadKey:
        type: string
        description: Thread key to reply within a specific thread (optional)
    required:
    - spaceName
    - text
  output:
    type: object
    properties:
      name:
        type: string
      text:
        type: string
      createTime:
        type: string
      thread:
        type: object
        properties:
          name:
            type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 15
    config:
      command: gws
      args:
      - chat
      - spaces
      - messages
      - create
      - json: --params=
        value:
          parent: '{spaceName}'
          messageReplyOption: REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD
      - json: --json=
        value:
          text: '{text}'
          thread:
            threadKey: '{threadKey}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/chat.messages.create

metadata:
  category: productivity
  tags:
    - google
    - chat
    - messaging
    - workspace
    - communication
  cost_category: free
  execution_time: fast
  read_only: false
  docs: https://developers.google.com/workspace/chat/api/reference/rest/v1/spaces.messages/create
