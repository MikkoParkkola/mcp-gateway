sha256: a19592a143ea4e4a7284a2792f8cf2e5d488b4e82dc713173f538fd742533a0c
fulcrum: "1.0"
name: gws_drive_upload
description: Upload a file to Google Drive. Supports setting the file name, parent folder, and MIME type.

schema:
  input:
    type: object
    properties:
      filePath:
        type: string
        path_root: uploads
        description: File to upload, inside capabilities.files.uploads
      name:
        type: string
        description: File name in Drive (defaults to local file name)
      parentId:
        type: string
        description: Parent folder ID in Drive (omit for root)
    required:
    - filePath
  output:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      mimeType:
        type: string
      webViewLink:
        type: string

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 60
    config:
      command: gws
      args:
      - drive
      - +upload
      - arg: --name={name}
        if: name
      - arg: --parent={parentId}
        if: parentId
      - --
      - '{filePath}'
      token_env: GOOGLE_WORKSPACE_CLI_TOKEN

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: oauth:google
  token_endpoint: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/drive.file

metadata:
  category: productivity
  tags:
    - google
    - drive
    - upload
    - files
    - workspace
    - storage
  cost_category: free
  execution_time: medium
  read_only: false
  docs: https://developers.google.com/drive/api/reference/rest/v3/files/create
