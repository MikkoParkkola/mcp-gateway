sha256: d00f00793af701542a89589521b434a19b9260e4fe667a092c58019c757b317c
fulcrum: "1.0"
name: gmail_save_attachment
description: Download a Gmail attachment and save it to disk. Fetches the attachment by message ID and attachment ID, base64-decodes the data, and writes it to the gateway's configured downloads directory (capabilities.files.downloads).

schema:
  input:
    type: object
    properties:
      message_id:
        type: string
        description: The ID of the message containing the attachment
      attachment_id:
        type: string
        description: The ID of the attachment (from message payload part body.attachmentId)
      filename:
        type: string
        description: Filename to save as (from message payload part filename field)
    required: [message_id, attachment_id, filename]
  output:
    type: object
    properties:
      saved_path:
        type: string
        description: Full path where the file was saved
      size:
        type: integer
        description: File size in bytes
      filename:
        type: string
        description: The filename that was saved

providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 60
    config:
      base_url: https://gmail.googleapis.com
      path: /gmail/v1/users/me/messages/{message_id}/attachments/{attachment_id}
      method: GET
      headers:
        Authorization: "Bearer {access_token}"
        Accept: "application/json"
      save_file:
        data: data
        encoding: base64url
        filename: "{filename}"
        max_bytes: 26214400

cache:
  strategy: none
  ttl: 0

auth:
  required: true
  type: oauth
  key: "oauth:google"
  token_endpoint: "https://oauth2.googleapis.com/token"
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly

metadata:
  category: google
  tags: [gmail, email, attachment, download, save, file, productivity]
  cost_category: free
  execution_time: medium
  read_only: false
  notes: |
    Writes through the declarative save_file step into capabilities.files.downloads;
    refuses when that directory is not configured. The file name is one validated
    path component; an existing file is never overwritten.
