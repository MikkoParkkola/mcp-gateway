sha256: dacd9daca3e157794c013dc045200522abbbb51e799192968a6d145adb43f14f
fulcrum: "1.0"
name: trawl_extract
description: (Held: not executable until trawl refuses private addresses at connect time, MIK-7788.) Structured web data extraction using LLM-derived CSS selectors. Extracts tables, lists, and repeating data from any webpage. Uses LLM once to derive strategy, then applies at speed. Self-healing when sites redesign.

schema:
  input:
    type: object
    properties:
      url:
        type: string
        description: URL of the page to extract data from
        egress: true
      fields:
        type: string
        description: "Comma-separated field names to extract (e.g., 'name, price, rating, url')"
      query:
        type: string
        description: "Optional: target a specific section of the page (e.g., 'Market Share' or 'Leaderboard')"
      format:
        type: string
        description: Output format
        default: json
        enum: [json, jsonl, csv]
      wait:
        type: string
        description: "Extra wait time after DOM stabilization (e.g., '5s')"
    required:
      - url
      - fields

providers:
  primary:
    service: cli
    cost_per_call: 1
    timeout: 60
    config:
      command: "trawl"
      args:
        - "--fields={fields}"
        - arg: "--query={query}"
          if: query
        - "--format={format}"
        - arg: "--wait={wait}"
          if: wait
        - "--"
        - "{url}"

metadata:
  read_only: true
  cost_tier: 1
  rate_limit: 60
  timeout: 60s
  tags:
    - search
    - extraction
    - scraping
    - structured-data
  examples:
    - description: "Extract product data from e-commerce page"
      input:
        url: "https://example.com/products"
        fields: "name, price, rating"
