fulcrum: "1.0"
name: weather
description: >-
  Get current weather and a daily forecast for a latitude and longitude, using
  the Open-Meteo API (free, no API key required). To look up a place by name,
  call geocode first, then pass its latitude and longitude here. Paced at one
  request per 250 ms per gateway process. The free tier is non-commercial;
  commercial use needs an Open-Meteo plan.
attribution: "Data by Open-Meteo.com (CC BY 4.0)"

schema:
  input:
    type: object
    properties:
      latitude:
        type: number
        minimum: -90
        maximum: 90
        description: Latitude coordinate (e.g., 60.17 for Helsinki)
      longitude:
        type: number
        minimum: -180
        maximum: 180
        description: Longitude coordinate (e.g., 24.94 for Helsinki)
      forecast_days:
        type: integer
        minimum: 1
        maximum: 16
        description: "Number of forecast days (1-16; Open-Meteo sends 7 when left out)"
      hourly:
        type: boolean
        description: "Include hourly forecast (default: false)"
    required: [latitude, longitude]
  output:
    type: object
    additionalProperties: true
    properties:
      latitude:
        type: number
      longitude:
        type: number
      timezone:
        type: string
      elevation:
        type: number
      current:
        type: object
        description: The requested current variables, with time and interval
      current_units:
        type: object
      daily:
        type: object
        description: >-
          Parallel arrays, one entry per day: time, temperature_2m_max,
          temperature_2m_min, precipitation_sum, weather_code, sunrise, sunset
      daily_units:
        type: object
      attribution:
        type: string

providers:
  primary:
    service: open_meteo
    cost_per_call: 0.0
    timeout: 30
    rate_limit:
      interval_ms: 250
    config:
      endpoint: https://api.open-meteo.com/v1/forecast
      method: GET
      headers:
        User-Agent: "mcp-gateway/4.0 (+https://github.com/MikkoParkkola/mcp-gateway)"
      params:
        latitude: "{latitude}"
        longitude: "{longitude}"
        forecast_days: "{forecast_days}"
      static_params:
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m"
        daily: "temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code,sunrise,sunset"
        timezone: "auto"

cache:
  strategy: exact
  ttl: 900  # 15 min - weather updates frequently

auth:
  required: false

metadata:
  category: utility
  tags: [weather, forecast, climate, temperature, utility]
  cost_category: free
  execution_time: fast
  read_only: true
