sha256: 4a2d26b4a60ef028b6f07d01378e24aba1b54c237e333f60ef121cfa9578e70c
fulcrum: "1.0"
name: sentry_get_issue
description: |
  Get one Sentry issue (sentry.io, US region): title, culprit, status, counts,
  first and last seen. Use sentry_list_issues to find the issue ID.

schema:
  input:
    type: object
    properties:
      organization:
        type: string
        description: Sentry organization slug
        pattern: "^[a-z0-9][a-z0-9_-]*$"
      issue_id:
        type: string
        description: "Issue ID, the digits Sentry shows. A string, because IDs can exceed what a JSON number holds exactly"
        pattern: "^[0-9]+$"
    required:
      - organization
      - issue_id
  output:
    type: object

providers:
  primary:
    service: rest
    cost_per_call: 0
    timeout: 20
    config:
      base_url: https://sentry.io
      path: /api/0/organizations/{organization}/issues/{issue_id}/
      method: GET

cache:
  strategy: exact
  ttl: 60

auth:
  required: true
  type: bearer
  key: "env:SENTRY_AUTH_TOKEN"
  description: >
    Create a user auth token with event:read at
    https://sentry.io/settings/account/api/auth-tokens/ and set
    SENTRY_AUTH_TOKEN. EU-region organizations (de.sentry.io) are not covered.

metadata:
  category: observability
  tags: [sentry, errors, issues, observability]
  cost_category: free
  execution_time: fast
  read_only: true
  chains_with: [sentry_list_issues]
  docs: https://docs.sentry.io/api/events/retrieve-an-issue/
