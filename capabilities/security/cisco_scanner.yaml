sha256: e351e78eeb148aade05ced970dfe55ac71fc9d77f4bc07a2f94a37db9e812629
fulcrum: "1.0"
name: cisco_scanner
description: Scan an agent skill package for security issues with Cisco's skill-scanner (static analyzers
  only; nothing leaves the machine). Scanning a remote MCP server is held until mcp-scanner refuses private
  addresses at connect time (MIK-7788).

schema:
  input:
    type: object
    properties:
      operation:
        type: string
        enum:
        - scan_skill_file
        description: Scan operation
      target:
        type: string
        path_root: projects
        description: Skill package directory, inside capabilities.files.projects
    required:
    - operation
    - target
  output:
    type: object
    properties:
      findings:
        type: array
        description: Vulnerability findings
        items:
          type: object
          properties:
            severity:
              type: string
              enum:
              - critical
              - high
              - medium
              - low
              - info
            rule_id:
              type: string
            description:
              type: string
            location:
              type: string
            remediation:
              type: string
      summary:
        type: object
        properties:
          total_findings:
            type: integer
          critical:
            type: integer
          high:
            type: integer
          pass:
            type: boolean

providers:
  primary:
    service: cli
    cost_per_call: 0
    timeout: 120
    config:
      command: skill-scanner
      args:
      - scan
      - --format=json
      - --
      - '{target}'

auth:
  required: false
  description: 'Install: pip install cisco-ai-skill-scanner (https://github.com/cisco-ai-defense/skill-scanner).'

cache:
  strategy: none

metadata:
  category: security
  tags:
    - security
    - scanner
    - vulnerability
    - audit
    - cisco
    - mcp
    - compliance
  cost_category: free
  execution_time: slow
  read_only: true
  docs: https://github.com/cisco-ai-defense/skill-scanner
