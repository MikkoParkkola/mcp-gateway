sha256: f9633fe4d12ed33c32e92112a6f4b3c25c2a26cfca505dff34137773504eb28a
fulcrum: "1.0"
name: pyghidra_reverse
description: >
  PyGhidra MCP server for binary reverse engineering: import a binary and wait for
  its analysis, then decompile functions, list cross-references, search symbols and
  strings, list imports and exports, and build call graphs. Import and analysis can take
  minutes; call it as a task. Read operations never modify the project.
  [keywords: binary, reverse-engineering, decompile, disassemble, ghidra, security, malware]

schema:
  input:
    type: object
    properties:
      operation:
        type: string
        description: >
          import (needs binary_path, waits for analysis), analysis_status (binary_path;
          keeps waiting after an import ran out of time), list_binaries, metadata
          (binary_name), decompile (binary_name, function_name), xrefs (binary_name,
          function_name), search_symbols (binary_name, query), search_strings
          (binary_name, query), imports (binary_name), exports (binary_name),
          callgraph (binary_name, function_name)
        enum:
          - import
          - analysis_status
          - list_binaries
          - metadata
          - decompile
          - xrefs
          - search_symbols
          - search_strings
          - imports
          - exports
          - callgraph
      binary_path:
        type: string
        path_root: uploads
        description: Binary to import, inside capabilities.files.uploads
      binary_name:
        type: string
        description: Program name in the Ghidra project (the import result names it)
      function_name:
        type: string
        description: Function name or address
      query:
        type: string
        description: Search pattern (regex or substring)
    required:
      - operation
  output:
    type: object

providers:
  primary:
    service: mcp
    cost_per_call: 0
    timeout: 300
    config:
      command: pyghidra-mcp
      transport: stdio
      env:
        - GHIDRA_INSTALL_DIR
        - JAVA_HOME
      tool_selector:
        param: operation
        tools:
          import:
            tool: import_binary
            requires:
              - binary_path
            arguments:
              binary_path: '{binary_path}'
            wait:
              tool: list_project_binaries
              until:
                array: programs
                match:
                  file_path: '{binary_path}'
                field: analysis_complete
                equals: true
              interval_ms: 2000
              max_wait_s: 240
          analysis_status:
            tool: list_project_binaries
            requires:
              - binary_path
            wait:
              tool: list_project_binaries
              until:
                array: programs
                match:
                  file_path: '{binary_path}'
                field: analysis_complete
                equals: true
              interval_ms: 2000
              max_wait_s: 240
          list_binaries:
            tool: list_project_binaries
          metadata:
            tool: list_project_binary_metadata
            requires:
              - binary_name
            arguments:
              binary_name: '{binary_name}'
          decompile:
            tool: decompile_function
            requires:
              - binary_name
              - function_name
            arguments:
              binary_name: '{binary_name}'
              name_or_address: '{function_name}'
          xrefs:
            tool: list_xrefs
            requires:
              - binary_name
              - function_name
            arguments:
              binary_name: '{binary_name}'
              name_or_address: '{function_name}'
          search_symbols:
            tool: search_symbols_by_name
            requires:
              - binary_name
              - query
            arguments:
              binary_name: '{binary_name}'
              query: '{query}'
          search_strings:
            tool: search_strings
            requires:
              - binary_name
              - query
            arguments:
              binary_name: '{binary_name}'
              query: '{query}'
          imports:
            tool: list_imports
            requires:
              - binary_name
            arguments:
              binary_name: '{binary_name}'
          exports:
            tool: list_exports
            requires:
              - binary_name
            arguments:
              binary_name: '{binary_name}'
          callgraph:
            tool: gen_callgraph
            requires:
              - binary_name
              - function_name
            arguments:
              binary_name: '{binary_name}'
              function_name: '{function_name}'

auth:
  required: false
  description: >
    Install: pip install pyghidra-mcp
    Requires a Ghidra installation (set GHIDRA_INSTALL_DIR) and a JDK (JAVA_HOME).

cache:
  strategy: none
  ttl: 0

metadata:
  category: security
  tags:
    - binary
    - reverse-engineering
    - decompile
    - disassemble
    - ghidra
    - security
    - malware
    - forensics
  cost_category: free
  execution_time: slow
  read_only: false
  destructive: false
  docs: https://github.com/clearbluejar/pyghidra-mcp
