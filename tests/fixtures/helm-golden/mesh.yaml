apiVersion: v1
kind: ServiceAccount
metadata:
  name: t-mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
automountServiceAccountToken: false

---
# Source: mcp-gateway/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: t-mcp-gateway-config
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
data:
  gateway.yaml: |
    backends: {}
    security:
      firewall:
        enabled: true
        scan_requests: true
        scan_responses: true
    server:
      allow_unauthenticated_network_bind: true
      host: 0.0.0.0
      port: 39400
      public_url: http://t-mcp-gateway.default.svc.cluster.local:39400
      replicas: 1

