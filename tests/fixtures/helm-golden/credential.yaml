---
# Source: mcp-gateway/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t-mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/instance: t
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 39400

---
# Source: mcp-gateway/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t-mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
automountServiceAccountToken: false

---
# Source: mcp-gateway/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: t-mcp-gateway-config
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
data:
  gateway.yaml: |
    auth:
      bearer_token: env:MCP_GATEWAY_TOKEN
      enabled: true
      public_paths:
      - /health
    backends: {}
    security:
      firewall:
        enabled: true
        scan_requests: true
        scan_responses: true
      transparency_log:
        enabled: true
        path: /var/lib/mcp-gateway/audit/transparency.jsonl
        rotation:
          max_segment_bytes: 67108864
          on_disk_full: expire_oldest
          retain_segments: 12
    server:
      cleartext_http: cluster_internal
      host: 0.0.0.0
      port: 39400
      public_url: http://t-mcp-gateway.default.svc.cluster.local:39400
      replicas: 1

---
# Source: mcp-gateway/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: t-mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
  ports:
    - name: http
      protocol: TCP
      port: 39400
      targetPort: http

---
# Source: mcp-gateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t-mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/instance: t
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mcp-gateway-enterprise
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
      app.kubernetes.io/instance: t
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/instance: t
    spec:
      serviceAccountName: t-mcp-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image declares `USER gateway`, a name the kubelet cannot verify
        # as non-root, so the pod is refused (CreateContainerConfigError)
        # unless the UID is numeric here. 1001 is the image's gateway user.
        # fsGroup is also how the gateway reads its root-owned config projection,
        # which it refuses when a world bit is set (CONFIG.2).
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "ghcr.io/mikkoparkkola/mcp-gateway:4.0.0"
          imagePullPolicy: IfNotPresent
          # No `serve`: --host/--port are top-level flags and the subcommand
          # takes only --stdio, so `serve --host` exits 2 before reading config.
          args:
            - "--config"
            - "/etc/mcp-gateway/gateway.yaml"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "39400"
          ports:
            - name: http
              containerPort: 39400
              protocol: TCP
          env:
            # Every `~` writer (task store, gateway data dir, upgrade stamp, npm/uv
            # caches) lands on the writable `state` volume; the root FS is read-only.
            - name: HOME
              value: "/var/lib/mcp-gateway"
            - name: MCP_GATEWAY_LOG_FORMAT
              value: "json"
            - name: MCP_GATEWAY_LOG_LEVEL
              value: "info"
            # The config references env:MCP_GATEWAY_TOKEN. A missing value fails
            # validation at startup rather than serving without one, so an
            # install that forgets the Secret stops instead of opening.
            - name: MCP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "mcp-gateway-auth"
                  key: "token"
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway
              readOnly: true
            - name: state
              mountPath: /var/lib/mcp-gateway
            # Credential mode turns auth on, and auth on requires the audit
            # log (UPGRADING-4.0): the ConfigMap points it here.
            - name: audit
              mountPath: /var/lib/mcp-gateway/audit
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: t-mcp-gateway-config
            defaultMode: 288
        # Pod-lifetime state under HOME: it survives a container restart, and a
        # replaced pod (rollout, eviction, reschedule) starts empty, task records included.
        - name: state
          emptyDir:
            sizeLimit: 1Gi
        # An emptyDir log dies with the pod; set audit.existingClaim to keep it.
        # fsGroup above makes the claim writable by uid 1001.
        - name: audit
          emptyDir:
            sizeLimit: 1Gi
