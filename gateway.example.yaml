env_files: []
server:
  host: 127.0.0.1
  port: 39401
auth:
  enabled: false
  bearer_token: null
  api_keys: []
  public_paths:
  - /health
meta_mcp:
  enabled: true
  warm_start: []
  surfaced_tools: []
  # Which of the gateway's own meta-tools this gateway lists and accepts.
  # Empty (the default) exposes all of them: the gateway bands its own surface at
  # 9 to 17, listing the webhook, stats, cost, playbook, profile and
  # config-reload tools only when the thing they report on is attached. A non-empty list is an allow-list, applied
  # by one predicate to
  # both `tools/list` and `tools/call`, so a hidden tool is also uncallable.
  # Backend tools reached through `gateway_invoke` are unaffected.
  # A minimal routing surface -- discover and call, no gateway management:
  #   exposed_meta_tools:
  #     - gateway_list_servers
  #     - gateway_search_tools
  #     - gateway_invoke
  # These are classic-surface names; a Code Mode gateway serves gateway_search
  # and gateway_execute instead, and the same filter applies to them.
  # Omitting gateway_invoke leaves backend tools reachable only through
  # surfaced_tools; the gateway logs a warning at startup rather than failing,
  # because a surface built only of surfaced_tools is a legitimate deployment.
  exposed_meta_tools: []
streaming:
  enabled: true
  auto_subscribe: []
failsafe:
  circuit_breaker:
    enabled: true
  retry:
    enabled: true
  rate_limit:
    enabled: true
  health_check:
    enabled: true
backends:
  # `command` uses host-platform parsing (POSIX shlex on unix; CommandLineToArgvW
  # on Windows). Quote paths that contain spaces.
  gitnexus:
    description: Codebase knowledge graph — impact analysis, blast radius, call chains, clusters, execution flows. 16 MCP tools.
    enabled: true
    command: gitnexus mcp
    cwd: null
    timeout: 30s
    env: {}
    headers: {}
    oauth: null
    secrets: []
    passthrough: false
  trvl:
    description: Travel search - flights and hotels via Google (inspired by fli)
    enabled: true
    command: /path/to/trvl/bin/trvl mcp
    cwd: null
    timeout: 30s
    env: {}
    headers: {}
    oauth: null
    secrets: []
    passthrough: false
  superhuman_mail:
    description: Superhuman Mail MCP — inbox + calendar via mcp-remote OAuth bridge to mcp.mail.superhuman.com. Tools — query_email_and_calendar (NL), list_threads (structured filters), get_thread, get_read_statuses, get_availability. First run triggers OAuth flow in browser. Requires Superhuman Business plan or higher with Ask AI enabled. MIT npm package @superhuman/mcp-mail v1.0.2.
    enabled: true
    command: npx -y @superhuman/mcp-mail
    cwd: null
    timeout: 60s
    env: {}
    headers: {}
    oauth: null
    secrets: []
    passthrough: false
capabilities:
  enabled: true
  directories:
  - ./capabilities
  # Capability calls ignore HTTP(S)_PROXY. To send them through a proxy, name
  # it here; the proxy then resolves (and must police) destination names.
  # egress_proxy: http://proxy.internal:3128
cache:
  enabled: true
playbooks:
  enabled: false
  directories:
  - playbooks
security:
  sanitize_input: true
  ssrf_protection: true
  tool_policy:
    enabled: true
    default_action: allow
    allow: []
    deny: []
    use_default_deny: true
    log_denied: true
  firewall:
    enabled: true
    scan_requests: true
    scan_responses: true
    prompt_injection_detection: true
    credential_redaction: true
    anomaly_detection: false
    audit_log: null
    rules: []
webhooks:
  enabled: true
  base_path: /webhooks
  require_signature: true
routing_profiles: {}
default_routing_profile: default
code_mode:
  enabled: false
mtls:
  enabled: false
  server_cert: ''
  server_key: ''
  ca_cert: ''
  require_client_cert: false
  crl_path: null
  policies: []
key_server:
  enabled: false
  oidc: []
  policies: []
  admin_token: null
agent_auth:
  enabled: false
  agents: []
cost_governance:
  enabled: false
  budgets:
    daily: null
    per_tool: {}
    per_key: {}
  alerts:
  - at_percent: 50
    action: log
  - at_percent: 80
    action: notify
  - at_percent: 100
    action: block
  tool_costs: {}
  default_cost: 0.0
  alternatives: null
