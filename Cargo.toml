[package]
name = "mcp-gateway"
version = "4.0.0-beta.3"
edition = "2024"
rust-version = "1.95"
authors = ["Mikko Parkkola <mikko.parkkola@iki.fi>"]
description = "MCP gateway and Model Context Protocol proxy: connect unlimited MCP servers, tools and REST APIs to an AI client at a fixed context cost, with on-demand tool discovery and MCP revision bridging"
license = "PolyForm-Noncommercial-1.0.0"
homepage = "https://github.com/MikkoParkkola/mcp-gateway"
repository = "https://github.com/MikkoParkkola/mcp-gateway"
documentation = "https://docs.rs/mcp-gateway"
readme = "README.md"
keywords = ["mcp", "mcp-gateway", "model-context", "proxy", "ai-agents"]
categories = ["command-line-utilities", "network-programming", "web-programming"]
# Keep the published crate focused on build/runtime assets and the fixtures
# needed by package verification tests.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "LICENSE-MIT",
    "LICENSE-NONCOMMERCIAL",
    "LICENSES.md",
    "NOTICE.md",
    "COMMERCIAL.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "llms.txt",
    "demo.tape",
    "src/**",
    "tests/**",
    "benches/**",
    "benchmarks/public_claims.json",
    "benchmarks/discovery_response_fixture.json",
    "benchmarks/token_savings.py",
    "benchmarks/live_agent_mcp_server.py",
    "benchmarks/live_agent_tool_selection.py",
    "benchmarks/results/mik-6977-live-agent-2026-09-04.json",
    "capabilities/**",
    "examples/**",
    "docs/ARCHITECTURE.md",
    "docs/BENCHMARKS.md",
    "docs/COMMUNITY_REGISTRY.md",
    "docs/QUICKSTART.md",
    "ARCHITECTURE.md",
    "codebase-map.md",
    "docs/blog/security-aware-mcp-gateway.md",
    "docs/design/RFC-0081-intelligent-tool-surfacing.md",
    "docs/design/surface-4.0.md",
    "docs/legal/dependency-licenses.tsv",
    "CLAUDE.md",
    "homebrew/mcp-gateway.rb",
    "npm/package.json",
    ".github/workflows/release.yml",
    # Read by the tests, at compile or run time. The package-tests job
    # builds the tests from the packaged crate and packaged-suite.yml runs
    # them, so a file missing here fails there. Exact paths, no globs.
    ".gitignore",
    "benchmarks/ranking-baseline/corpus.json",
    "benchmarks/ranking-baseline/results.json",
    "deploy/helm/mcp-gateway/templates/configmap.yaml",
    "deploy/helm/mcp-gateway/templates/deployment.yaml",
    "deploy/helm/mcp-gateway/values.schema.json",
    "deploy/helm/mcp-gateway/values.yaml",
    "deploy/kubernetes/enterprise-alpha/base/configmap.yaml",
    "deploy/kubernetes/enterprise-alpha/base/deployment.yaml",
    "deploy/kubernetes/enterprise-alpha/base/example-gateway.yaml",
    "deploy/kubernetes/enterprise-alpha/base/networkpolicy.yaml",
    "deploy/kubernetes/enterprise-alpha/base/rbac.yaml",
    "deploy/kubernetes/enterprise-alpha/base/service.yaml",
    "deploy/kubernetes/enterprise-alpha/crds/mcpgateway.io.yaml",
    "deploy/kubernetes/enterprise-alpha/scripts/kind-smoke.sh",
    "deploy/kubernetes/enterprise-alpha/scripts/preflight.sh",
    "deploy/kubernetes/enterprise-alpha/scripts/server-dry-run.sh",
    "deploy/kubernetes/enterprise-alpha/values.enterprise.example.yaml",
    "deploy/single-node/docker-compose.yaml",
    "Dockerfile",
    "docs/CLIENTS.md",
    "docs/DEPLOYMENT.md",
    "docs/identity_grants.md",
    "docs/MULTI_USER.md",
    "docs/release/4.0.0-beta.2-notes.md",
    "docs/release/4.0.0-beta.3-notes.md",
    "docs/release/v4.0.0-supported-matrix.md",
    "docs/release/verify/2026-09-23-claude-code-2.1.280.md",
    "docs/requirements/2026-09-09-nfr-sec3-key-rotation-test-plan.md",
    "docs/requirements/nfr-sec1-control-inventory.md",
    "docs/requirements/RELEASE-4.0.0-conformance-matrix.md",
    "docs/requirements/RELEASE-4.0.0-criteria-status.md",
    "docs/requirements/RELEASE-4.0.0-operator-decisions.md",
    "docs/requirements/RELEASE-4.0.0-performance-contract.md",
    "docs/requirements/RELEASE-4.0.0-performance-releaseline-2026-09-15.md",
    "docs/requirements/RELEASE-4.0.0-performance.md",
    "docs/requirements/RELEASE-4.0.0-requirements.md",
    "docs/requirements/RELEASE-4.0.0-scope-decisions-2026-09-06.md",
    "docs/requirements/RELEASE-4.0.0-scope-status.json",
    "docs/requirements/RELEASE-4.0.0-scope-tests.md",
    "docs/requirements/RELEASE-4.0.0-scope-update.md",
    "docs/requirements/RELEASE-4.0.0-test-plan.md",
    "docs/requirements/RELEASE-4.0.0-workload-contract.md",
    "docs/requirements/workload-pins-observed.md",
    "docs/roadmap/trust-fabric.md",
    "docs/runbooks/backup-restore-and-keys.md",
    "docs/runtime/descriptor_spec.md",
    "docs/runtime/divergence_registry.md",
    "docs/runtime/substrate_mapping.md",
    "docs/SHADOW_SCAN.md",
    "docs/TEAM_DEPLOYMENT.md",
    "docs/trustcard.md",
    "docs/UPGRADING-4.0.md",
    # The one glob here: pending UPGRADING entries are one file per PR and
    # leave at release preparation, so no exact path can name them (MIK-8185).
    "upgrading.d/*.md",
    "gateway.example.yaml",
    "scripts/release/nfr_upgrade_1_rehearsal.sh",
    "scripts/release/upgrading-startup-grammar.json",
    "server.json",
]

[workspace]
members = [
    "crates/gateway-core",
]
resolver = "2"


[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full", "tracing"] }

# HTTP server/client
axum = { version = "0.8", features = ["tracing", "http2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form", "query", "gzip", "deflate", "brotli"] }
tower = { version = "0.5", features = ["timeout", "limit", "load-shed", "retry"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "compression-gzip", "request-id", "catch-panic"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# raw_value: the reply classifier captures a backend `error` member as sent
# (MIK-8263); axum already enables it, this states the dependency.
serde_json = { version = "1.0", features = ["raw_value"] }
serde_json_canonicalizer = "0.3.2"
serde_yaml = "0.9"
# Collects the config keys serde skipped, so an unrecognised key is a load
# error (C1) without a strict attribute on every config struct.
serde_ignored = "0.1.14"

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "fmt"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async utilities
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["codec", "io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

# Rate limiting & backoff
governor = "0.10"
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep"] }

# Utilities
regex = "1.11"
url = "2.5"
# NFC normalization for collusion fingerprints; already in the tree via idna
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
uuid = { version = "1.23", features = ["v4", "fast-rng"] }
chrono = { version = "0.4.45", features = ["serde"] }
# IANA zones for `schedule.tick` cron expressions (MIK-7720)
chrono-tz = "0.10.4"
dashmap = "6.2"
parking_lot = "0.12"
bytes = "1.11.1"
pin-project-lite = "0.2"
shlex = "2.0"

# OAuth / Crypto
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
dirs = "7.0"
hmac = "0.13"
hkdf = "0.13"
hex = "0.4"
ring = "0.17"
# Key Server: OIDC JWT verification
# aws_lc_rs backend avoids the rsa crate (RUSTSEC-2023-0071 Marvin Attack)
jsonwebtoken = { version = "11.0", features = ["use_pem", "aws_lc_rs"] }
# Constant-time comparison (prevent timing attacks in admin token check)
subtle = "2.6"
# OS advisory file locking for the control-plane store's cross-process
# read-modify-write (MIK-6685). Already a transitive dep (tempfile, clap →
# terminal_size); promoted to direct with the `fs` feature — no new crate is
# compiled, only a manifest entry (verified via `cargo tree`).
# `process` gives geteuid for the CONFIG.2 config/env-file mode check.
rustix = { version = "1.1", features = ["fs", "process"] }
# Process-tree ownership for capability children (MIK-7782): a Unix process
# group and a Windows Job object behind a safe API, so a timed-out or cancelled
# call never leaves a grandchild (the gws npm entry is a node wrapper). Keeps
# ADR-016's single unsafe module: the FFI lives in this crate, not ours.
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }

# mTLS / TLS
# PQC hardening (issue #116): tls12 feature removed — TLS 1.3 is the enforced minimum.
# aws_lc_rs provider is consistent with jsonwebtoken's aws_lc_rs backend and avoids
# the RUSTSEC-2023-0071 Marvin Attack present in the rsa crate used by the ring backend.
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
time = { version = "0.3.47", default-features = false }
x509-parser = "0.18"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio-rustls = "0.26"

# XML parsing (for APIs that return XML, e.g. ECB exchange rates)
quick-xml = "0.42"

# Environment file loading
dotenvy = "0.15"

# File watching (hot-reload)
notify = "8.0"
walkdir = "2.5"

# Glob pattern matching for firewall rules (RFC-0071)
glob = "0.3"

# Metrics
telemetry_metrics = { package = "metrics", version = "0.24" }
metrics-exporter-prometheus = { version = "0.18", optional = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
mimalloc = { version = "0.1.52", default-features = false }

# ADR-016: the Win32 security calls behind owner-only stores on Windows, used only
# by `src/win_acl.rs`. Already in the lock file through mio, socket2 and others;
# promoted to direct so the features below are requested explicitly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
# `test-util` for `start_paused`: the list-drain budget cell (MIK 7570).
tokio = { version = "1.52", features = ["test-util"] }
tokio-test = "0.4"
pretty_assertions = "1.4"
tempfile = "3.14"
# F17-T10c: bridge tungstenite's `log` records into a scoped test subscriber.
tracing-log = "=0.2.0"
log = "=0.4.34"
serde_urlencoded = "0.7"
criterion = { version = "0.8", features = ["html_reports"] }
jsonschema = { version = "0.56.0", default-features = false }

[features]
default = ["a2a", "webui", "config-export", "cost-governance", "firewall", "discovery", "semantic-search", "tool-profiles", "metrics"]
## A2A (Agent2Agent) transport — proxy A2A agents as MCP backends.
## No new dependencies: reqwest, serde, serde_json, tokio already present.
a2a = []
webui = []
config-export = []
cost-governance = []
firewall = []
discovery = []
semantic-search = []
tool-profiles = []
metrics = ["dep:metrics-exporter-prometheus"]
## Opt-in preview of draft MCP spec extensions (SEP-1821, SEP-1862).
## NOT included in default — operators must explicitly enable.
spec-preview = []
## External pinned SDK/Redis acceptance journey; run by the dedicated CI gate.
task-sdk-recovery = []

## Dual-substrate OCI runtime abstraction (MIK-5226, B4-PLATFORM).
## Gates the dormant descriptor->substrate compiler behind an explicit opt-in:
## enables the `runtime compile` CLI subcommand and the hardened provisioning
## call path (src/runtime/provision.rs). NOT in default — foundation code.
runtime-substrate = []

[[bin]]
name = "mcp-gateway"
path = "src/main.rs"

[[test]]
name = "cli_surface_inventory"
path = "tests/cli_surface_inventory.rs"
# Every feature that gates a CLI subcommand, so the table is checked whole.
required-features = ["runtime-substrate", "config-export", "discovery"]

[[test]]
name = "task_upstream_recovery_sdk"
path = "tests/task_upstream_recovery_sdk.rs"
required-features = ["task-sdk-recovery"]

[[bench]]
name = "gateway_benchmarks"
harness = false

[profile.dev]
debug = 0               # No debug symbols — biggest size saver (~50%)
strip = true            # Strip remaining metadata

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_async = "allow"
# Stylistic only — Duration::from_secs(60) reads fine; new in Rust 1.95.
# Mechanically rewriting 50+ call sites risks subtle semantic confusion
# (e.g. 3600 read as "an hour" vs "60 minutes" vs "magic number").
duration_suboptimal_units = "allow"
# New in Rust 1.99. The suggested `assert_eq!(x, [] as [T; 0])` names a type
# for an empty slice and reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
