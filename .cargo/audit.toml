# cargo-audit configuration, read by the CI "Dependency audit" job (bare
# `cargo audit`, .github/workflows/ci.yml).
#
# cargo-audit ignores have no expiry, so every id here must also carry a dated
# [[IgnoredVulns]] entry in .github/osv-scanner.toml; the audit job runs
# scripts/ci/check_advisory_exceptions.py first, which fails once that date
# passes and holds the patched floors the ignore relies on (MIK-8577).

[advisories]
# RUSTSEC-2026-0381 was ignored here until its OSV record (modified
# 2026-10-21) marked webpki-roots 0.26.11 and 1.0.10, the locked versions, as
# fixed; `cargo audit` with no ignores is clean on the lock.
ignore = []
