# MCP Gateway Configuration Example
# =================================
#
# Full configuration with all available options.

server:
  host: "127.0.0.1"
  port: 39400

meta_mcp:
  enabled: true

failsafe:
  rate_limit:
    enabled: true
  health_check:
    enabled: true

backends:
  # Stdio transport (subprocess)
  tavily:
    command: "npx -y tavily-mcp@0.2.22"
    description: "Web search via Tavily API"
    timeout: "30s"
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"

  # Stdio with working directory
  filesystem:
    command: "npx -y @modelcontextprotocol/server-filesystem /home/user/docs"
    description: "Local filesystem access"
    cwd: "/home/user"
    timeout: "10s"

  # HTTP transport (Streamable HTTP)
  context7:
    url: "http://localhost:8080/mcp"
    description: "Documentation and context lookup"
    timeout: "30s"
    headers:
      Authorization: "Bearer ${CONTEXT7_TOKEN}"

  # SSE transport
  pieces:
    url: "http://localhost:39300/sse"
    description: "Long-term memory and code snippets"
    timeout: "60s"

  # Disabled backend (for reference)
  experimental:
    command: "python -m experimental_server"
    description: "Experimental features"
    enabled: false

capabilities:
  enabled: true
  directories:
    - "./capabilities"
  # Built-in examples include REST connectors such as weather, GitHub, Notion,
  # and the HeyGen video-generation tools under capabilities/media/.
