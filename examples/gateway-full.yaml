# Full MCP Gateway configuration -- all options with defaults shown.
# Copy this file and uncomment/modify sections as needed.
# Usage: mcp-gateway --config gateway-full.yaml

# Load environment files before config processing.
# Supports ~ expansion. Files that don't exist are silently skipped.
# Variables are set into the process environment for {env.VAR} resolution.
env_files:
  - ~/.mcp-gateway/.env
  # - ~/.config/mcp-gateway/secrets.env

# --- Server ---

server:
  host: "127.0.0.1"              # Bind address
  port: 39400                     # Listen port
  shutdown_timeout: 30s           # Graceful shutdown timeout
  max_body_size: 10485760         # Max request body size in bytes on every route (10 MiB; 413 above)
  replicas: 1                     # Declared process count, not observed. Above 1, startup refuses with
                                  # key_server, accounts or modern_protocol on (UPGRADING-4.0 item 37)
  # With auth on and a non-loopback bind or public_url, plain HTTP is refused
  # unless mtls is on or this names who protects it: tls_terminated_upstream,
  # cluster_internal (public_url must be <svc>.<ns>.svc[.<cluster_domain>]) or
  # host_local_publish. See docs/UPGRADING-4.0.md item 38.
  # cleartext_http: refuse
  # cluster_domain: cluster.local

# --- Authentication ---

auth:
  enabled: false                  # Enable auth (set true for networked deployments)
                                  # true turns security.transparency_log on unless it says enabled: false

  # Bearer token for simple auth.
  # Options: "auto" (random, logged at startup), "env:VAR_NAME", or a literal string.
  # bearer_token: "auto"

  # API keys for multi-client access with per-client restrictions. The config
  # holds each key's sha256 digest, never the key:
  #   printf %s "$KEY" | mcp-gateway hash-key   # prints sha256:<64 hex>
  # `env:VAR_NAME` references (holding the digest) must exist at startup.
  # api_keys:
  #   - key_sha256: "env:CLIENT_A_KEY_SHA256"
  #     name: "Client A"
  #     rate_limit: 100           # Requests per minute (0 = unlimited)
  #     backends: ["tavily"]      # Backends this key reaches; empty or omitted = none
  #     admin: false              # Set true only for UI/config management keys
  #   - key_sha256: "env:CLIENT_B_KEY_SHA256"  # or the literal sha256:<64 hex> hash-key prints
  #     name: "Client B"
  #     expires_at: "2027-01-01T00:00:00Z"  # Optional; refused with 401 after this
  #     backends: ["*"]           # All backends ("*" is the only wildcard)

  # Paths that bypass authentication.
  public_paths:
    - /health

  # Dashboard browser sessions (the link `serve` prints, or `mcp-gateway dashboard-link`).
  # A session ends after idle_timeout_secs without activity or absolute_timeout_secs after
  # sign-in. The dashboard's own refresh is not activity. Both > 0; idle <= absolute.
  # dashboard_session:
  #   idle_timeout_secs: 1800        # 30 minutes
  #   absolute_timeout_secs: 28800   # 8 hours

# --- Audit log ---
# Tamper-evident, hash-chained record of every tool call: who (credential kind,
# key fingerprint, verified issuer and subject), outcome, request and response
# hashes. Required when auth.enabled is true; the load fails without it. With
# auth on, a failed append refuses calls with 503 until an append succeeds.
# security:
#   transparency_log:
#     enabled: true
#     path: "~/.mcp-gateway/transparency/transparency.jsonl"
#     key_id: "default"
#     shared_secret: "${MCP_GATEWAY_TRANSPARENCY_SECRET}"   # optional HMAC per entry
#     # One gateway process writes a log path; a second is refused at startup
#     # after waiting up to 10 s for a restarting predecessor to exit.
#     # The log rotates into sealed segments (UPGRADING-4.0 item 49).
#     rotation:
#       max_segment_bytes: 67108864   # 1 MiB..128 MiB
#       max_segment_age_secs: 0       # 0 = rotate on size only
#       retain_segments: 12           # sealed segments kept
#       on_disk_full: expire_oldest   # or: refuse

# --- Meta-MCP ---

meta_mcp:
  enabled: true                   # Enable Meta-MCP mode (9 tools minimum / 11 in the README benchmark scenario)
  cache_ttl: 5m                   # Tool cache TTL
  # Backends to pre-connect and cache on startup.
  warm_start: []
  # warm_start:
  #   - tavily

  # Pin high-value tools directly in tools/list for one-hop invocation.
  # These tools appear with full schemas alongside the Meta-MCP surface,
  # while preserving a small prompt footprint for everything else.
  # Backends hosting surfaced tools are auto-added to warm_start.
  surfaced_tools: []
  # surfaced_tools:
  #   - server: tavily
  #     tool: tavily_search
  #   - server: brave
  #     tool: brave_web_search

# --- Streaming ---

streaming:
  enabled: true                   # Enable SSE streaming for notifications
  buffer_size: 100                # Notification buffer size per client
  keep_alive_interval: 15s        # SSE keep-alive interval
  # Backends to auto-subscribe for notifications.
  auto_subscribe: []

# --- Failsafes ---

failsafe:
  circuit_breaker:
    enabled: true
    failure_threshold: 5          # Failures before circuit opens
    success_threshold: 3          # Successes in half-open to close
    reset_timeout: 30s            # Time before half-open retry

  retry:
    enabled: true
    max_attempts: 3               # Total attempts (1 original + 2 retries)
    initial_backoff: 100ms        # First retry delay
    max_backoff: 10s              # Maximum retry delay
    multiplier: 2.0               # Backoff multiplier

  rate_limit:
    enabled: true
    requests_per_second: 100      # Per-backend RPS
    burst_size: 50                # Token bucket burst
                                  # A refusal reads "Rate limit exceeded for backend
                                  # '<name>'" and is never counted by error_budget.

  health_check:
    enabled: true
    interval: 30s                 # Health check interval
    timeout: 5s                   # Health check timeout

# --- Error Budget / Kill Switch ---

# Error budget / kill switch (GH #475). Every key is optional; an absent key
# keeps the shipped default. Thresholds are failure RATES in (0.0, 1.0].
# Throttling is never a failure sample: neither a backend's 429 nor a refusal by
# the gateway's own failsafe.rate_limit above.
error_budget:
  threshold: 0.8          # backend auto-kill at an 80% failure rate
  window_size: 100        # calls in the backend sliding window
  window_duration: 5m     # maximum age of a call in that window
  min_samples: 10         # calls required before the budget is evaluated
  capability:
    threshold: 0.8        # per-capability auto-disable rate
    window_size: 50
    window_duration: 5m
    min_samples: 5
    cooldown: 5m          # offline period before a capability auto-recovers

# --- Response Cache ---

cache:
  enabled: true                   # Enable response caching
  default_ttl: 60s                # Default cache TTL
                                  # Errors (isError: true) are never cached, so a
                                  # transient refusal is not replayed for the TTL.
  max_entries: 10000              # Max cached responses before eviction

# --- Capabilities (REST API integration) ---

capabilities:
  enabled: true                   # Enable capability system
  name: fulcrum                   # Backend name shown in gateway_list_servers
  directories:                    # Directories to load capability YAMLs from
    - ./capabilities

# --- Cost Governance (RFC-0075) ---

# cost_governance:
#   enabled: false                  # Enable cost tracking and budget enforcement
#   currency: "USD"                 # Currency label (informational)
#   default_cost: 0.0              # Default cost per tool invocation
#   budgets:
#     daily: 10.0                  # Daily budget limit (null = unlimited)
#     per_tool:                    # Per-tool daily budget overrides
#       expensive_api: 2.0
#     per_key:                     # Per-API-key daily budgets
#       heavy_user_key: 5.0
#   alerts:                        # Budget alert thresholds (sorted by at_percent)
#     - at_percent: 50
#       action: log                # log, notify, or block
#     - at_percent: 80
#       action: notify
#     - at_percent: 100
#       action: block
#   tool_costs:                    # Explicit per-tool costs (overrides default_cost)
#     tavily_search: 0.01
#     brave_search: 0.005
#   alternatives:                  # Cheaper alternatives for cost suggestions
#     search: [brave_search, tavily_search]

# --- Security Firewall (RFC-0071) ---

# security:
#   firewall:
#     enabled: true                # Enable bidirectional request/response scanning
#     scan_requests: true          # Scan tool arguments for injection
#     scan_responses: true         # Scan tool outputs for credential leaks
#     credential_redaction: true   # Auto-redact AWS keys, GitHub tokens, JWTs, etc.
#     prompt_injection_detection: true
#     anomaly_detection: false     # Opt-in: flag unusual tool transition patterns
#     anomaly_threshold: 0.7      # 0.0-1.0, higher = more permissive
#     audit_log: /var/log/mcp-gateway/audit.ndjson  # NDJSON audit trail
#     rules:                       # Per-tool glob-matched rules
#       - match: "exec_*"
#         action: block            # allow, warn, or block
#         reason: "Execution tools blocked by policy"
#         scan: [shell_injection, path_traversal]
#       - match: "*"
#         action: warn
#         scan: [credentials, sql_injection]

# --- Context Integrity (tool-result boundary protection) ---

# security:
#   # standard (default) or hardened. Restart-only. hardened currently enforces:
#   # context_integrity preset at least team_shared (enterprise_strict kept),
#   # non_bypassable on; firewall and anomaly detection on, blocking at
#   # anomaly_block_threshold 1.0 unless set within [0.9, 1.0] (below 0.9
#   # refuses start); refusal of calls the full learned-pair map cannot learn;
#   # and a build with the firewall feature. Later releases extend this list.
#   # A multi-user deployment on standard gets a startup warning and a
#   # `doctor` security-posture finding.
#   posture: standard
#   context_integrity:
#     # monitor_only is the default safe rollout. Use team_shared to enforce the
#     # free/core shared-team baseline. enterprise_strict is enterprise scope.
#     preset: monitor_only          # monitor_only, local_developer, team_shared, audit_only, enterprise_strict

# --- Backends (MCP servers) ---

backends:
  # Example: stdio backend (spawns a subprocess)
  # tavily:
  #   # `command` is parsed with host-platform rules (POSIX shlex on unix;
  #   # CommandLineToArgvW on Windows). Backslash paths are fine on Windows;
  #   # quote any path that contains spaces.
  #   command: "npx -y tavily-mcp@0.2.22"
  #   description: "Web search via Tavily"
  #   enabled: true
  #   timeout: 30s
  #   stop_when_idle_for: 5m      # Stop this backend after 5 min unused;
  #                               # the next request restarts it. Valid ONLY for
  #                               # a backend the gateway starts itself (one with
  #                               # a `command`) - the gateway cannot stop a
  #                               # server it did not start, so this is rejected
  #                               # at config load for `http_url` backends,
  #                               # including local ones. Omit it to never stop.
  #   input_schema_enforcement: closed  # Undeclared tool-call argument keys:
  #                               # `closed` (default) refuses them, and a level
  #                               # listing `properties` without
  #                               # `additionalProperties` counts as closed;
  #                               # `standard` follows JSON Schema's open
  #                               # default; `off` skips the check.
  #   # allow_flagged_tools:      # Serve a tool whose description failed the
  #   #   tool_name: "<digest>"   # tool-poisoning check, pinned to the 64-hex
  #   #                           # digest its `Tool withheld` warning logs.
  #   env:
  #     TAVILY_API_KEY: "${TAVILY_API_KEY}"
  #   cwd: /tmp                   # Working directory (stdio only)

  # Example: HTTP backend (connects to running server)
  # context7:
  #   http_url: "http://localhost:8080/mcp"
  #   description: "Documentation lookup"
  #   streamable_http: true       # Use Streamable HTTP (no SSE handshake)
  #   protocol_version: "2025-03-26"  # Override protocol version
  #   headers:
  #     Authorization: "Bearer ${API_TOKEN}"
  #   allow_cleartext_credentials: false  # Credential-bearing configuration —
  #                               # any header, an oauth or identity_propagation
  #                               # section, secrets, or userinfo or a query in
  #                               # the URL — is refused over `http://` to a host
  #                               # off this machine; loopback (as above) is
  #                               # exempt. Set it true to accept that what is
  #                               # sent is readable and replayable in transit.

  # Example: SSE backend
  # pieces:
  #   http_url: "http://localhost:39300/sse"
  #   description: "Pieces LTM"

  # Example: GitMCP — free remote MCP server that auto-generates docs + code
  # search tools for any public GitHub repository (https://gitmcp.io).
  #
  # The `/docs` route is a dynamic dispatcher: the tools it exposes
  # (`fetch_generic_url_content`, `search_generic_code`, `search_generic_documentation`)
  # accept a repo URL as an argument, so a single backend covers every GitHub repo.
  #
  # For a repo-pinned backend, point `http_url` at the repo-specific route:
  #   gitmcp_mcp_gateway:
  #     http_url: "https://gitmcp.io/MikkoParkkola/mcp-gateway/sse"
  #     description: "GitMCP — docs + search for MikkoParkkola/mcp-gateway"
  # Repo-pinned routes expose tools named after the repo
  # (e.g. `fetch_mcp_gateway_documentation`, `search_mcp_gateway_code`).
  #
  # Transport: SSE (http_url ends in /sse, streamable_http unset: detected at connect).
  # Auth: none required for public repos.
  # gitmcp_docs:
  #   http_url: "https://gitmcp.io/docs/sse"
  #   description: "GitMCP — on-demand docs + code search for any GitHub repo"
  #   timeout: 30s

  # Example: backend with OAuth
  # google:
  #   http_url: "https://mcp.googleapis.com/mcp"
  #   description: "Google services"
  #   oauth:
  #     enabled: true
  #     scopes:
  #       - "https://www.googleapis.com/auth/gmail.readonly"
  #     client_id: "env:GOOGLE_CLIENT_ID"
